<!DOCTYPE html>
<html>
<head>
  <!-- Living Print v6 — premium cinematic shutter + instant re-scan test -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }


    /* ================================
       START BUTTON
    ================================= */

    #startButton {

      position: fixed;

      z-index: 9999;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      padding: 18px 38px;

      font-size: 18px;
      font-weight: 600;

      letter-spacing: 2px;

      border: 1px solid #d4af37;

      border-radius: 50px;

      background: #111;

      color: #d4af37;

      cursor: pointer;
    }


    /* ================================
       LOADING
    ================================= */

    #loadingText {

      position: fixed;

      z-index: 9998;

      top: 60%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      color: #d4af37;

      font-size: 14px;

      letter-spacing: 2px;

      text-align: center;
    }


    /* ================================
       STATUS
    ================================= */

    #status {

      position: fixed;

      z-index: 9997;

      bottom: 25px;
      left: 50%;

      transform:
        translateX(-50%);

      color: #d4af37;

      font-size: 12px;

      letter-spacing: 1.5px;

      text-align: center;

      pointer-events: none;
    }


    /* ================================
       NATIVE AR UI — HIDDEN
       Custom gold scanner replaces it
    ================================= */

    .a-enter-vr,
    .a-enter-ar,
    .mindar-ui-loading,
    .mindar-ui-scanning,
    .mindar-ui-scanning > div {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* ================================
       MAGICAL SCANNER — TEST ONLY
       PREMIUM GOLD HUD
    ================================= */

    #magicScanner {
      position: fixed;
      inset: 0;
      z-index: 9996;
      display: none;
      pointer-events: none;
      overflow: hidden;
      background: transparent;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    #magicScanner.active {
      display: block;
      opacity: 1;
    }

    #magicVignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center,
          transparent 0%,
          transparent 42%,
          rgba(0,0,0,0.12) 66%,
          rgba(0,0,0,0.68) 100%);
    }

    #magicVignette::before,
    #magicVignette::after {
      content: "";
      position: absolute;
      left: -20%;
      width: 140%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(212,175,55,0.05),
        rgba(255,214,85,0.32),
        rgba(212,175,55,0.05),
        transparent);
      box-shadow: 0 0 18px rgba(212,175,55,0.18);
      opacity: 0.65;
    }

    #magicVignette::before { top: 26%; }
    #magicVignette::after { bottom: 26%; }

    #magicCorners {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78vw, 350px);
      height: min(78vw, 350px);
      transform: translate(-50%, -50%);
      opacity: 1;
    }

    .magicCorner {
      position: absolute;
      width: 58px;
      height: 58px;
      box-sizing: border-box;
      border-color: rgba(255,198,55,0.98) !important;
      filter:
        drop-shadow(0 0 4px rgba(255,198,55,0.95))
        drop-shadow(0 0 13px rgba(255,184,35,0.55));
      animation: cornerGlow 2.4s ease-in-out infinite;
    }

    .magicCorner.tl {
      left: 0; top: 0;
      border-left: 5px solid rgba(255,198,55,0.98) !important;
      border-top: 5px solid rgba(255,198,55,0.98) !important;
      border-radius: 18px 0 0 0;
    }
    .magicCorner.tr {
      right: 0; top: 0;
      border-right: 5px solid rgba(255,198,55,0.98) !important;
      border-top: 5px solid rgba(255,198,55,0.98) !important;
      border-radius: 0 18px 0 0;
    }
    .magicCorner.bl {
      left: 0; bottom: 0;
      border-left: 5px solid rgba(255,198,55,0.98) !important;
      border-bottom: 5px solid rgba(255,198,55,0.98) !important;
      border-radius: 0 0 0 18px;
    }
    .magicCorner.br {
      right: 0; bottom: 0;
      border-right: 5px solid rgba(255,198,55,0.98) !important;
      border-bottom: 5px solid rgba(255,198,55,0.98) !important;
      border-radius: 0 0 18px 0;
    }

    #magicReticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 142px;
      height: 142px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 50%;
      box-shadow:
        0 0 18px rgba(212,175,55,0.18),
        inset 0 0 22px rgba(212,175,55,0.05);
      animation: magicPulse 2.4s ease-in-out infinite;
    }

    #magicReticle::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px dashed rgba(212,175,55,0.45);
      border-radius: 50%;
      animation: reticleSpin 12s linear infinite;
    }

    #magicReticle::after {
      content: "";
      position: absolute;
      inset: 49px;
      border: 1px solid rgba(255,224,130,0.9);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(212,175,55,0.42);
    }

    #magicBeam {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(88vw, 430px);
      height: 2px;
      transform: translate(-50%, -50%);
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(212,175,55,0.12) 12%,
        rgba(255,232,150,0.95) 43%,
        rgba(255,255,220,1) 50%,
        rgba(255,232,150,0.95) 57%,
        rgba(212,175,55,0.12) 88%,
        transparent 100%);
      box-shadow:
        0 0 7px rgba(255,225,110,0.95),
        0 0 22px rgba(212,175,55,0.52);
      animation: magicScan 2.2s ease-in-out infinite;
    }

    #magicBeam::before,
    #magicBeam::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 54px;
      height: 1px;
      background: rgba(255,184,35,0.55);
      transform: translateY(-50%);
      box-shadow: 0 0 8px rgba(212,175,55,0.4);
    }

    #magicBeam::before { left: 20px; }
    #magicBeam::after { right: 20px; }

    #magicLabel {
      position: absolute;
      left: 50%;
      bottom: 11.5%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 88vw;
      color: rgba(242,211,128,0.98);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 3.6px;
      text-align: center;
      text-shadow:
        0 0 7px rgba(212,175,55,0.65),
        0 0 18px rgba(212,175,55,0.28);
      animation: magicLabelPulse 2.2s ease-in-out infinite;
    }

    #magicLabel::before {
      content: "✦";
      margin-right: 10px;
      font-size: 10px;
    }

    #magicLabel::after {
      content: "✦";
      margin-left: 10px;
      font-size: 10px;
    }

    #magicParticles {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .magicParticle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,221,115,0.92);
      box-shadow: 0 0 8px rgba(255,190,35,0.95);
      animation: magicFloat linear infinite;
    }

    @keyframes magicPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(0.94);
        opacity: 0.62;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.04);
        opacity: 1;
      }
    }

    @keyframes reticleSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes magicScan {
      0%, 100% {
        transform: translate(-50%, -50%) scaleX(0.62);
        opacity: 0.42;
      }
      50% {
        transform: translate(-50%, -50%) scaleX(1);
        opacity: 1;
      }
    }

    @keyframes cornerGlow {
      0%, 100% { opacity: 0.68; }
      50% { opacity: 1; }
    }

    @keyframes magicLabelPulse {
      0%, 100% { opacity: 0.62; letter-spacing: 3px; }
      50% { opacity: 1; letter-spacing: 3.8px; }
    }

    @keyframes magicFloat {
      0% { transform: translate3d(0, 20px, 0) scale(0.6); opacity: 0; }
      12% { opacity: 0.8; }
      88% { opacity: 0.35; }
      100% { transform: translate3d(var(--drift), -110vh, 0) scale(1.2); opacity: 0; }
    }


    /* ================================
       VIDEO EXPERIENCE
    ================================= */

    #experience {

      position: fixed;

      inset: 0;

      z-index: 10000;

      display: none;

      background: transparent;

      pointer-events: none;

      overflow: hidden;
    }


    /*
      Only the video itself is visible.
      Camera remains visible around it
      during the cinematic phase.
    */

    #experienceVideo {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 1px;

      object-fit: contain;

      transform:
        translate(-50%, -50%)
        scale(1);

      background: transparent;

      z-index: 10001;

      pointer-events: none;

      transition:
        width 3s
        cubic-bezier(0.22, 1, 0.36, 1),

        height 3s
        cubic-bezier(0.22, 1, 0.36, 1);
    }


    /* ================================
       CLOSE BUTTON
    ================================= */

    #closeButton {

      position: fixed;

      z-index: 10010;

      top: 14px;
      right: 14px;

      width: 32px;
      height: 32px;

      padding: 0;

      border-radius: 50%;

      border: 1px solid
        rgba(212,175,55,0.9);

      background:
        rgba(0,0,0,0.75);

      color: #d4af37;

      font-size: 18px;

      font-weight: 300;

      line-height: 29px;

      text-align: center;

      display: none;

      pointer-events: auto;

      touch-action: manipulation;

      -webkit-tap-highlight-color:
        transparent;

      cursor: pointer;
    }


    #experience.showClose #closeButton {

      display: block;
    }


  


/* LIVING PRINT v6 — PREMIUM CINEMATIC MORPH + SUBTLE SHUTTER + RE-SCAN FIX */
#livingMorph{
  position:fixed;
  inset:0;
  z-index:10002;
  display:none;
  pointer-events:none;
  overflow:hidden;
  background:transparent;
}
#livingMorph.active{display:block}

/* LIVING PRINT v5 — SUBTLE CINEMATIC SHUTTER */
#livingShutter{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
  opacity:0;
  overflow:hidden;
}
#livingShutter .shutterBlade{
  position:absolute;
  background:linear-gradient(90deg,
    rgba(0,0,0,0),
    rgba(0,0,0,.82) 35%,
    rgba(0,0,0,.96) 50%,
    rgba(0,0,0,.82) 65%,
    rgba(0,0,0,0));
  box-shadow:0 0 18px rgba(212,175,55,.10);
}
#livingShutter .shutterTop,
#livingShutter .shutterBottom{
  left:0;
  width:100%;
  height:16%;
}
#livingShutter .shutterTop{top:-16%; transform:translateY(0);}
#livingShutter .shutterBottom{bottom:-16%; transform:translateY(0) rotate(180deg);}
#livingShutter .shutterLeft,
#livingShutter .shutterRight{
  top:0;
  width:16%;
  height:100%;
  background:linear-gradient(180deg,
    rgba(0,0,0,0),
    rgba(0,0,0,.82) 35%,
    rgba(0,0,0,.96) 50%,
    rgba(0,0,0,.82) 65%,
    rgba(0,0,0,0));
}
#livingShutter .shutterLeft{left:-16%;}
#livingShutter .shutterRight{right:-16%; transform:rotate(180deg);}
#livingShutter .shutterLine{
  position:absolute;
  left:50%;
  top:50%;
  width:0;
  height:1px;
  transform:translate(-50%,-50%);
  background:rgba(255,226,135,.9);
  box-shadow:0 0 10px rgba(255,220,110,.7),0 0 24px rgba(212,175,55,.28);
}
#livingMorph.active #livingShutter{
  animation:shutterMaster 2.9s cubic-bezier(.22,1,.36,1) forwards;
}
#livingMorph.active #livingShutter .shutterTop{
  animation:shutterTop 2.9s cubic-bezier(.22,1,.36,1) forwards;
}
#livingMorph.active #livingShutter .shutterBottom{
  animation:shutterBottom 2.9s cubic-bezier(.22,1,.36,1) forwards;
}
#livingMorph.active #livingShutter .shutterLeft{
  animation:shutterLeft 2.9s cubic-bezier(.22,1,.36,1) forwards;
}
#livingMorph.active #livingShutter .shutterRight{
  animation:shutterRight 2.9s cubic-bezier(.22,1,.36,1) forwards;
}
#livingMorph.active #livingShutter .shutterLine{
  animation:shutterLine 2.9s ease-out forwards;
}

#livingPoster{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--morph-w,76vw);
  height:var(--morph-h,42.75vw);
  max-width:92vw;
  max-height:82vh;
  object-fit:cover;
  transform:translate(-50%,-50%) scale(.94);
  opacity:0;
  filter:brightness(.88) saturate(.94) contrast(1.01);
  border-radius:5px;
  box-shadow:
    0 0 0 1px rgba(212,175,55,.16),
    0 10px 45px rgba(0,0,0,.38);
  will-change:transform,opacity,filter;
}
#livingMorph.active #livingPoster{
  animation:premiumPosterMorph 2.9s cubic-bezier(.16,1,.3,1) forwards;
}

#livingMorph .livingLight{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--morph-w,76vw);
  height:var(--morph-h,42.75vw);
  max-width:92vw;
  max-height:82vh;
  transform:translate(-50%,-50%) scale(.96);
  border-radius:6px;
  overflow:hidden;
  opacity:0;
  mix-blend-mode:screen;
}
#livingMorph.active .livingLight{
  animation:premiumLightBody 2.45s ease-out forwards;
}
#livingMorph .livingLight:before{
  content:"";
  position:absolute;
  inset:-35%;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(255,238,177,.30) 0%,
      rgba(212,175,55,.12) 34%,
      transparent 68%);
  filter:blur(9px);
}
#livingMorph.active .livingLight:before{
  animation:premiumAura 2.65s ease-out forwards;
}
#livingMorph .livingLight:after{
  content:"";
  position:absolute;
  top:-35%;
  left:-42%;
  width:18%;
  height:170%;
  transform:rotate(15deg);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,242,190,.16),
    rgba(255,255,238,.92),
    rgba(255,220,110,.20),
    transparent
  );
  filter:blur(2px);
  box-shadow:0 0 36px rgba(255,220,110,.48);
}
#livingMorph.active .livingLight:after{
  animation:premiumSweep 1.65s cubic-bezier(.22,1,.36,1) .38s forwards;
}

#livingMorph:before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:var(--morph-w,76vw);
  height:var(--morph-h,42.75vw);
  max-width:92vw;
  max-height:82vh;
  transform:translate(-50%,-50%) scale(.965);
  border-radius:5px;
  border:1px solid rgba(255,220,112,.58);
  box-shadow:
    0 0 8px rgba(255,226,135,.22),
    0 0 34px rgba(212,175,55,.16),
    inset 0 0 22px rgba(255,220,112,.08);
  opacity:0;
}
#livingMorph.active:before{
  animation:premiumFrame 2.75s cubic-bezier(.22,1,.36,1) forwards;
}

#livingMorph:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:calc(var(--morph-w,76vw) * 1.08);
  height:calc(var(--morph-h,42.75vw) * 1.08);
  max-width:96vw;
  max-height:86vh;
  transform:translate(-50%,-50%) scale(.9);
  border-radius:8px;
  background:radial-gradient(
    ellipse at center,
    rgba(255,230,142,.16) 0%,
    rgba(212,175,55,.07) 35%,
    transparent 70%
  );
  opacity:0;
}
#livingMorph.active:after{
  animation:premiumGlow 2.7s ease-out forwards;
}

@keyframes shutterMaster{
  0%,58%{opacity:0;}
  68%{opacity:.14;}
  78%{opacity:.72;}
  84%{opacity:.92;}
  91%{opacity:.38;}
  100%{opacity:0;}
}
@keyframes shutterTop{
  0%,62%{transform:translateY(0);}
  78%{transform:translateY(115%);}
  84%{transform:translateY(115%);}
  100%{transform:translateY(0);}
}
@keyframes shutterBottom{
  0%,62%{transform:translateY(0) rotate(180deg);}
  78%{transform:translateY(-115%) rotate(180deg);}
  84%{transform:translateY(-115%) rotate(180deg);}
  100%{transform:translateY(0) rotate(180deg);}
}
@keyframes shutterLeft{
  0%,62%{transform:translateX(0);}
  78%{transform:translateX(115%);}
  84%{transform:translateX(115%);}
  100%{transform:translateX(0);}
}
@keyframes shutterRight{
  0%,62%{transform:translateX(0) rotate(180deg);}
  78%{transform:translateX(-115%) rotate(180deg);}
  84%{transform:translateX(-115%) rotate(180deg);}
  100%{transform:translateX(0) rotate(180deg);}
}
@keyframes shutterLine{
  0%,62%{width:0;opacity:0;}
  78%{width:86%;opacity:.85;}
  84%{width:86%;opacity:1;}
  91%{width:0;opacity:0;}
  100%{width:0;opacity:0;}
}

@keyframes premiumPosterMorph{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.94);
    filter:brightness(.82) saturate(.90) contrast(1);
  }
  13%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.99);
    filter:brightness(.98) saturate(.98) contrast(1.01);
  }
  43%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.018);
    filter:brightness(1.04) saturate(1.02) contrast(1.02);
  }
  67%{
    opacity:.82;
    transform:translate(-50%,-50%) scale(1.055);
    filter:brightness(1.13) saturate(1.06) contrast(1.03);
  }
  84%{
    opacity:.40;
    transform:translate(-50%,-50%) scale(1.095);
    filter:brightness(1.25) saturate(1.08) contrast(1.02);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.13);
    filter:brightness(1.38) saturate(1.10) contrast(1);
  }
}

@keyframes premiumLightBody{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.96)}
  24%{opacity:.82}
  58%{opacity:.48}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.11)}
}
@keyframes premiumAura{
  0%{opacity:0;transform:scale(.82)}
  30%{opacity:.78}
  64%{opacity:.36}
  100%{opacity:0;transform:scale(1.16)}
}
@keyframes premiumSweep{
  0%{left:-42%;opacity:0}
  18%{opacity:1}
  70%{opacity:.72}
  100%{left:132%;opacity:0}
}
@keyframes premiumFrame{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.965)}
  24%{opacity:.72}
  55%{opacity:.48}
  78%{opacity:.18}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}
}
@keyframes premiumGlow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
  30%{opacity:.78}
  62%{opacity:.34}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.16)}
}

</style>

</head>


<body>


<button
  id="startButton"
  disabled>

  LOADING...

</button>


<div id="loadingText">

  LOADING AR EXPERIENCE...

</div>


<div id="status"></div>


<!-- =================================
     MAGICAL SCANNER — TEST ONLY
================================= -->
<div id="magicScanner" aria-hidden="true">
  <div id="magicVignette"></div>
  <div id="magicParticles">
    <i class="magicParticle" style="left:8%; bottom:-4%; --drift:35px; animation-duration:8s; animation-delay:-1s;"></i>
    <i class="magicParticle" style="left:18%; bottom:-7%; --drift:-28px; animation-duration:10s; animation-delay:-5s;"></i>
    <i class="magicParticle" style="left:31%; bottom:-5%; --drift:42px; animation-duration:9s; animation-delay:-3s;"></i>
    <i class="magicParticle" style="left:46%; bottom:-6%; --drift:-24px; animation-duration:11s; animation-delay:-7s;"></i>
    <i class="magicParticle" style="left:61%; bottom:-5%; --drift:30px; animation-duration:8.5s; animation-delay:-2s;"></i>
    <i class="magicParticle" style="left:76%; bottom:-8%; --drift:-40px; animation-duration:10.5s; animation-delay:-6s;"></i>
    <i class="magicParticle" style="left:90%; bottom:-4%; --drift:25px; animation-duration:9.5s; animation-delay:-4s;"></i>
  </div>
  <div id="magicCorners">
    <span class="magicCorner tl"></span>
    <span class="magicCorner tr"></span>
    <span class="magicCorner bl"></span>
    <span class="magicCorner br"></span>
  </div>
  <div id="magicReticle"></div>
  <div id="magicBeam"></div>
  <div id="magicLabel">SEARCHING FOR YOUR PRINT</div>
</div>




<div id="livingMorph" aria-hidden="true">
  <img id="livingPoster" alt="">
  <div class="livingLight"></div>
  <div id="livingShutter" aria-hidden="true">
    <div class="shutterBlade shutterTop"></div>
    <div class="shutterBlade shutterBottom"></div>
    <div class="shutterBlade shutterLeft"></div>
    <div class="shutterBlade shutterRight"></div>
    <div class="shutterLine"></div>
  </div>
</div>

<!-- =================================
     VIDEO EXPERIENCE
================================= -->

<div id="experience">

  <button
    id="closeButton"
    type="button">

    ×

  </button>

</div>


<!-- =================================
     PRODUCTION AR CORE
================================= -->

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets id="videoAssets"></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>


<script>


/* =================================
   ELEMENTS
================================= */

const startButton =
  document.querySelector(
    "#startButton"
  );


const loadingText =
  document.querySelector(
    "#loadingText"
  );


const status =
  document.querySelector(
    "#status"
  );


const magicScanner =
  document.querySelector(
    "#magicScanner"
  );


const scene =
  document.querySelector(
    "a-scene"
  );


const videoAssets =
  document.querySelector(
    "#videoAssets"
  );


const experience =
  document.querySelector(
    "#experience"
  );


const closeButton =
  document.querySelector(
    "#closeButton"
  );

const livingMorph =
  document.querySelector(
    "#livingMorph"
  );

const livingPoster =
  document.querySelector(
    "#livingPoster"
  );


/* =================================
   STATE
================================= */

let videos = [];

let targetsReady = false;

let experienceActive = false;

let currentVideo = null;

let currentPlane = null;

/* Prevent targetFound + targetUpdate from
   starting the same experience twice. */
let activationInProgress = false;


/* =================================
   VIDEO SIZE
================================= */

function fitVideoToScreen(video) {

  const vw =
    window.innerWidth;

  const vh =
    window.innerHeight;


  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  if (
    !videoWidth ||
    !videoHeight
  ) {

    video.style.width =
      vw + "px";

    video.style.height =
      vh + "px";

    return;

  }


  const ratio =
    videoWidth /
    videoHeight;


  if (
    vw / vh > ratio
  ) {

    video.style.height =
      vh + "px";

    video.style.width =
      (vh * ratio) + "px";

  } else {

    video.style.width =
      vw + "px";

    video.style.height =
      (vw / ratio) + "px";

  }

}


/* =================================
   MAGICAL SCANNER — TEST CONTROL
================================= */

function showMagicScanner() {
  magicScanner.classList.add("active");
}

function hideMagicScanner() {
  magicScanner.classList.remove("active");
}


/* =================================
   LOAD CONTENT
================================= */

async function loadContent() {

  try {

    loadingText.style.display =
      "block";


    loadingText.textContent =
      "LOADING AR EXPERIENCE...";


    const response =
      await fetch(
        "./content.json"
      );


    if (!response.ok) {

      throw new Error(
        "Could not load content.json"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters found"
      );

    }


    /* ================================
       CREATE CONTENT
    ================================= */

    data.posters.forEach(
      poster => {


        const videoId =
          "video_" + poster.id;


        /* ================================
           VIDEO
        ================================= */

        const video =
          document.createElement(
            "video"
          );


        video.id =
          videoId;


        video.src =
          "./" + poster.video;


        video.loop =
          true;


        video.crossOrigin =
          "anonymous";


        video.playsInline =
          true;


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        /*
          Keep browser ready for playback.
        */

        video.preload =
          "auto";


        videoAssets.appendChild(
          video
        );


        videos.push(
          video
        );


        /* ================================
           TARGET
        ================================= */

        const target =
          document.createElement(
            "a-entity"
          );


        target.setAttribute(
          "mindar-image-target",

          "targetIndex: " +
          poster.targetIndex
        );


        /* ================================
           AR VIDEO PLANE
        ================================= */

        const videoPlane =
          document.createElement(
            "a-video"
          );


        videoPlane.setAttribute(
          "src",
          "#" + videoId
        );


        videoPlane.setAttribute(
          "position",
          "0 0 0"
        );


        videoPlane.setAttribute(
          "width",
          "1"
        );


        videoPlane.setAttribute(
          "height",
          "1"
        );


        videoPlane.setAttribute(
          "material",
          "shader: flat"
        );


        target.appendChild(
          videoPlane
        );


        scene.appendChild(
          target
        );


        /* ================================
           TARGET ACTIVATION
           TARGET FOUND + TARGET UPDATE

           Some devices can resume MindAR
           after closing without emitting a
           fresh targetFound event immediately.
           targetUpdate lets us re-arm the same
           poster without asking the user to
           point at a blank area first.
        ================================= */

        async function activateTarget() {

          if (
            experienceActive ||
            activationInProgress
          ) {

            return;

          }

          activationInProgress = true;

          console.log(
            "TARGET ACTIVATED:",
            poster.id
          );

          hideMagicScanner();

          showLivingMorph(poster.id, video);

          stopOtherVideos(video);

          currentVideo = video;
          currentPlane = videoPlane;

          videoPlane.setAttribute(
            "visible",
            "false"
          );

          try {

            video.currentTime = 0;
            video.muted = false;

            await video.play();

            setTimeout(() => {

              startExperience(
                video,
                videoPlane
              );

              setTimeout(() => {
                hideLivingMorph();
              }, 1150);

            }, 450);

          } catch (error) {

            console.error(
              "Video play error:",
              error
            );

            activationInProgress = false;

          }

        }

        target.addEventListener(
          "targetFound",
          activateTarget
        );

        target.addEventListener(
          "targetUpdate",
          activateTarget
        );


        /* ================================
           TARGET LOST
        ================================= */

        target.addEventListener(
          "targetLost",

          () => {


            /*
              Once experience starts,
              poster tracking has no
              control over the video.
            */

            if (
              experienceActive
            ) {

              return;

            }


            video.pause();

          }
        );

      }
    );


    targetsReady =
      true;


    loadingText.style.display =
      "none";


    startButton.disabled =
      false;


    startButton.textContent =
      "START AR";


  } catch (error) {

    console.error(
      "Content error:",
      error
    );


    loadingText.textContent =
      "FAILED TO LOAD AR";


    startButton.disabled =
      true;

  }

}


/* =================================
   STOP OTHER VIDEOS
================================= */

function stopOtherVideos(
  currentVideo
) {

  videos.forEach(
    video => {

      if (
        video !== currentVideo
      ) {

        video.pause();

        video.currentTime =
          0;

      }

    }
  );

}



function showLivingMorph(posterId, video) {

  livingMorph.classList.remove("active");

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const videoW = video && video.videoWidth
    ? video.videoWidth
    : 16;

  const videoH = video && video.videoHeight
    ? video.videoHeight
    : 9;

  const ratio = videoW / videoH;

  /* Match the transition frame to the actual video ratio. */
  let frameW = Math.min(vw * 0.82, 430);
  let frameH = frameW / ratio;

  if (frameH > vh * 0.72) {
    frameH = vh * 0.72;
    frameW = frameH * ratio;
  }

  livingMorph.style.setProperty(
    "--morph-w",
    frameW + "px"
  );

  livingMorph.style.setProperty(
    "--morph-h",
    frameH + "px"
  );

  livingPoster.src =
    "./targets/" + posterId + ".jpg";

  livingPoster.style.display = "block";

  void livingMorph.offsetWidth;

  livingMorph.classList.add("active");
}

function hideLivingMorph() {
  livingMorph.classList.remove("active");
  livingPoster.removeAttribute("src");
}


/* =================================
   START EXPERIENCE
================================= */

async function startExperience(
  video,
  videoPlane
) {


  if (
    experienceActive
  ) {

    return;

  }


  /*
    LOCK IMMEDIATELY.

    Poster movement/loss cannot
    cancel this experience.
  */

  experienceActive =
    true;


  /*
    Hide the AR plane.
  */

  videoPlane.setAttribute(
    "visible",
    "false"
  );


  /*
    Wait for actual dimensions.
  */

  if (
    video.readyState < 1
  ) {

    await new Promise(
      resolve => {

        video.addEventListener(
          "loadedmetadata",
          resolve,
          {
            once: true
          }
        );

      }
    );

  }


  /*
    Move SAME video element
    out of A-Frame assets.

    No second video.
  */

  experience.appendChild(
    video
  );


  /*
    Make it visible.
  */

  video.style.display =
    "block";


  video.style.position =
    "fixed";


  video.style.left =
    "50%";


  video.style.top =
    "50%";


  video.style.zIndex =
    "10001";


  video.style.pointerEvents =
    "none";


  video.style.objectFit =
    "contain";


  video.style.background =
    "transparent";


  /* CINEMATIC SAME-FRAME MORPH */
  fitVideoToScreen(video);

  const finalWidth = video.style.width;
  const finalHeight = video.style.height;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const videoRatio =
    video.videoWidth && video.videoHeight
      ? video.videoWidth / video.videoHeight
      : 16 / 9;

  let posterFrameW = Math.min(vw * 0.82, 430);
  let posterFrameH = posterFrameW / videoRatio;

  if (posterFrameH > vh * 0.72) {
    posterFrameH = vh * 0.72;
    posterFrameW = posterFrameH * videoRatio;
  }

  video.style.width = posterFrameW + "px";
  video.style.height = posterFrameH + "px";
  video.style.objectFit = "cover";
  video.style.opacity = "0";
  video.style.borderRadius = "3px";
  video.style.transform = "translate(-50%, -50%) scale(.985)";
  video.style.clipPath = "inset(0 0 0 0 round 3px)";

  video.style.transition =
    "width 2.65s cubic-bezier(0.22, 1, 0.36, 1), " +
    "height 2.65s cubic-bezier(0.22, 1, 0.36, 1), " +
    "opacity 1.25s ease, " +
    "transform 2.65s cubic-bezier(0.22, 1, 0.36, 1), " +
    "clip-path 2.65s cubic-bezier(0.22, 1, 0.36, 1)";

  void video.offsetWidth;

  experience.style.display = "block";
  experience.classList.add("showClose");

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      video.style.opacity = "1";
      video.style.width = finalWidth;
      video.style.height = finalHeight;
      video.style.transform = "translate(-50%, -50%) scale(1)";
      video.style.clipPath = "inset(0 0 0 0 round 0px)";
    });
  });


  /*
    IMPORTANT:

    Stop MindAR AFTER the video
    has already started.

    The video itself continues.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    await arSystem.stop();


    console.log(
      "MindAR stopped after hand-off."
    );


  } catch (error) {

    console.log(
      "MindAR stop:",
      error
    );

  }


  status.textContent =
    "✦ ENJOY THE EXPERIENCE ✦";

}


/* =================================
   CLOSE EXPERIENCE
================================= */

async function closeExperience(
  event
) {


  if (event) {

    event.preventDefault();

    event.stopPropagation();

  }


  /*
    Stop current video.
  */

  if (
    currentVideo
  ) {

    currentVideo.pause();


    currentVideo.currentTime =
      0;


    /*
      Return SAME video element
      to A-Frame assets.
    */

    videoAssets.appendChild(
      currentVideo
    );


    /*
      Clear fullscreen styles.
    */

    currentVideo.style.display =
      "";


    currentVideo.style.position =
      "";


    currentVideo.style.left =
      "";


    currentVideo.style.top =
      "";


    currentVideo.style.width =
      "";


    currentVideo.style.height =
      "";


    currentVideo.style.zIndex =
      "";


    currentVideo.style.pointerEvents =
      "";


    currentVideo.style.objectFit =
      "";


    currentVideo.style.background =
      "";


    currentVideo.style.transition =
      "";

  }


  /*
    IMPORTANT:

    Keep the AR video plane hidden
    after closing.

    Otherwise A-Frame can keep the
    last rendered video frame visible
    inside the scanner.
  */

  if (
    currentPlane
  ) {

    currentPlane.setAttribute(
      "visible",
      "false"
    );

  }


  /*
    Hide experience.
  */

  hideLivingMorph();

  experience.classList.remove(
    "showClose"
  );


  experience.style.display =
    "none";


  /*
    Reset every AR video plane so
    no previous video's rendered frame
    remains in the scanner.
  */

  scene.querySelectorAll(
    "[mindar-image-target] a-video"
  ).forEach(
    plane => {

      plane.setAttribute(
        "visible",
        "false"
      );

    }
  );


  /*
    Reset state.
  */

  experienceActive =
    false;

  /* Re-arm detection so the next target
     can trigger immediately after close. */
  activationInProgress = false;


  currentVideo =
    null;


  currentPlane =
    null;


  status.textContent =
    "RESTARTING CAMERA...";


  hideMagicScanner();


  /*
    Restart MindAR.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    await arSystem.start();


    status.textContent =
      "POINT CAMERA AT YOUR POSTER";


    showMagicScanner();


  } catch (error) {

    console.error(
      "AR restart error:",
      error
    );


    status.textContent =
      "POINT CAMERA AT YOUR POSTER";

  }

}


/* =================================
   CLOSE BUTTON
================================= */

closeButton.addEventListener(
  "click",
  closeExperience
);


closeButton.addEventListener(
  "touchend",

  event => {

    event.preventDefault();

    event.stopPropagation();

    closeExperience(event);

  },

  {
    passive: false
  }
);


/* =================================
   RESIZE
================================= */

window.addEventListener(
  "resize",

  () => {

    if (
      experienceActive &&
      currentVideo
    ) {

      fitVideoToScreen(
        currentVideo
      );

    }

  }
);


/* =================================
   START AR
================================= */

startButton.addEventListener(
  "click",

  async () => {


    if (
      !targetsReady
    ) {

      return;

    }


    startButton.style.display =
      "none";


    loadingText.style.display =
      "none";


    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    try {

      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


      showMagicScanner();


    } catch (error) {

      console.error(
        "AR start error:",
        error
      );


      startButton.style.display =
        "block";


      startButton.textContent =
        "START AR";


      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* =================================
   LOAD
================================= */

loadContent();

</script>

</body>
</html>
