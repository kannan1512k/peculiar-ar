name: Deploy Live Posters

on:
  push:
    branches:
      - main
    paths:
      - 'unveil/**'
      - '.github/workflows/deploy-liveposters.yml'

  repository_dispatch:
    types:
      - unveil_updated

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Unveil as site root
        uses: actions/upload-pages-artifact@v4
        with:
          path: './unveil'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
