name: Build AR Targets

on:
  workflow_dispatch:
  push:
    paths:
      - "targets/**"
      - "*.mp4"

permissions:
  contents: write

concurrency:
  group: build-ar-targets
  cancel-in-progress: false

jobs:
  build-targets:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Clone MindAR v1.2.5
        run: |
          git clone --depth 1 --branch v1.2.5 \
            https://github.com/hiukim/mind-ar-js.git mindar

      - name: Install canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install MindAR dependencies
        working-directory: mindar
        run: npm install

      - name: Create incremental compiler
        working-directory: mindar
        run: |
          cat > build-targets.js <<'EOF'

          import { OfflineCompiler } from './src/image-target/offline-compiler.js';
          import { loadImage } from 'canvas';
          import { readFile, writeFile } from 'fs/promises';
          import * as msgpack from '@msgpack/msgpack';
          import fs from 'fs';
          import path from 'path';

          const repoRoot =
            process.env.GITHUB_WORKSPACE;

          const targetDir =
            path.join(repoRoot, 'targets');

          const mindFile =
            path.join(repoRoot, 'targets.mind');

          const contentFile =
            path.join(repoRoot, 'content.json');


          function findVideo(posterFile) {

            const baseName =
              path.parse(posterFile).name;

            const numberMatch =
              baseName.match(/(\d+)$/);

            if (!numberMatch) {
              return null;
            }

            const number =
              numberMatch[1];

            const candidates = [
              `video${number.padStart(3, '0')}.mp4`,
              `video${number}.mp4`
            ];

            for (const candidate of candidates) {

              const candidatePath =
                path.join(repoRoot, candidate);

              if (fs.existsSync(candidatePath)) {
                return candidate;
              }

            }

            return null;
          }


          async function run() {

            console.log('Starting incremental AR build...');


            /*
             * LOAD EXISTING DATABASE
             */

            if (!fs.existsSync(mindFile)) {
              throw new Error(
                'targets.mind not found. Production database is missing.'
              );
            }

            const existingBuffer =
              await readFile(mindFile);

            const existingData =
              msgpack.decode(
                new Uint8Array(existingBuffer)
              );

            if (
              existingData.v !== 2 ||
              !Array.isArray(existingData.dataList)
            ) {
              throw new Error(
                'Invalid MindAR database format.'
              );
            }

            const existingCount =
              existingData.dataList.length;

            console.log(
              `Existing targets: ${existingCount}`
            );


            /*
             * LOAD CONTENT DATABASE
             */

            let content = {
              version: 2,
              posters: []
            };

            if (fs.existsSync(contentFile)) {

              content =
                JSON.parse(
                  await readFile(
                    contentFile,
                    'utf8'
                  )
                );

            }

            if (!Array.isArray(content.posters)) {
              content.posters = [];
            }


            /*
             * GET ALL TARGET FILES
             */

            const allFiles =
              fs.readdirSync(targetDir)
                .filter(file =>
                  /\.(png|jpg|jpeg|webp)$/i.test(file)
                )
                .sort();


            /*
             * FIND TARGETS NOT YET IN CONTENT DATABASE
             */

            const newFiles =
              allFiles.filter(file =>
                !content.posters.some(
                  poster =>
                    poster.targetFile === file
                )
              );


            /*
             * ONLY KEEP TARGETS THAT HAVE A VIDEO
             */

            const readyFiles =
              newFiles.filter(file => {

                const video =
                  findVideo(file);

                if (!video) {

                  console.log(
                    `Waiting for matching video: ${file}`
                  );

                  return false;
                }

                return true;

              });


            if (readyFiles.length === 0) {

              console.log(
                'No new poster with matching video found.'
              );

              return;
            }


            console.log(
              `New targets to compile: ${readyFiles.length}`
            );


            /*
             * LOAD ONLY NEW IMAGES
             */

            const images = [];

            for (const file of readyFiles) {

              console.log(
                `Loading NEW target: ${file}`
              );

              const image =
                await loadImage(
                  path.join(targetDir, file)
                );

              images.push(image);

            }


            /*
             * COMPILE ONLY NEW TARGETS
             */

            const compiler =
              new OfflineCompiler();

            const start =
              Date.now();

            console.log(
              'Compiling NEW targets only...'
            );

            await compiler.compileImageTargets(
              images,
              progress => {

                console.log(
                  `New target progress: ${progress.toFixed(2)}%`
                );

              }
            );

            const newBuffer =
              compiler.exportData();

            const newData =
              msgpack.decode(
                new Uint8Array(newBuffer)
              );

            const elapsed =
              (
                (Date.now() - start) /
                1000
              ).toFixed(2);

            console.log(
              `New target compile time: ${elapsed} seconds`
            );


            /*
             * MERGE OLD + NEW
             */

            const combinedDataList = [
              ...existingData.dataList,
              ...newData.dataList
            ];

            const combined =
              msgpack.encode({
                v: existingData.v,
                dataList: combinedDataList
              });


            /*
             * UPDATE CONTENT DATABASE
             */

            for (
              let i = 0;
              i < readyFiles.length;
              i++
            ) {

              const posterFile =
                readyFiles[i];

              const video =
                findVideo(posterFile);

              const targetIndex =
                existingCount + i;

              const posterId =
                path.parse(posterFile).name;

              content.posters.push({

                id: posterId,

                targetFile: posterFile,

                targetIndex: targetIndex,

                video: video

              });

              console.log(
                `ADDED: ${posterFile} -> ${video} -> index ${targetIndex}`
              );

            }


            /*
             * SORT CONTENT BY TARGET INDEX
             */

            content.posters.sort(
              (a, b) =>
                a.targetIndex -
                b.targetIndex
            );


            /*
             * WRITE DATABASE
             */

            await writeFile(
              mindFile,
              combined
            );

            await writeFile(
              contentFile,
              JSON.stringify(
                content,
                null,
                2
              ) + '\n'
            );


            console.log(
              `Combined targets: ${combinedDataList.length}`
            );

            console.log(
              'targets.mind updated successfully.'
            );

            console.log(
              'content.json updated successfully.'
            );

          }


          run().catch(error => {

            console.error(error);

            process.exit(1);

          });

          EOF

      - name: Build incremental targets
        working-directory: mindar
        run: node build-targets.js

      - name: Commit updated AR database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add targets.mind content.json

          if git diff --cached --quiet; then
            echo "No AR database changes"
          else
            git commit -m "Incrementally update AR targets"

            git fetch origin main
            git rebase origin/main

            git push origin HEAD:main
          fi
