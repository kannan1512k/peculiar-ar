name: Build AR Targets

on:
  workflow_dispatch:
  push:
    paths:
      - "targets/**"
      - "*.mp4"

permissions:
  contents: write

concurrency:
  group: build-ar-targets
  cancel-in-progress: false

jobs:
  build-targets:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Clone MindAR v1.2.5
        run: |
          git clone --depth 1 --branch v1.2.5 \
            https://github.com/hiukim/mind-ar-js.git mindar

      - name: Install canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install MindAR dependencies
        working-directory: mindar
        run: npm install

      - name: Create compiler script
        working-directory: mindar
        run: |
          cat > build-targets.js <<'EOF'
          import { OfflineCompiler } from './src/image-target/offline-compiler.js';
          import { loadImage } from 'canvas';
          import { writeFile, readFile } from 'fs/promises';
          import fs from 'fs';
          import path from 'path';

          const repoRoot = process.env.GITHUB_WORKSPACE;
          const targetDir = path.join(repoRoot, 'targets');
          const outputFile = path.join(repoRoot, 'targets.mind');
          const contentFile = path.join(repoRoot, 'content.json');

          function findVideo(posterFile) {

            const baseName = path
              .parse(posterFile)
              .name;

            const numberMatch = baseName.match(/(\d+)$/);

            if (!numberMatch) {
              return null;
            }

            const number = numberMatch[1];

            const paddedNumber =
              number.padStart(3, '0');

            const candidates = [
              `video${paddedNumber}.mp4`,
              `video${number}.mp4`
            ];

            for (const candidate of candidates) {

              const candidatePath =
                path.join(repoRoot, candidate);

              if (fs.existsSync(candidatePath)) {
                return candidate;
              }

            }

            return null;
          }

          async function run() {

            /* GET ALL TARGET IMAGES */

            const files = fs.readdirSync(targetDir)
              .filter(file =>
                /\.(png|jpg|jpeg|webp)$/i.test(file)
              )
              .sort();

            if (files.length === 0) {
              throw new Error(
                'No target images found in targets/'
              );
            }

            console.log(
              `Found ${files.length} target images.`
            );


            /* LOAD TARGET IMAGES */

            const images = [];

            for (const file of files) {

              const imagePath =
                path.join(targetDir, file);

              console.log(
                `Loading: ${file}`
              );

              images.push(
                await loadImage(imagePath)
              );
            }


            /* BUILD MINDAR DATABASE */

            const compiler =
              new OfflineCompiler();

            console.log(
              'Starting MindAR compilation...'
            );

            await compiler.compileImageTargets(
              images,
              progress => {

                console.log(
                  `Progress: ${progress.toFixed(2)}%`
                );

              }
            );

            const buffer =
              compiler.exportData();

            await writeFile(
              outputFile,
              buffer
            );

            console.log(
              `Created: ${outputFile}`
            );


            /* LOAD EXISTING CONTENT */

            let content = {
              version: 2,
              posters: []
            };

            if (fs.existsSync(contentFile)) {

              try {

                content = JSON.parse(
                  await readFile(
                    contentFile,
                    'utf8'
                  )
                );

              } catch (error) {

                console.log(
                  'Could not read existing content.json.'
                );

              }

            }

            if (!Array.isArray(content.posters)) {
              content.posters = [];
            }


            /* UPDATE EXISTING POSTERS */

            for (const poster of content.posters) {

              const index =
                files.indexOf(
                  poster.targetFile
                );

              if (index !== -1) {

                poster.targetIndex = index;

                console.log(
                  `${poster.targetFile} -> index ${index}`
                );

              }

            }


            /* ADD NEW POSTERS AUTOMATICALLY */

            for (
              let index = 0;
              index < files.length;
              index++
            ) {

              const posterFile =
                files[index];

              const existing =
                content.posters.find(
                  poster =>
                    poster.targetFile === posterFile
                );

              if (existing) {
                continue;
              }

              const video =
                findVideo(posterFile);

              if (!video) {

                console.log(
                  `No matching video found for ${posterFile}.`
                );

                continue;
              }

              const posterId =
                path.parse(posterFile).name;

              content.posters.push({

                id: posterId,

                targetFile: posterFile,

                targetIndex: index,

                video: video

              });

              console.log(
                `NEW: ${posterFile} -> ${video}`
              );

            }


            /* SORT CONTENT BY TARGET INDEX */

            content.posters.sort(
              (a, b) =>
                a.targetIndex -
                b.targetIndex
            );


            /* SAVE CONTENT */

            await writeFile(
              contentFile,
              JSON.stringify(
                content,
                null,
                2
              ) + '\n'
            );

            console.log(
              'content.json updated successfully.'
            );

          }

          run().catch(error => {

            console.error(error);

            process.exit(1);

          });
          EOF

      - name: Build targets and update content
        working-directory: mindar
        run: node build-targets.js

      - name: Commit updated AR database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add targets.mind content.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update AR targets and content"

            git fetch origin main
            git rebase origin/main

            git push origin HEAD:main
          fi
