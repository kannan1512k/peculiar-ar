name: MindAR Test Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mindar-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check test posters
        run: |
          set -e
          TEST_DIR="test-bunny"
          echo "Checking poster files in $TEST_DIR..."
          if ! find "$TEST_DIR" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | grep -q .; then
            echo "ERROR: No poster image files found in $TEST_DIR"
            exit 1
          fi
          echo "Poster files found:"
          find "$TEST_DIR" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -print

      - name: Install MindAR image target compiler
        run: |
          set -e
          npm init -y
          npm install --save-dev mind-ar@1.2.5

      - name: Find MindAR compiler
        run: |
          set -e
          echo "Looking for MindAR image target compiler..."
          find node_modules/mind-ar -type f \( -name "compile.js" -o -name "cli.js" -o -name "*.js" \) | head -50

      - name: Validate compiler installation
        run: |
          set -e
          echo "MindAR package installed successfully."
          echo "Existing targets-test.mind will NOT be replaced in Step 3A."
          echo "No production files are changed."

      - name: Commit test result
        run: |
          echo "Step 3A completed: compiler installation/path validation only."
          echo "No targets-test.mind replacement was made."
          echo "No production files were changed."
