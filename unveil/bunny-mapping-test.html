<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peculiar AR Bunny Mapping Test</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#status{position:fixed;z-index:20;top:16px;left:50%;transform:translateX(-50%);padding:9px 12px;border-radius:9px;background:#000b;color:#fff;font:14px Arial}#close{display:none;position:fixed;z-index:30;right:16px;top:16px;padding:10px 14px;border:0;border-radius:20px;background:#000b;color:#fff}#experience{display:none;position:fixed;z-index:25;inset:0;background:#000;align-items:center;justify-content:center}#experience video{width:100%;height:100%;object-fit:contain}</style></head><body><div id="status">Loading test…</div><button id="close">CLOSE</button><a-scene mindar-image="imageTargetSrc: ./targets-test.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" color-space="sRGB" renderer="colorManagement:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"><a-assets id="videoAssets"></a-assets><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity mindar-image-target="targetIndex:0"><a-video id="plane0" position="0 0 0" width="1" height="0.5625" material="shader:flat"></a-video></a-entity><a-entity mindar-image-target="targetIndex:1"><a-video id="plane1" position="0 0 0" width="1" height="0.5625" material="shader:flat"></a-video></a-entity><a-entity mindar-image-target="targetIndex:2"><a-video id="plane2" position="0 0 0" width="1" height="0.5625" material="shader:flat"></a-video></a-entity></a-scene><div id="experience"></div><script>const HOST='https://vz-c32bf749-1b8.b-cdn.net';let map,vids=[],active=null;const status=t=>document.getElementById('status').textContent=t;async function init(){const r=await fetch('./mapping-test.json?'+Date.now());if(!r.ok)throw Error('mapping-test.json HTTP '+r.status);map=await r.json();for(const p of map.posters){const v=document.createElement('video');v.id='video_'+p.id;v.crossOrigin='anonymous';v.playsInline=true;v.setAttribute('webkit-playsinline','');v.preload='metadata';v.muted=true;const src=HOST+'/'+p.videoId+'/playlist.m3u8';if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=src;else if(window.Hls&&Hls.isSupported()){const h=new Hls({enableWorker:true});h.loadSource(src);h.attachMedia(v);v._hls=h}else throw Error('HLS not supported');document.getElementById('videoAssets').appendChild(v);vids[p.targetIndex]=v;document.getElementById('plane'+p.targetIndex).setAttribute('src','#video_'+p.id)}status('READY — Scan a test poster');for(const p of map.posters){const t=document.querySelector('[mindar-image-target="targetIndex:'+p.targetIndex+'"]');t.addEventListener('targetFound',async()=>{const v=vids[p.targetIndex];active=v;vids.forEach(x=>{if(x!==v){x.pause();x.currentTime=0}});v.muted=false;try{await v.play();status(p.id+' → BUNNY PLAYING');const e=document.getElementById('experience');e.appendChild(v);e.style.display='flex';document.getElementById('close').style.display='block'}catch(e){console.error(e);status('Tap screen to play');document.body.onclick=()=>v.play()}});}}document.getElementById('close').onclick=()=>{if(active){active.pause();active.currentTime=0;document.getElementById('videoAssets').appendChild(active)}document.getElementById('experience').style.display='none';document.getElementById('close').style.display='none';active=null;status('READY — Scan a test poster')};document.querySelector('a-scene').addEventListener('loaded',()=>init().catch(e=>{console.error(e);status('ERROR: '+e.message)}));</script></body></html>
