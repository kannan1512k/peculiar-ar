<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
    }
  </style>
</head>

<body>

<button id="startButton">START AR</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets-incremental-test.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets id="videoAssets"></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>

<script>

const scene =
  document.querySelector("a-scene");

const startButton =
  document.querySelector("#startButton");

const videoAssets =
  document.querySelector("#videoAssets");

const videos = [];

async function setupAR() {

  const response =
    await fetch("./content.json");

  const data =
    await response.json();

  const posters = [...data.posters];

  /*
    Add poster006 manually
    for this test only.
  */

  posters.push({
    id: "poster006",
    targetIndex: 5,
    video: "video005.mp4"
  });

  posters.forEach(poster => {

    const videoId =
      "video_" + poster.id;

    const video =
      document.createElement("video");

    video.id = videoId;
    video.src = "./" + poster.video;
    video.loop = true;
    video.crossOrigin = "anonymous";
    video.playsInline = true;
    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    videoAssets.appendChild(video);

    videos.push(video);


    const target =
      document.createElement("a-entity");

    target.setAttribute(
      "mindar-image-target",
      "targetIndex: " +
      poster.targetIndex
    );


    const plane =
      document.createElement("a-video");

    plane.setAttribute(
      "src",
      "#" + videoId
    );

    plane.setAttribute(
      "position",
      "0 0 0"
    );

    plane.setAttribute(
      "width",
      "1"
    );

    plane.setAttribute(
      "height",
      "1"
    );

    plane.setAttribute(
      "material",
      "shader: flat"
    );

    target.appendChild(plane);

    scene.appendChild(target);


    target.addEventListener(
      "targetFound",
      async () => {

        videos.forEach(v => {

          if (v !== video) {
            v.pause();
            v.currentTime = 0;
          }

        });

        try {

          video.currentTime = 0;

          await video.play();

          console.log(
            "TARGET FOUND:",
            poster.id
          );

        } catch (error) {

          console.log(
            "Video play error:",
            error
          );

        }

      }
    );


    target.addEventListener(
      "targetLost",
      () => {

        video.pause();

      }
    );

  });


  startButton.addEventListener(
    "click",
    async () => {

      startButton.style.display =
        "none";

      const arSystem =
        scene.systems[
          "mindar-image-system"
        ];

      await arSystem.start();

    }
  );

}

setupAR();

</script>

</body>
</html>
