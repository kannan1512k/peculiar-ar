<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Peculiar AR - Cinematic Test</title>

  <!-- SAME PRODUCTION LIBRARIES -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }


    /* =====================================================
       START BUTTON
       ===================================================== */

    #startButton {
      position: fixed;

      z-index: 9999;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      padding: 18px 35px;

      font-size: 20px;

      font-weight: 700;

      border: none;

      border-radius: 12px;

      background: #fff;

      color: #000;
    }


    #loadingText {
      position: fixed;

      z-index: 9998;

      top: 60%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      color: #fff;

      font-size: 16px;

      display: none;
    }


    /* =====================================================
       TEST STATUS
       ===================================================== */

    #status {
      position: fixed;

      z-index: 9999;

      bottom: 18px;

      left: 50%;

      transform:
        translateX(-50%);

      color: #fff;

      background:
        rgba(0,0,0,0.65);

      padding:
        8px 14px;

      border-radius: 20px;

      font-size: 12px;

      pointer-events: none;
    }


    /* =====================================================
       FULL VIDEO LAYER
       ===================================================== */

    #fullVideoLayer {

      position: fixed;

      inset: 0;

      z-index: 5000;

      display: none;

      align-items: center;

      justify-content: center;

      /*
        IMPORTANT:
        No black background during reveal.
        Camera remains visible behind it.
      */

      background: transparent;

      overflow: hidden;

      pointer-events: none;

    }


    /* =====================================================
       VIDEO

       IMPORTANT:
       The video itself is NOT 100vw x 100vh
       initially.

       Its actual aspect ratio is calculated
       by JavaScript.
       ===================================================== */

    #fullVideo {

      position: absolute;

      left: 50%;

      top: 50%;

      width: auto;

      height: auto;

      max-width: none;

      max-height: none;

      object-fit: contain;

      background: transparent;

      transform:
        translate(-50%, -50%)
        scale(0.18);

      transform-origin:
        center center;

      opacity: 0;

      border-radius: 16px;

      will-change:
        transform,
        opacity;

      backface-visibility: hidden;

      -webkit-backface-visibility: hidden;

      transition:
        transform 4.5s
        cubic-bezier(
          0.16,
          1,
          0.3,
          1
        ),

        opacity 0.3s ease,

        border-radius 4s ease;

    }


    /* =====================================================
       REVEAL
       ===================================================== */

    #fullVideoLayer.revealing {
      display: flex;
    }


    #fullVideoLayer.revealing
    #fullVideo {

      opacity: 1;

    }


    /* =====================================================
       FULL SCREEN
       ===================================================== */

    #fullVideoLayer.fullscreen {

      background: #000;

      pointer-events: auto;

    }


    #fullVideoLayer.fullscreen
    #fullVideo {

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);

      border-radius: 0;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       START
       ===================================================== -->

  <button
    id="startButton"
    disabled
  >
    LOADING...
  </button>


  <div id="loadingText">
    Loading AR content...
  </div>


  <div id="status">
    Preparing AR...
  </div>


  <!-- =====================================================
       FULL SCREEN VIDEO
       ===================================================== -->

  <div id="fullVideoLayer">

    <video
      id="fullVideo"

      playsinline

      webkit-playsinline

      preload="auto"

      loop

      crossorigin="anonymous"
    ></video>

  </div>


  <!-- =====================================================
       SAME PRODUCTION AR CORE
       ===================================================== -->

  <a-scene

    id="arScene"

    mindar-image="
      imageTargetSrc:
      ./targets.mind;
      autoStart:
      false;
    "

    color-space="sRGB"

    renderer="
      colorManagement:
      true
    "

    vr-mode-ui="
      enabled:
      false
    "

    device-orientation-permission-ui="
      enabled:
      false
    "
  >

    <a-assets
      id="videoAssets"
    ></a-assets>


    <a-camera
      position="0 0 0"
      look-controls="
        enabled:
        false
      "
    ></a-camera>

  </a-scene>


  <script>

    /* =====================================================
       VARIABLES
       ===================================================== */

    const startButton =
      document.querySelector(
        "#startButton"
      );


    const loadingText =
      document.querySelector(
        "#loadingText"
      );


    const scene =
      document.querySelector(
        "#arScene"
      );


    const videoAssets =
      document.querySelector(
        "#videoAssets"
      );


    const status =
      document.querySelector(
        "#status"
      );


    const fullVideoLayer =
      document.querySelector(
        "#fullVideoLayer"
      );


    const fullVideo =
      document.querySelector(
        "#fullVideo"
      );


    let videos = [];

    let targetsReady =
      false;

    let experienceActive =
      false;


    /* =====================================================
       LOAD CONTENT
       ===================================================== */

    async function loadContent() {

      try {

        loadingText.style.display =
          "block";


        const response =
          await fetch(
            "./content.json?v=" +
            Date.now(),
            {
              cache:
                "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Could not load content.json"
          );

        }


        const data =
          await response.json();


        if (
          !data.posters ||
          data.posters.length === 0
        ) {

          throw new Error(
            "No posters found"
          );

        }


        /* =================================================
           CREATE POSTERS
           ================================================= */

        data.posters.forEach(
          (poster) => {

            const videoId =
              "video_" +
              poster.id;


            /* =============================================
               AR VIDEO
               ============================================= */

            const video =
              document.createElement(
                "video"
              );


            video.id =
              videoId;


            video.src =
              "./" +
              poster.video;


            video.loop =
              true;


            video.crossOrigin =
              "anonymous";


            video.playsInline =
              true;


            video.setAttribute(
              "webkit-playsinline",
              ""
            );


            video.preload =
              "auto";


            /*
              SOUND ON
            */

            video.muted =
              false;


            videoAssets.appendChild(
              video
            );


            videos.push(
              video
            );


            /* =============================================
               TARGET
               ============================================= */

            const target =
              document.createElement(
                "a-entity"
              );


            target.setAttribute(
              "mindar-image-target",
              "targetIndex: " +
              poster.targetIndex
            );


            /* =============================================
               AR VIDEO PLANE
               ============================================= */

            const videoPlane =
              document.createElement(
                "a-video"
              );


            videoPlane.setAttribute(
              "src",
              "#" +
              videoId
            );


            videoPlane.setAttribute(
              "position",
              "0 0 0"
            );


            videoPlane.setAttribute(
              "width",
              "1"
            );


            videoPlane.setAttribute(
              "height",
              "1"
            );


            videoPlane.setAttribute(
              "material",
              "shader: flat"
            );


            target.appendChild(
              videoPlane
            );


            scene.appendChild(
              target
            );


            /* =============================================
               TARGET FOUND
               ============================================= */

            target.addEventListener(
              "targetFound",
              async () => {

                if (
                  experienceActive
                ) {

                  return;

                }


                stopOtherVideos(
                  video
                );


                try {

                  /*
                    ORIGINAL VIDEO STARTS
                  */

                  video.currentTime =
                    0;


                  await video.play();


                  status.textContent =
                    "Video playing...";


                  /*
                    Wait for video to
                    actually render.
                  */

                  await waitForFrames(
                    2
                  );


                  /*
                    START HAND-OFF
                  */

                  await startVideoReveal(
                    video
                  );


                } catch (error) {

                  console.error(
                    "Video play error:",
                    error
                  );


                  status.textContent =
                    "Video playback error";

                }

              }
            );


            /* =============================================
               TARGET LOST
               ============================================= */

            target.addEventListener(
              "targetLost",
              () => {

                /*
                  Once full-screen hand-off
                  begins, camera tracking
                  must NOT stop the video.
                */

                if (
                  experienceActive
                ) {

                  return;

                }


                video.pause();

              }
            );

          }
        );


        targetsReady =
          true;


        loadingText.style.display =
          "none";


        startButton.disabled =
          false;


        startButton.textContent =
          "START AR";


        status.textContent =
          "AR Ready";


      } catch (error) {

        console.error(
          "Content error:",
          error
        );


        loadingText.textContent =
          "Failed to load AR content.";

      }

    }


    /* =====================================================
       STOP OTHER VIDEOS
       ===================================================== */

    function stopOtherVideos(
      currentVideo
    ) {

      videos.forEach(
        (video) => {

          if (
            video !== currentVideo
          ) {

            video.pause();

            video.currentTime =
              0;

          }

        }
      );

    }


    /* =====================================================
       WAIT FRAMES
       ===================================================== */

    function waitForFrames(
      count
    ) {

      return new Promise(
        (resolve) => {

          let remaining =
            count;


          function frame() {

            remaining--;


            if (
              remaining <= 0
            ) {

              resolve();

              return;

            }


            requestAnimationFrame(
              frame
            );

          }


          requestAnimationFrame(
            frame
          );

        }
      );

    }


    /* =====================================================
       VIDEO READY
       ===================================================== */

    function waitForVideoReady(
      video
    ) {

      return new Promise(
        (resolve) => {

          if (
            video.readyState >= 2
          ) {

            resolve();

            return;

          }


          let finished =
            false;


          function finish() {

            if (
              finished
            ) {

              return;

            }


            finished =
              true;


            resolve();

          }


          video.addEventListener(
            "loadeddata",
            finish,
            {
              once: true
            }
          );


          video.addEventListener(
            "canplay",
            finish,
            {
              once: true
            }
          );


          setTimeout(
            finish,
            3000
          );

        }
      );

    }


    /* =====================================================
       REAL VIDEO FRAME
       ===================================================== */

    function waitForRealFrame(
      video
    ) {

      return new Promise(
        (resolve) => {

          let finished =
            false;


          function finish() {

            if (
              finished
            ) {

              return;

            }


            finished =
              true;


            resolve();

          }


          if (
            "requestVideoFrameCallback"
            in video
          ) {

            video.requestVideoFrameCallback(
              () => finish()
            );

          } else {

            requestAnimationFrame(
              () => {

                requestAnimationFrame(
                  () => finish()
                );

              }
            );

          }


          setTimeout(
            finish,
            1500
          );

        }
      );

    }


    /* =====================================================
       CALCULATE VIDEO SIZE
       ===================================================== */

    function setVideoSize(
      video
    ) {

      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        return;

      }


      const vw =
        video.videoWidth;


      const vh =
        video.videoHeight;


      const viewportWidth =
        window.innerWidth;


      const viewportHeight =
        window.innerHeight;


      const videoRatio =
        vw / vh;


      const viewportRatio =
        viewportWidth /
        viewportHeight;


      let width;

      let height;


      /*
        CONTAIN:

        Portrait video:
        fit to height.

        Landscape video:
        fit to width.
      */

      if (
        videoRatio >
        viewportRatio
      ) {

        width =
          viewportWidth;

        height =
          width /
          videoRatio;

      } else {

        height =
          viewportHeight;

        width =
          height *
          videoRatio;

      }


      video.style.width =
        width + "px";


      video.style.height =
        height + "px";

    }


    /* =====================================================
       START VIDEO REVEAL
       ===================================================== */

    async function startVideoReveal(
      sourceVideo
    ) {

      if (
        experienceActive
      ) {

        return;

      }


      /*
        Lock the experience.
      */

      experienceActive =
        true;


      status.textContent =
        "Preparing cinematic reveal...";


      const source =
        sourceVideo.currentSrc ||
        sourceVideo.src;


      /*
        ================================================
        PREPARE FULL VIDEO
        ================================================
      */

      fullVideo.pause();


      fullVideo.removeAttribute(
        "src"
      );


      fullVideo.load();


      fullVideo.src =
        source;


      fullVideo.loop =
        true;


      fullVideo.playsInline =
        true;


      fullVideo.setAttribute(
        "playsinline",
        ""
      );


      fullVideo.setAttribute(
        "webkit-playsinline",
        ""
      );


      /*
        VERY IMPORTANT:
        Do NOT mute.
      */

      fullVideo.muted =
        false;


      fullVideo.currentTime =
        0;


      /*
        Wait for dimensions.
      */

      await waitForVideoReady(
        fullVideo
      );


      /*
        Set actual video dimensions.
      */

      setVideoSize(
        fullVideo
      );


      /*
        Small video appears over
        the camera.
      */

      fullVideoLayer.style.display =
        "flex";


      fullVideoLayer.classList.add(
        "revealing"
      );


      fullVideoLayer.classList.remove(
        "fullscreen"
      );


      /*
        Force layout.
      */

      void fullVideo.offsetWidth;


      /*
        ================================================
        START FULL VIDEO
        ================================================
      */

      try {

        await fullVideo.play();

      } catch (error) {

        console.error(
          "Full video play failed:",
          error
        );


        /*
          Return safely.
        */

        experienceActive =
          false;


        fullVideoLayer.style.display =
          "none";


        status.textContent =
          "Original video playing";

        return;

      }


      await waitForRealFrame(
        fullVideo
      );


      await waitForFrames(
        2
      );


      /*
        ================================================
        SINGLE AUDIO SOURCE
        ================================================

        Full-screen video is now playing.

        Immediately stop the AR video's
        audio/video.

        This prevents DOUBLE SOUND.
      */

      sourceVideo.pause();

      sourceVideo.muted =
        true;


      /*
        ================================================
        START CINEMATIC ZOOM
        ================================================
      */

      status.textContent =
        "Cinematic zoom...";


      fullVideoLayer.classList.add(
        "fullscreen"
      );


      /*
        After zoom:
        full video continues independently.
      */

      setTimeout(
        () => {

          status.textContent =
            "Full screen — video playing";

        },
        4600
      );

    }


    /* =====================================================
       START AR
       ===================================================== */

    startButton.addEvent
