<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   PREMIUM INTRO
   ===================================================== */

#introScreen {

  position: fixed;
  inset: 0;

  z-index: 99999;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background:
    radial-gradient(
      circle at 50% 32%,
      rgba(255,193,7,0.14),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      #000000 0%,
      #080808 55%,
      #15110a 100%
    );

  color: #fff;
  text-align: center;

  transition:
    opacity 0.55s ease,
    transform 0.55s ease;
}

#introScreen::before {

  content: "";

  position: absolute;
  inset: 14px;

  border:
    1px solid
    rgba(255,196,60,0.22);

  border-radius: 22px;

  pointer-events: none;
}

#introScreen.hide {

  opacity: 0;
  transform: scale(1.03);

  pointer-events: none;
}


#brandLogo {

  width: min(78vw,360px);
  max-height: 210px;

  object-fit: contain;

  margin-bottom: 22px;

  filter:
    drop-shadow(
      0 0 12px
      rgba(255,190,40,0.28)
    )
    drop-shadow(
      0 0 30px
      rgba(255,180,20,0.12)
    );

  animation:
    logoAppear 1.1s ease forwards;
}

@keyframes logoAppear {

  from {
    opacity: 0;
    transform: scale(0.88);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}


#experienceLabel {

  font-size: 11px;

  letter-spacing: 4px;

  color:
    rgba(255,215,120,0.8);

  margin-bottom: 12px;

  text-transform: uppercase;
}


#mainTitle {

  margin: 0;

  font-size:
    clamp(27px,8vw,44px);

  line-height: 1.08;

  font-weight: 700;

  letter-spacing: 1px;

  background:
    linear-gradient(
      90deg,
      #fff4c7,
      #ffd34d,
      #ffffff,
      #d99b20
    );

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;
}


#tagline {

  margin-top: 9px;

  font-size: 13px;

  letter-spacing: 1.5px;

  color:
    rgba(255,215,130,0.72);

  text-transform: uppercase;
}


#description {

  max-width: 340px;

  margin:
    16px 0 28px;

  font-size: 14px;

  line-height: 1.65;

  color:
    rgba(255,255,255,0.68);
}


#startButton {

  min-width: 225px;

  padding:
    17px 30px;

  border:
    1px solid
    rgba(255,220,120,0.75);

  border-radius: 999px;

  background:
    linear-gradient(
      135deg,
      #fff1a8,
      #d99b20 45%,
      #ffe47a
    );

  color: #080808;

  font-size: 15px;

  font-weight: 800;

  letter-spacing: 2.5px;

  cursor: pointer;

  box-shadow:
    0 0 18px
    rgba(255,194,50,0.25),

    inset 0 1px 1px
    rgba(255,255,255,0.8);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

#startButton:active {

  transform:
    scale(0.96);
}

#startButton:disabled {

  opacity: 0.55;

  cursor: default;
}


#scanHint {

  margin-top: 22px;

  font-size: 12px;

  line-height: 1.5;

  color:
    rgba(255,255,255,0.48);
}

#scanHint span {

  color: #e8b83d;
}


/* =====================================================
   VIDEO REVEAL
   ===================================================== */

#videoExperience {

  position: fixed;

  inset: 0;

  z-index: 90000;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    rgba(0,0,0,0);

  opacity: 0;

  pointer-events: none;

  overflow: hidden;

  transition:
    opacity 0.5s ease,
    background 0.8s ease;
}


/*
   IMPORTANT:

   Final video dimensions are fixed.

   Only SCALE is animated.

   This is much smoother than animating
   width + height simultaneously.
*/

#experienceVideo {

  display: block;

  width: 100vw;
  height: 100vh;

  object-fit: contain;

  background: #000;

  border-radius: 22px;

  transform:
    scale(0.18);

  transform-origin:
    center center;

  will-change:
    transform;

  transition:
    transform
    2.5s
    cubic-bezier(
      0.16,
      1,
      0.3,
      1
    ),

    border-radius
    2s ease;
}


#videoExperience.reveal {

  opacity: 1;

  background:
    rgba(0,0,0,0.96);

  pointer-events: auto;
}


#videoExperience.reveal
#experienceVideo {

  transform:
    scale(1);

  border-radius: 0;
}


/* =====================================================
   CLOSE
   ===================================================== */

#closeVideo {

  position: fixed;

  top: 22px;
  right: 22px;

  z-index: 90010;

  width: 42px;
  height: 42px;

  border:
    1px solid
    rgba(255,255,255,0.35);

  border-radius: 50%;

  background:
    rgba(0,0,0,0.55);

  color: #fff;

  font-size: 20px;

  display: none;

  align-items: center;
  justify-content: center;

  cursor: pointer;
}

#videoExperience.reveal
#closeVideo {

  display: flex;
}


/* =====================================================
   SMALL STATUS
   ===================================================== */

#status {

  position: fixed;

  left: 50%;
  bottom: 30px;

  transform:
    translateX(-50%);

  z-index: 10000;

  padding:
    9px 16px;

  border-radius: 30px;

  background:
    rgba(0,0,0,0.45);

  color:
    rgba(255,255,255,0.65);

  font-size: 11px;

  letter-spacing: 1px;

  display: none;

  pointer-events: none;
}

</style>

</head>


<body>


<!-- =====================================================
     PREMIUM OPENING
     ===================================================== -->

<div id="introScreen">

  <img
    id="brandLogo"
    src="./logo.png"
    alt="Peculiar Print Hub"
  >

  <div id="experienceLabel">
    PECULIAR PRINT HUB
  </div>

  <h1 id="mainTitle">
    BRING IT TO LIFE
  </h1>

  <div id="tagline">
    ONE PRINT. A WHOLE NEW EXPERIENCE.
  </div>

  <p id="description">

    Your printed poster has more to reveal.
    Point your camera at the poster and watch
    your print come alive.

  </p>

  <button
    id="startButton"
    disabled
  >
    LOADING...
  </button>

  <div id="scanHint">

    <span>✦</span>
    Allow camera access when prompted
    <span>✦</span>

  </div>

</div>


<!-- =====================================================
     STATUS
     ===================================================== -->

<div id="status">
  STARTING CAMERA...
</div>


<!-- =====================================================
     FULL VIDEO EXPERIENCE
     ===================================================== -->

<div id="videoExperience">

  <video
    id="experienceVideo"
    playsinline
    webkit-playsinline
    preload="auto"
  ></video>

  <button
    id="closeVideo"
    aria-label="Close"
  >
    ×
  </button>

</div>


<!-- =====================================================
     MINDAR / A-FRAME
     
     IMPORTANT:
     NO CUSTOM CAMERA CSS.
     This structure follows the working
     production page / MindAR structure.
     ===================================================== -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiLoading: no;
    uiError: no;
    uiScanning: no;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

>

  <a-assets
    id="videoAssets">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  ></a-camera>

</a-scene>


<script>

/* =====================================================
   ELEMENTS
   ===================================================== */

const scene =
  document.querySelector("a-scene");

const introScreen =
  document.querySelector("#introScreen");

const startButton =
  document.querySelector("#startButton");

const videoAssets =
  document.querySelector("#videoAssets");

const videoExperience =
  document.querySelector("#videoExperience");

const experienceVideo =
  document.querySelector("#experienceVideo");

const closeVideo =
  document.querySelector("#closeVideo");

const status =
  document.querySelector("#status");


/* =====================================================
   STATE
   ===================================================== */

let videos = [];

let targetsReady = false;

let experienceActive = false;


/* =====================================================
   LOAD CONTENT
   ===================================================== */

async function loadContent() {

  try {

    const response =
      await fetch(
        "./content.json?test=" +
        Date.now()
      );

    if (!response.ok) {

      throw new Error(
        "content.json failed"
      );

    }

    const data =
      await response.json();


    if (
      !data.posters ||
      !data.posters.length
    ) {

      throw new Error(
        "No posters"
      );

    }


    data.posters.forEach(
      poster => {

        /*
          ---------------------------------------
          VIDEO ASSET
          ---------------------------------------
        */

        const video =
          document.createElement(
            "video"
          );

        video.id =
          "video_" +
          poster.id;

        video.src =
          "./" +
          poster.video;

        video.loop =
          true;

        video.preload =
          "auto";

        video.playsInline =
          true;

        video.setAttribute(
          "webkit-playsinline",
          ""
        );

        videoAssets.appendChild(
          video
        );

        videos.push(
          video
        );


        /*
          ---------------------------------------
          TARGET
          ---------------------------------------
        */

        const target =
          document.createElement(
            "a-entity"
          );

        target.setAttribute(
          "mindar-image-target",
          "targetIndex: " +
          poster.targetIndex
        );


        /*
          Keep a tiny A-Frame video plane
          exactly like production.

          It is invisible, so the user only
          sees the premium overlay.

          Keeping this structure reduces
          differences from the working
          production AR engine.
        */

        const plane =
          document.createElement(
            "a-video"
          );

        plane.setAttribute(
          "src",
          "#" + video.id
        );

        plane.setAttribute(
          "width",
          "0.001"
        );

        plane.setAttribute(
          "height",
          "0.001"
        );

        plane.setAttribute(
          "position",
          "0 0 0"
        );

        plane.setAttribute(
          "visible",
          "false"
        );

        target.appendChild(
          plane
        );

        scene.appendChild(
          target
        );


        /*
          ---------------------------------------
          TARGET FOUND
          ---------------------------------------
        */

        target.addEventListener(
          "targetFound",
          async () => {

            console.log(
              "TARGET FOUND:",
              poster.id
            );

            if (
              experienceActive
            ) {

              return;

            }

            stopOtherVideos(
              video
            );

            await revealVideo(
              video
            );

          }
        );


        /*
          ---------------------------------------
          TARGET LOST
          ---------------------------------------
        */

        target.addEventListener(
          "targetLost",
          () => {

            if (
              !experienceActive
            ) {

              video.pause();

            }

          }
        );

      }
    );


    targetsReady =
      true;

    startButton.disabled =
      false;

    startButton.textContent =
      "UNVEIL ✦";

    console.log(
      "Loaded posters:",
      data.posters.length
    );

  }

  catch(error) {

    console.error(
      error
    );

    startButton.textContent =
      "RELOAD";

  }

}


/* =====================================================
   STOP OTHER VIDEOS
   ===================================================== */

function stopOtherVideos(
  current
) {

  videos.forEach(
    video => {

      if (
        video !== current
      ) {

        video.pause();

        try {

          video.currentTime = 0;

        }
        catch(e) {}

      }

    }
  );

}


/* =====================================================
   VIDEO REVEAL
   ===================================================== */

async function revealVideo(
  sourceVideo
) {

  if (
    experienceActive
  ) {

    return;

  }


  experienceActive =
    true;


  /*
    Copy same source.
  */

  experienceVideo.src =
    sourceVideo.currentSrc ||
    sourceVideo.src;


  experienceVideo.loop =
    true;

  experienceVideo.playsInline =
    true;

  experienceVideo.setAttribute(
    "webkit-playsinline",
    ""
  );


  /*
    Reset video.
  */

  try {

    experienceVideo.currentTime =
      0;

  }
  catch(e) {}


  /*
    Prepare hidden overlay.
  */

  videoExperience.classList.remove(
    "reveal"
  );

  videoExperience.style.display =
    "flex";

  videoExperience.style.opacity =
    "0";


  /*
    Force initial transform.
  */

  experienceVideo.style.transform =
    "scale(0.18)";

  void experienceVideo.offsetWidth;


  /*
    VERY IMPORTANT:

    Wait until browser has enough
    video data before starting
    the visual reveal.

    This prevents the frozen
    first-frame effect.
  */

  try {

    await waitForVideoFrame(
      experienceVideo
    );

  }
  catch(e) {}


  /*
    Start playback BEFORE reveal.
  */

  try {

    await experienceVideo.play();

  }
  catch(error) {

    console.log(
      "Playback waiting:",
      error
    );

  }


  /*
    Tiny delay lets the first
    decoded frame actually appear.
  */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          videoExperience.style.opacity =
            "1";

          videoExperience.classList.add(
            "reveal"
          );

        }
      );

    }
  );

}


/* =====================================================
   WAIT FOR VIDEO FRAME
   ===================================================== */

function waitForVideoFrame(
  video
) {

  return new Promise(
    resolve => {

      if (
        video.readyState >= 2
      ) {

        resolve();

        return;

      }


      const done =
        () => {

          video.removeEventListener(
            "loadeddata",
            done
          );

          video.removeEventListener(
            "canplay",
            done
          );

          resolve();

        };


      video.addEventListener(
        "loadeddata",
        done,
        {
          once: true
        }
      );

      video.addEventListener(
        "canplay",
        done,
        {
          once: true
        }
      );


      setTimeout(
        resolve,
        1500
      );

    }
  );

}


/* =====================================================
   CLOSE VIDEO
   ===================================================== */

closeVideo.addEventListener(
  "click",
  () => {

    experienceVideo.pause();

    experienceVideo.removeAttribute(
      "src"
    );

    experienceVideo.load();


    videoExperience.classList.remove(
      "reveal"
    );

    videoExperience.style.display =
      "none";

    videoExperience.style.opacity =
      "0";


    experienceActive =
      false;

  }
);


/* =====================================================
   AR READY
   ===================================================== */

scene.addEventListener(
  "arReady",
  () => {

    console.log(
      "MindAR READY"
    );

    status.style.display =
      "none";

  }
);


/* =====================================================
   AR ERROR
   ===================================================== */

scene.addEventListener(
  "arError",
  () => {

    console.error(
      "MindAR CAMERA ERROR"
    );

    status.style.display =
      "none";

    alert(
      "Camera could not start. Please allow camera permission and try again."
    );

  }
);


/* =====================================================
   START AR
   ===================================================== */

startButton.addEventListener(
  "click",
  () => {

    if (
      !targetsReady
    ) {

      return;

    }


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    if (
      !arSystem
    ) {

      alert(
        "AR system is not ready. Please reload."
      );

      return;

    }


    /*
      IMPORTANT:

      NO await here.

      MindAR official examples
      start the engine directly.
    */

    try {

      arSystem.start();

    }

    catch(error) {

      console.error(
        error
      );

      return;

    }


    /*
      Hide premium intro immediately.

      Camera is now controlled by
      MindAR underneath.
    */

    introScreen.classList.add(
      "hide"
    );


    status.style.display =
      "block";


    setTimeout(
      () => {

        introScreen.style.display =
          "none";

      },
      600
    );

  }
);


/* =====================================================
   LOAD
   ===================================================== */

loadContent();

</script>

</body>
</html>
