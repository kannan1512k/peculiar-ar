<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}


/* =================================
   START BUTTON
================================= */

#startButton {

  position: fixed;

  z-index: 9999;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  padding: 18px 38px;

  font-size: 18px;

  font-weight: 600;

  letter-spacing: 2px;

  border: 1px solid #d4af37;

  border-radius: 50px;

  background: #111;

  color: #d4af37;

  box-shadow:
    0 0 20px rgba(212,175,55,0.25);

  cursor: pointer;
}


/* =================================
   LOADING
================================= */

#loadingText {

  position: fixed;

  z-index: 9998;

  top: 60%;
  left: 50%;

  transform: translate(-50%, -50%);

  color: #d4af37;

  font-size: 14px;

  letter-spacing: 2px;

  text-align: center;
}


/* =================================
   STATUS
================================= */

#status {

  position: fixed;

  z-index: 9997;

  bottom: 25px;

  left: 50%;

  transform: translateX(-50%);

  color: #d4af37;

  font-size: 12px;

  letter-spacing: 1.5px;

  text-align: center;

  pointer-events: none;
}


/* =================================
   EXPERIENCE LAYER

   IMPORTANT:
   Transparent while zooming.
   So camera remains visible.
================================= */

#experience {

  position: fixed;

  inset: 0;

  z-index: 10000;

  display: none;

  background: transparent;

  overflow: hidden;

  align-items: center;

  justify-content: center;

  pointer-events: none;

  transition:
    background 0.5s ease;
}


/*
  During cinematic zoom,
  keep camera visible.
*/

#experience.zooming {

  display: flex;

  background: transparent;
}


/*
  Once full screen is reached,
  black background is allowed.
*/

#experience.fullscreen {

  background: #000;
}


/* =================================
   EXPERIENCE VIDEO
================================= */

#experienceVideo {

  position: fixed;

  left: 50%;

  top: 50%;

  width: 100vw;

  height: 100vh;

  object-fit: contain;

  transform:
    translate(-50%, -50%)
    scale(0.12);

  transform-origin: center center;

  opacity: 1;

  background: transparent;

  transition:
    transform 4.5s
    cubic-bezier(0.22, 1, 0.36, 1);

  pointer-events: none;
}


/*
  Smooth cinematic expansion.
*/

#experience.zooming #experienceVideo {

  transform:
    translate(-50%, -50%)
    scale(1);
}


/* =================================
   CLOSE BUTTON
================================= */

#closeButton {

  position: fixed;

  z-index: 10002;

  top: 14px;

  right: 14px;

  width: 34px;

  height: 34px;

  padding: 0;

  border-radius: 50%;

  border: 1px solid
    rgba(212,175,55,0.75);

  background:
    rgba(0,0,0,0.65);

  color: #d4af37;

  font-size: 19px;

  font-weight: 300;

  line-height: 30px;

  text-align: center;

  cursor: pointer;

  display: none;

  backdrop-filter: blur(8px);

  -webkit-backdrop-filter: blur(8px);
}


#experience.showClose
#closeButton {

  display: block;
}

</style>

</head>


<body>


<!-- =================================
     START
================================= -->

<button
  id="startButton"
  disabled>

  LOADING...

</button>


<div id="loadingText">

  LOADING AR EXPERIENCE...

</div>


<div id="status"></div>


<!-- =================================
     INDEPENDENT EXPERIENCE
================================= -->

<div id="experience">

  <button
    id="closeButton"
    aria-label="Close">

    ×

  </button>

</div>


<!-- =================================
     AR SCENE
================================= -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets
    id="videoAssets">
  </a-assets>


  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    ">

  </a-camera>


</a-scene>


<script>


/* =================================
   ELEMENTS
================================= */

const startButton =
  document.querySelector(
    "#startButton"
  );


const loadingText =
  document.querySelector(
    "#loadingText"
  );


const status =
  document.querySelector(
    "#status"
  );


const scene =
  document.querySelector(
    "a-scene"
  );


const videoAssets =
  document.querySelector(
    "#videoAssets"
  );


const experience =
  document.querySelector(
    "#experience"
  );


const closeButton =
  document.querySelector(
    "#closeButton"
  );


/* =================================
   STATE
================================= */

let videos = [];

let targetsReady = false;

let experienceActive = false;

let currentVideo = null;

let currentPlane = null;


/* =================================
   LOAD CONTENT
================================= */

async function loadContent() {

  try {

    loadingText.style.display =
      "block";

    loadingText.textContent =
      "LOADING AR EXPERIENCE...";


    const response =
      await fetch(
        "./content.json"
      );


    if (!response.ok) {

      throw new Error(
        "Could not load content.json"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters found"
      );

    }


    /* =================================
       CREATE POSTERS
    ================================= */

    data.posters.forEach(
      poster => {


        const videoId =
          "video_" + poster.id;


        /* ================================
           VIDEO
        ================================= */

        const video =
          document.createElement(
            "video"
          );


        video.id =
          videoId;


        video.src =
          "./" + poster.video;


        video.loop =
          true;


        video.crossOrigin =
          "anonymous";


        video.playsInline =
          true;


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        /*
          Keep video ready in memory.
        */

        video.preload =
          "auto";


        videoAssets.appendChild(
          video
        );


        videos.push(
          video
        );


        /* ================================
           TARGET
        ================================= */

        const target =
          document.createElement(
            "a-entity"
          );


        target.setAttribute(
          "mindar-image-target",

          "targetIndex: " +
          poster.targetIndex
        );


        /* ================================
           AR VIDEO PLANE
        ================================= */

        const videoPlane =
          document.createElement(
            "a-video"
          );


        videoPlane.setAttribute(
          "src",
          "#" + videoId
        );


        videoPlane.setAttribute(
          "position",
          "0 0 0"
        );


        videoPlane.setAttribute(
          "width",
          "1"
        );


        videoPlane.setAttribute(
          "height",
          "1"
        );


        videoPlane.setAttribute(
          "material",
          "shader: flat"
        );


        target.appendChild(
          videoPlane
        );


        scene.appendChild(
          target
        );


        /* =================================
           TARGET FOUND
        ================================= */

        target.addEventListener(
          "targetFound",

          async () => {


            /*
              Ignore new tracking once
              an experience is active.
            */

            if (
              experienceActive
            ) {

              return;

            }


            console.log(
              "TARGET FOUND:",
              poster.id
            );


            stopOtherVideos(
              video
            );


            currentVideo =
              video;


            currentPlane =
              videoPlane;


            try {


              /*
                Start immediately.
              */

              video.currentTime =
                0;


              await video.play();


              /*
                IMPORTANT:

                Immediately detach visual
                control from poster.

                The AR camera remains
                visible underneath.
              */

              await launchExperience(
                video,
                videoPlane
              );


            } catch (error) {

              console.error(
                "Video start error:",
                error
              );

            }

          }
        );


        /* =================================
           TARGET LOST
        ================================= */

        target.addEventListener(
          "targetLost",

          () => {


            /*
              After launch, targetLost
              MUST NOT stop anything.
            */

            if (
              experienceActive
            ) {

              return;

            }


            video.pause();

          }
        );

      }
    );


    targetsReady =
      true;


    loadingText.style.display =
      "none";


    startButton.disabled =
      false;


    startButton.textContent =
      "START AR";


    console.log(
      "AR content loaded:",
      data.posters.length,
      "posters"
    );


  } catch (error) {


    console.error(
      "Content loading error:",
      error
    );


    loadingText.textContent =
      "FAILED TO LOAD AR";


    startButton.disabled =
      true;

  }

}


/* =================================
   STOP OTHER VIDEOS
================================= */

function stopOtherVideos(
  current
) {

  videos.forEach(
    video => {

      if (
        video !== current
      ) {

        video.pause();

        video.currentTime =
          0;

        video.muted =
          false;

      }

    }
  );

}


/* =================================
   LAUNCH EXPERIENCE
================================= */

async function launchExperience(
  sourceVideo,
  videoPlane
) {


  if (
    experienceActive
  ) {

    return;

  }


  /*
    LOCK EXPERIENCE IMMEDIATELY.

    Poster tracking can no longer
    control the experience.
  */

  experienceActive =
    true;


  /*
    Mute source only after playback
    has started, preventing double sound.
  */

  sourceVideo.muted =
    false;


  /*
    The SAME video element becomes
    the fullscreen video.

    No second video.
    No new download.
    No loading delay.
  */

  experienceVideoFromSource(
    sourceVideo
  );


  /*
    Hide AR plane visually.
  */

  videoPlane.setAttribute(
    "visible",
    "false"
  );


  /*
    Show cinematic layer.
  */

  experience.style.display =
    "flex";


  experience.classList.add(
    "zooming"
  );


  /*
    Small delay so browser can
    render the video before animation.
  */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          experience.classList.add(
            "fullscreen"
          );

        }
      );

    }
  );


  /*
    Close button available
    immediately.
  */

  experience.classList.add(
    "showClose"
  );


  status.textContent =
    "✦ ENJOY THE EXPERIENCE ✦";


  /*
    IMPORTANT:

    Stop MindAR AFTER the source
    video has already started.

    This removes poster tracking
    while keeping the video alive.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    await arSystem.stop();


  } catch (error) {

    console.log(
      "AR stop:",
      error
    );

  }


  /*
    The video continues because
    the SAME HTML video element is
    now being displayed independently.
  */

}


/* =================================
   MOVE SOURCE VIDEO TO SCREEN
================================= */

function experienceVideoFromSource(
  sourceVideo
) {


  /*
    Move the already-playing video
    out of A-Frame assets.

    This avoids creating/loading
    another video.
  */

  document.body.appendChild(
    sourceVideo
  );


  /*
    HTML video becomes fullscreen.
  */

  sourceVideo.style.position =
    "fixed";


  sourceVideo.style.left =
    "50%";


  sourceVideo.style.top =
    "50%";


  sourceVideo.style.width =
    "100vw";


  sourceVideo.style.height =
    "100vh";


  sourceVideo.style.objectFit =
    "contain";


  sourceVideo.style.transform =
    "translate(-50%, -50%)";


  sourceVideo.style.zIndex =
    "10001";


  sourceVideo.style.display =
    "block";


  sourceVideo.style.opacity =
    "1";


  sourceVideo.style.background =
    "transparent";


  sourceVideo.style.transition =
    "transform 4.5s cubic-bezier(0.22,1,0.36,1)";


  /*
    Start small.
  */

  sourceVideo.style.transform =
    "translate(-50%, -50%) scale(0.12)";


  /*
    Force browser to notice
    the initial state.
  */

  void sourceVideo.offsetWidth;


  /*
    Cinematic expansion.
  */

  requestAnimationFrame(
    () => {

      sourceVideo.style.transform =
        "translate(-50%, -50%) scale(1)";

    }
  );

}


/* =================================
   CLOSE EXPERIENCE
================================= */

closeButton.addEventListener(
  "click",

  async () => {


    console.log(
      "Closing experience"
    );


    /*
      Stop current video.
    */

    if (
      currentVideo
    ) {

      currentVideo.pause();

      currentVideo.currentTime =
        0;

      currentVideo.muted =
        false;


      /*
        Return video to A-Frame assets.
      */

      videoAssets.appendChild(
        currentVideo
      );


      currentVideo.style.position =
        "";


      currentVideo.style.left =
        "";


      currentVideo.style.top =
        "";


      currentVideo.style.width =
        "";


      currentVideo.style.height =
        "";


      currentVideo.style.objectFit =
        "";


      currentVideo.style.transform =
        "";


      currentVideo.style.zIndex =
        "";


      currentVideo.style.display =
        "";


      currentVideo.style.opacity =
        "";


      currentVideo.style.background =
        "";


      currentVideo.style.transition =
        "";

    }


    /*
      Hide experience layer.
    */

    experience.classList.remove(
      "zooming"
    );


    experience.classList.remove(
      "fullscreen"
    );


    experience.classList.remove(
      "showClose"
    );


    experience.style.display =
      "none";


    /*
      Restore AR plane.
    */

    if (
      currentPlane
    ) {

      currentPlane.setAttribute(
        "visible",
        "true"
      );

    }


    /*
      Reset state.
    */

    experienceActive =
      false;


    currentVideo =
      null;


    currentPlane =
      null;


    status.textContent =
      "";


    /*
      Restart camera.
    */

    try {

      const arSystem =
        scene.systems[
          "mindar-image-system"
        ];


      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {

      console.error(
        "AR restart error:",
        error
      );

    }

  }
);


/* =================================
   START AR
================================= */

startButton.addEventListener(
  "click",

  async () => {


    if (
      !targetsReady
    ) {

      return;

    }


    startButton.style.display =
      "none";


    loadingText.style.display =
      "none";


    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    try {

      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {


      console.error(
        "AR start error:",
        error
      );


      startButton.style.display =
        "block";


      startButton.textContent =
        "START AR";


      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* =================================
   INITIAL LOAD
================================= */

loadContent();


</script>

</body>
</html>
