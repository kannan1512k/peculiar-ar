<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =====================================
       PREMIUM INTRO SCREEN
       ===================================== */

    #introScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        radial-gradient(
          circle at 50% 32%,
          rgba(255, 193, 7, 0.14),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #000000 0%,
          #080808 55%,
          #15110a 100%
        );

      color: #fff;
      text-align: center;
    }


    #introScreen::before {
      content: "";

      position: absolute;

      inset: 14px;

      border:
        1px solid
        rgba(255, 196, 60, 0.22);

      border-radius: 22px;

      pointer-events: none;
    }


    /* =====================================
       LOGO
       ===================================== */

    #brandLogo {

      width:
        min(78vw, 360px);

      max-height: 210px;

      object-fit: contain;

      margin-bottom: 22px;

      filter:
        drop-shadow(
          0 0 12px
          rgba(255, 190, 40, 0.28)
        )
        drop-shadow(
          0 0 30px
          rgba(255, 180, 20, 0.12)
        );

      animation:
        logoAppear 1.2s ease forwards;
    }


    @keyframes logoAppear {

      from {
        opacity: 0;
        transform: scale(0.88);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =====================================
       BRAND LABEL
       ===================================== */

    #experienceLabel {

      font-size: 11px;

      letter-spacing: 4px;

      color:
        rgba(255, 215, 120, 0.8);

      margin-bottom: 12px;

      text-transform: uppercase;
    }


    /* =====================================
       MAIN TITLE
       ===================================== */

    #mainTitle {

      margin: 0;

      font-size:
        clamp(27px, 8vw, 44px);

      line-height: 1.08;

      font-weight: 700;

      letter-spacing: 1px;

      background:
        linear-gradient(
          90deg,
          #fff4c7,
          #ffd34d,
          #ffffff,
          #d99b20
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;
    }


    /* =====================================
       TAGLINE
       ===================================== */

    #tagline {

      margin-top: 9px;

      font-size: 13px;

      letter-spacing: 1.5px;

      color:
        rgba(255, 215, 130, 0.72);

      text-transform: uppercase;
    }


    /* =====================================
       DESCRIPTION
       ===================================== */

    #description {

      max-width: 340px;

      margin:
        16px 0 28px;

      font-size: 14px;

      line-height: 1.65;

      color:
        rgba(255, 255, 255, 0.68);
    }


    /* =====================================
       CTA BUTTON
       ===================================== */

    #startButton {

      position: relative;

      min-width: 225px;

      padding:
        17px 30px;

      border:
        1px solid
        rgba(255, 220, 120, 0.75);

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #fff1a8,
          #d99b20 45%,
          #ffe47a
        );

      color: #080808;

      font-size: 15px;

      font-weight: 800;

      letter-spacing: 2.5px;

      cursor: pointer;

      box-shadow:
        0 0 18px
        rgba(255, 194, 50, 0.25),

        inset 0 1px 1px
        rgba(255,255,255,0.8);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    #startButton:active {

      transform:
        scale(0.96);

      box-shadow:
        0 0 28px
        rgba(255, 194, 50, 0.4);
    }


    #startButton:disabled {

      opacity: 0.55;

      cursor: default;
    }


    /* =====================================
       CAMERA INSTRUCTION
       ===================================== */

    #scanHint {

      margin-top: 22px;

      font-size: 12px;

      line-height: 1.5;

      color:
        rgba(255,255,255,0.48);
    }


    #scanHint span {

      color:
        #e8b83d;
    }


    /* =====================================
       LOADING
       ===================================== */

    #loadingText {

      position: fixed;

      z-index: 100000;

      left: 50%;

      bottom: 34px;

      transform:
        translateX(-50%);

      color:
        rgba(255,255,255,0.6);

      font-size: 12px;

      letter-spacing: 1px;

      display: none;
    }


    .loaderDot {

      display: inline-block;

      width: 5px;

      height: 5px;

      margin-left: 4px;

      border-radius: 50%;

      background: #e8b83d;

      animation:
        pulse 1.2s
        infinite
        ease-in-out;
    }


    @keyframes pulse {

      0%, 100% {
        opacity: 0.25;
        transform: scale(0.7);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =====================================
       INTRO EXIT
       ===================================== */

    #introScreen.hide {

      animation:
        introExit
        0.55s
        ease
        forwards;
    }


    @keyframes introExit {

      to {

        opacity: 0;

        transform:
          scale(1.03);

        pointer-events: none;
      }

    }


    /* =====================================
       VIDEO EXPERIENCE OVERLAY
       ===================================== */

    #videoExperience {

      position: fixed;

      inset: 0;

      z-index: 90000;

      display: none;

      align-items: center;

      justify-content: center;

      background:
        rgba(0, 0, 0, 0);

      pointer-events: none;

      overflow: hidden;

      opacity: 0;

      transition:
        opacity 0.45s ease,
        background 0.8s ease;
    }


    /*
      =========================================
      CINEMATIC VIDEO
      =========================================

      IMPORTANT:

      The video keeps its final size.

      Only transform: scale()
      is animated.

      This avoids width/height layout
      recalculation and makes the zoom
      much smoother on mobile.
    */

    #experienceVideo {

      display: block;

      width: 100vw;

      height: 100vh;

      object-fit: contain;

      background: #000;

      border-radius: 18px;

      opacity: 0;

      transform:
        scale(0.18);

      transform-origin:
        center center;

      will-change:
        transform,
        opacity;

      backface-visibility:
        hidden;

      -webkit-backface-visibility:
        hidden;

      transition:

        transform
        3.2s
        cubic-bezier(
          0.16,
          1,
          0.3,
          1
        ),

        opacity
        0.35s
        ease,

        border-radius
        2.4s
        ease;
    }


    /*
      Reveal state
    */

    #videoExperience.reveal {

      background:
        rgba(0, 0, 0, 0.94);

      pointer-events:
        auto;

      opacity: 1;
    }


    #videoExperience.reveal
    #experienceVideo {

      transform:
        scale(1);

      opacity: 1;

      border-radius: 0;

      box-shadow:
        0 0 70px
        rgba(255, 194, 50, 0.08);
    }


    /* =====================================
       GOLD REVEAL FRAME
       ===================================== */

    #revealFrame {

      position: absolute;

      inset: 20px;

      border:
        1px solid
        rgba(255, 204, 80, 0.5);

      border-radius: 18px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.45s ease;
    }


    #videoExperience.reveal
    #revealFrame {

      opacity: 0;
    }


    /* =====================================
       VIDEO CLOSE BUTTON
       ===================================== */

    #closeVideo {

      position: fixed;

      top: 22px;

      right: 22px;

      z-index: 90010;

      width: 42px;

      height: 42px;

      border:
        1px solid
        rgba(255,255,255,0.35);

      border-radius: 50%;

      background:
        rgba(0,0,0,0.55);

      color: #fff;

      font-size: 20px;

      display: none;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      pointer-events: auto;
    }


    #videoExperience.reveal
    #closeVideo {

      display: flex;
    }


  </style>
</head>


<body>


  <!-- =====================================
       PREMIUM OPENING SCREEN
       ===================================== -->

  <div id="introScreen">


    <img
      id="brandLogo"
      src="./logo.png"
      alt="Peculiar Print Hub"
    >


    <div id="experienceLabel">
      PECULIAR PRINT HUB
    </div>


    <h1 id="mainTitle">
      BRING IT TO LIFE
    </h1>


    <div id="tagline">
      ONE PRINT. A WHOLE NEW EXPERIENCE.
    </div>


    <p id="description">
      Your printed poster has more to reveal.
      Point your camera at the poster and watch
      your print come alive.
    </p>


    <button
      id="startButton"
      disabled
    >
      UNVEIL ✦
    </button>


    <div id="scanHint">

      <span>✦</span>

      Allow camera access when prompted

      <span>✦</span>

    </div>

  </div>


  <!-- =====================================
       LOADING
       ===================================== -->

  <div id="loadingText">

    Preparing your AR experience

    <span class="loaderDot"></span>

  </div>


  <!-- =====================================
       FULL-SCREEN VIDEO EXPERIENCE
       ===================================== -->

  <div id="videoExperience">

    <div id="revealFrame"></div>

    <video
      id="experienceVideo"
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      controls="false"
      preload="auto"
    ></video>

    <button
      id="closeVideo"
      aria-label="Close video"
    >
      ×
    </button>

  </div>


  <!-- =====================================
       AR ENGINE
       ===================================== -->

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >


    <a-assets
      id="videoAssets">
    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


  </a-scene>


<script>


/* =====================================
   ELEMENTS
   ===================================== */

const introScreen =
  document.querySelector(
    "#introScreen"
  );


const startButton =
  document.querySelector(
    "#startButton"
  );


const loadingText =
  document.querySelector(
    "#loadingText"
  );


const scene =
  document.querySelector(
    "a-scene"
  );


const videoAssets =
  document.querySelector(
    "#videoAssets"
  );


const videoExperience =
  document.querySelector(
    "#videoExperience"
  );


const experienceVideo =
  document.querySelector(
    "#experienceVideo"
  );


const closeVideo =
  document.querySelector(
    "#closeVideo"
  );


let videos = [];

let targetsReady = false;

let activePoster = null;

let experienceActive = false;


/* =====================================
   LOAD CONTENT
   ===================================== */

async function loadContent() {

  try {


    loadingText.style.display =
      "block";


    const response =
      await fetch(
        "./content.json?cache=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "Could not load content.json"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters found in content.json"
      );

    }


    /* =================================
       CREATE ALL VIDEOS + TARGETS
       ================================= */

    data.posters.forEach(
      poster => {


        const videoId =
          "video_" +
          poster.id;


        /* CREATE AR VIDEO */

        const video =
          document.createElement(
            "video"
          );


        video.id =
          videoId;


        video.src =
          "./" +
          poster.video;


        video.loop =
          true;


        video.crossOrigin =
          "anonymous";


        video.playsInline =
          true;


        video.preload =
          "metadata";


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        videoAssets.appendChild(
          video
        );


        videos.push(
          video
        );


        /* CREATE TARGET */

        const target =
          document.createElement(
            "a-entity"
          );


        target.setAttribute(
          "mindar-image-target",

          "targetIndex: " +
          poster.targetIndex
        );


        /* CREATE AR VIDEO PLANE */

        const videoPlane =
          document.createElement(
            "a-video"
          );


        videoPlane.setAttribute(
          "src",

          "#" +
          videoId
        );


        videoPlane.setAttribute(
          "position",

          "0 0 0"
        );


        videoPlane.setAttribute(
          "width",

          "1"
        );


        videoPlane.setAttribute(
          "height",

          "1"
        );


        videoPlane.setAttribute(
          "material",

          "shader: flat"
        );


        target.appendChild(
          videoPlane
        );


        scene.appendChild(
          target
        );


        /* =================================
           TARGET FOUND
           ================================= */

        target.addEventListener(
          "targetFound",

          async () => {


            /*
             * If another video experience
             * is already active, don't
             * interrupt it.
             */

            if (
              experienceActive
            ) {

              return;

            }


            activePoster =
              poster;


            stopOtherVideos(
              video
            );


            /*
             * Start the premium
             * cinematic experience.
             */

            startVideoExperience(
              poster,
              video
            );

          }
        );


        /* =================================
           TARGET LOST
           ================================= */

        target.addEventListener(
          "targetLost",

          () => {


            /*
             * Once the cinematic video
             * has started, it continues
             * even if the poster leaves
             * the camera.
             */

            if (
              !experienceActive
            ) {

              video.pause();

            }

          }
        );

      }
    );


    targetsReady =
      true;


    loadingText.style.display =
      "none";


    startButton.disabled =
      false;


    startButton.textContent =
      "UNVEIL ✦";


    console.log(
      "AR content loaded:",
      data.posters.length,
      "posters"
    );


  } catch (error) {


    console.error(
      "Content database error:",
      error
    );


    loadingText.textContent =
      "Failed to load AR content.";


    startButton.disabled =
      true;

  }

}


/* =====================================
   STOP OTHER AR VIDEOS
   ===================================== */

function stopOtherVideos(
  currentVideo
) {


  videos.forEach(
    video => {


      if (
        video !== currentVideo
      ) {


        video.pause();


        try {

          video.currentTime =
            0;

        } catch (error) {}

      }

    }
  );

}


/* =====================================
   WAIT FOR VIDEO DATA
   ===================================== */

function waitForVideoData(
  video
) {

  return new Promise(
    resolve => {

      if (
        video.readyState >= 2
      ) {

        resolve();

        return;

      }


      let finished =
        false;


      function finish() {

        if (finished) {
          return;
        }


        finished =
          true;


        video.removeEventListener(
          "loadeddata",
          finish
        );


        video.removeEventListener(
          "canplay",
          finish
        );


        resolve();

      }


      video.addEventListener(
        "loadeddata",
        finish,
        {
          once: true
        }
      );


      video.addEventListener(
        "canplay",
        finish,
        {
          once: true
        }
      );


      /*
       * Safety timeout.
       */

      setTimeout(
        finish,
        2000
      );

    }
  );

}


/* =====================================
   WAIT FOR ACTUAL VIDEO FRAME
   ===================================== */

function waitForVideoFrame(
  video
) {

  return new Promise(
    resolve => {


      /*
       * Modern Chrome / Android
       */

      if (
        "requestVideoFrameCallback"
        in video
      ) {

        let finished =
          false;


        function finish() {

          if (finished) {
            return;
          }


          finished =
            true;


          resolve();

        }


        video.requestVideoFrameCallback(
          finish
        );


        setTimeout(
          finish,
          1200
        );


        return;

      }


      /*
       * Fallback for browsers
       * without requestVideoFrameCallback.
       */

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              resolve();

            }
          );

        }
      );

    }
  );

}


/* =====================================
   START CINEMATIC VIDEO EXPERIENCE
   ===================================== */

async function startVideoExperience(
  poster,
  sourceVideo
) {


  if (
    experienceActive
  ) {

    return;

  }


  experienceActive =
    true;


  /*
   * Stop the AR plane video.
   */

  sourceVideo.pause();


  /*
   * Use the same video file
   * inside the cinematic layer.
   */

  experienceVideo.src =
    sourceVideo.currentSrc ||
    sourceVideo.src;


  experienceVideo.loop =
    true;


  experienceVideo.playsInline =
    true;


  experienceVideo.setAttribute(
    "webkit-playsinline",
    ""
  );


  /*
   * Start from beginning.
   */

  try {

    experienceVideo.currentTime =
      0;

  } catch (error) {}


  /*
   * ---------------------------------
   * INITIAL HIDDEN STATE
   * ---------------------------------
   *
   * The video is NOT revealed yet.
   */

  videoExperience.style.display =
    "flex";


  videoExperience.classList.remove(
    "reveal"
  );


  experienceVideo.style.opacity =
    "0";


  experienceVideo.style.transform =
    "scale(0.18)";


  /*
   * Force browser to register
   * the starting state.
   */

  void experienceVideo.offsetWidth;


  /*
   * ---------------------------------
   * WAIT FOR VIDEO DATA
   * ---------------------------------
   */

  await waitForVideoData(
    experienceVideo
  );


  /*
   * ---------------------------------
   *
