<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}

/* =====================================================
   PREMIUM INTRO
   ===================================================== */

#introScreen {

  position: fixed;
  inset: 0;

  z-index: 99999;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 30px;

  background:
    radial-gradient(
      circle at 50% 32%,
      rgba(255,193,7,0.14),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      #000000 0%,
      #080808 55%,
      #15110a 100%
    );

  color: #fff;
  text-align: center;

  transition:
    opacity 0.55s ease,
    transform 0.55s ease;
}

#introScreen::before {

  content: "";

  position: absolute;
  inset: 14px;

  border:
    1px solid
    rgba(255,196,60,0.22);

  border-radius: 22px;

  pointer-events: none;
}

#introScreen.hide {

  opacity: 0;
  transform: scale(1.03);

  pointer-events: none;
}

#brandLogo {

  width: min(78vw,360px);
  max-height: 210px;

  object-fit: contain;

  margin-bottom: 22px;

  filter:
    drop-shadow(
      0 0 12px
      rgba(255,190,40,0.28)
    )
    drop-shadow(
      0 0 30px
      rgba(255,180,20,0.12)
    );

  animation:
    logoAppear 1.2s ease forwards;
}

@keyframes logoAppear {

  from {
    opacity: 0;
    transform: scale(0.88);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}

#experienceLabel {

  font-size: 11px;

  letter-spacing: 4px;

  color:
    rgba(255,215,120,0.8);

  margin-bottom: 12px;

  text-transform: uppercase;
}

#mainTitle {

  margin: 0;

  font-size:
    clamp(27px,8vw,44px);

  line-height: 1.08;

  font-weight: 700;

  letter-spacing: 1px;

  background:
    linear-gradient(
      90deg,
      #fff4c7,
      #ffd34d,
      #ffffff,
      #d99b20
    );

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;
}

#tagline {

  margin-top: 9px;

  font-size: 13px;

  letter-spacing: 1.5px;

  color:
    rgba(255,215,130,0.72);

  text-transform: uppercase;
}

#description {

  max-width: 340px;

  margin:
    16px 0 28px;

  font-size: 14px;

  line-height: 1.65;

  color:
    rgba(255,255,255,0.68);
}

#startButton {

  position: relative;

  min-width: 225px;

  padding:
    17px 30px;

  border:
    1px solid
    rgba(255,220,120,0.75);

  border-radius: 999px;

  background:
    linear-gradient(
      135deg,
      #fff1a8,
      #d99b20 45%,
      #ffe47a
    );

  color: #080808;

  font-size: 15px;

  font-weight: 800;

  letter-spacing: 2.5px;

  cursor: pointer;

  box-shadow:
    0 0 18px
    rgba(255,194,50,0.25),

    inset 0 1px 1px
    rgba(255,255,255,0.8);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

#startButton:active {
  transform: scale(0.96);
}

#startButton:disabled {

  opacity: 0.55;

  cursor: default;
}

#scanHint {

  margin-top: 22px;

  font-size: 12px;

  line-height: 1.5;

  color:
    rgba(255,255,255,0.48);
}

#scanHint span {
  color: #e8b83d;
}


/* =====================================================
   CUSTOM AR STARTING STATUS
   ===================================================== */

#arStatus {

  position: fixed;

  inset: 0;

  z-index: 5000;

  display: none;

  align-items: center;
  justify-content: center;

  pointer-events: none;
}

#arStatusBox {

  padding:
    10px 18px;

  border-radius: 30px;

  background:
    rgba(0,0,0,0.45);

  border:
    1px solid
    rgba(255,215,120,0.25);

  color:
    rgba(255,255,255,0.7);

  font-size: 11px;

  letter-spacing: 1px;

  backdrop-filter: blur(8px);
}


/* =====================================================
   VIDEO EXPERIENCE
   ===================================================== */

#videoExperience {

  position: fixed;

  inset: 0;

  z-index: 90000;

  display: none;

  align-items: center;

  justify-content: center;

  background:
    rgba(0,0,0,0);

  opacity: 0;

  pointer-events: none;

  overflow: hidden;

  transition:
    opacity 0.45s ease,
    background 0.8s ease;
}


/*
   IMPORTANT:

   The video always has its FINAL viewport dimensions.
   We animate only transform scale.

   This avoids width/height layout animation
   and gives a much smoother mobile reveal.
*/

#experienceVideo {

  display: block;

  width: 100vw;

  height: 100vh;

  object-fit: contain;

  background: #000;

  border-radius: 18px;

  opacity: 1;

  transform:
    scale(0.22);

  transform-origin:
    center center;

  will-change:
    transform;

  transition:
    transform
    2.2s
    cubic-bezier(
      0.22,
      1,
      0.36,
      1
    ),

    border-radius
    1.8s
    ease;
}


/*
   Reveal
*/

#videoExperience.reveal {

  opacity: 1;

  background:
    rgba(0,0,0,0.94);

  pointer-events: auto;
}

#videoExperience.reveal
#experienceVideo {

  transform:
    scale(1);

  border-radius: 0;
}


/* =====================================================
   CLOSE BUTTON
   ===================================================== */

#closeVideo {

  position: fixed;

  top: 22px;
  right: 22px;

  z-index: 90010;

  width: 42px;
  height: 42px;

  border:
    1px solid
    rgba(255,255,255,0.35);

  border-radius: 50%;

  background:
    rgba(0,0,0,0.55);

  color: #fff;

  font-size: 20px;

  display: none;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  pointer-events: auto;
}

#videoExperience.reveal
#closeVideo {

  display: flex;
}


/* =====================================================
   A-FRAME
   ===================================================== */

a-scene {

  position: fixed !important;

  inset: 0 !important;

  width: 100% !important;
  height: 100% !important;

}

canvas.a-canvas {

  position: fixed !important;

  inset: 0 !important;

  width: 100% !important;
  height: 100% !important;

}

video.mindar-video {

  position: fixed !important;

  inset: 0 !important;

  width: 100% !important;
  height: 100% !important;

  object-fit: cover !important;
}

</style>

</head>


<body>


<!-- =====================================================
     PREMIUM INTRO
     ===================================================== -->

<div id="introScreen">

  <img
    id="brandLogo"
    src="./logo.png"
    alt="Peculiar Print Hub"
  >

  <div id="experienceLabel">
    PECULIAR PRINT HUB
  </div>

  <h1 id="mainTitle">
    BRING IT TO LIFE
  </h1>

  <div id="tagline">
    ONE PRINT. A WHOLE NEW EXPERIENCE.
  </div>

  <p id="description">

    Your printed poster has more to reveal.
    Point your camera at the poster and watch
    your print come alive.

  </p>

  <button
    id="startButton"
    disabled
  >
    LOADING...
  </button>

  <div id="scanHint">

    <span>✦</span>

    Allow camera access when prompted

    <span>✦</span>

  </div>

</div>


<!-- =====================================================
     AR STATUS
     ===================================================== -->

<div id="arStatus">

  <div id="arStatusBox">
    STARTING CAMERA...
  </div>

</div>


<!-- =====================================================
     VIDEO EXPERIENCE
     ===================================================== -->

<div id="videoExperience">

  <video
    id="experienceVideo"
    playsinline
    webkit-playsinline
    preload="auto"
    crossorigin="anonymous"
  ></video>

  <button
    id="closeVideo"
    aria-label="Close video"
  >
    ×
  </button>

</div>


<!-- =====================================================
     AR ENGINE
     ===================================================== -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiLoading: no;
    uiError: no;
    uiScanning: no;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

>

  <a-assets
    id="videoAssets"
    timeout="10000"
  ></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  ></a-camera>

</a-scene>


<script>

/* =====================================================
   ELEMENTS
   ===================================================== */

const introScreen =
  document.querySelector("#introScreen");

const startButton =
  document.querySelector("#startButton");

const scene =
  document.querySelector("a-scene");

const videoAssets =
  document.querySelector("#videoAssets");

const videoExperience =
  document.querySelector("#videoExperience");

const experienceVideo =
  document.querySelector("#experienceVideo");

const closeVideo =
  document.querySelector("#closeVideo");

const arStatus =
  document.querySelector("#arStatus");


/* =====================================================
   STATE
   ===================================================== */

let videos = [];

let targetsReady = false;

let experienceActive = false;


/* =====================================================
   LOAD CONTENT
   ===================================================== */

async function loadContent() {

  try {

    const response =
      await fetch(
        "./content.json",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Could not load content.json"
      );

    }

    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters found"
      );

    }


    /*
      Create all target entities.
    */

    data.posters.forEach(
      poster => {

        const videoId =
          "video_" + poster.id;


        /* -----------------------------------------
           VIDEO ASSET
           ----------------------------------------- */

        const video =
          document.createElement(
            "video"
          );

        video.id =
          videoId;

        video.src =
          "./" + poster.video;

        video.loop = true;

        video.preload =
          "metadata";

        video.playsInline =
          true;

        video.crossOrigin =
          "anonymous";

        video.setAttribute(
          "webkit-playsinline",
          ""
        );

        videoAssets.appendChild(
          video
        );

        videos.push(
          video
        );


        /* -----------------------------------------
           TARGET ENTITY
           ----------------------------------------- */

        const target =
          document.createElement(
            "a-entity"
          );

        target.setAttribute(
          "mindar-image-target",
          "targetIndex: " +
          poster.targetIndex
        );


        /*
          We do NOT put the video on the
          AR plane anymore.

          Why?

          The final experience is our own
          fullscreen video overlay.

          MindAR only needs the target entity
          for detection/tracking.

          This reduces unnecessary rendering
          and makes the camera experience cleaner.
        */


        scene.appendChild(
          target
        );


        /* -----------------------------------------
           TARGET FOUND
           ----------------------------------------- */

        target.addEventListener(
          "targetFound",
          async () => {

            if (experienceActive) {
              return;
            }

            stopOtherVideos(
              video
            );

            await startVideoExperience(
              video
            );

          }
        );


        /* -----------------------------------------
           TARGET LOST
           ----------------------------------------- */

        target.addEventListener(
          "targetLost",
          () => {

            /*
              Once the fullscreen experience
              has started, keep playing.

              Before that, pause the source.
            */

            if (!experienceActive) {

              video.pause();

            }

          }
        );

      }
    );


    targetsReady =
      true;

    startButton.disabled =
      false;

    startButton.textContent =
      "UNVEIL ✦";


    console.log(
      "AR content loaded:",
      data.posters.length,
      "posters"
    );

  }

  catch (error) {

    console.error(
      "Content loading error:",
      error
    );

    startButton.textContent =
      "ERROR";

    startButton.disabled =
      true;

  }

}


/* =====================================================
   STOP OTHER VIDEOS
   ===================================================== */

function stopOtherVideos(
  currentVideo
) {

  videos.forEach(
    video => {

      if (
        video !== currentVideo
      ) {

        video.pause();

        try {

          video.currentTime = 0;

        } catch(e) {}

      }

    }
  );

}


/* =====================================================
   START VIDEO EXPERIENCE
   ===================================================== */

async function startVideoExperience(
  sourceVideo
) {

  if (
    experienceActive
  ) {

    return;

  }


  experienceActive =
    true;


  /*
    Stop the AR source video.
  */

  sourceVideo.pause();


  /*
    Use the same video file.
  */

  experienceVideo.src =
    sourceVideo.currentSrc ||
    sourceVideo.src;


  experienceVideo.loop =
    true;

  experienceVideo.playsInline =
    true;

  experienceVideo.setAttribute(
    "webkit-playsinline",
    ""
  );


  /*
    Start from beginning.
  */

  try {

    experienceVideo.currentTime =
      0;

  } catch(e) {}


  /*
    Reset reveal state.
  */

  videoExperience.classList.remove(
    "reveal"
  );

  videoExperience.style.display =
    "flex";

  videoExperience.style.opacity =
    "0";


  /*
    Force initial transform state.
  */

  experienceVideo.style.transform =
    "scale(0.22)";


  void experienceVideo.offsetWidth;


  /*
    IMPORTANT:

    Start the video BEFORE the reveal.

    This prevents the "frozen first frame"
    effect as much as possible.
  */

  try {

    await experienceVideo.play();

  }

  catch(error) {

    console.log(
      "Video autoplay/play blocked:",
      error
    );

  }


  /*
    Give the browser a tiny moment
    to actually start decoding frames.
  */

  setTimeout(
    () => {

      videoExperience.style.opacity =
        "1";

      videoExperience.classList.add(
        "reveal"
      );

    },
    120
  );

}


/* =====================================================
   CLOSE VIDEO
   ===================================================== */

closeVideo.addEventListener(
  "click",
  () => {

    closeVideoExperience();

  }
);


/* =====================================================
   CLOSE EXPERIENCE
   ===================================================== */

function closeVideoExperience() {

  experienceVideo.pause();

  experienceVideo.removeAttribute(
    "src"
  );

  experienceVideo.load();


  videoExperience.classList.remove(
    "reveal"
  );

  videoExperience.style.opacity =
    "0";

  videoExperience.style.display =
    "none";


  experienceActive =
    false;

}


/* =====================================================
   AR READY
   ===================================================== */

scene.addEventListener(
  "arReady",
  () => {

    console.log(
      "MindAR ready - camera should be live"
    );

    arStatus.style.display =
      "none";

  }
);


/* =====================================================
   AR ERROR
   ===================================================== */

scene.addEventListener(
  "arError",
  event => {

    console.error(
      "MindAR error:",
      event
    );

    arStatus.style.display =
      "none";

    alert(
      "Camera could not start. Please allow camera permission and try again."
    );

  }
);


/* =====================================================
   START AR
   ===================================================== */

startButton.addEventListener(
  "click",
  () => {

    if (!targetsReady) {

      return;

    }


    startButton.disabled =
      true;

    startButton.textContent =
      "OPENING...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    if (!arSystem) {

      console.error(
        "MindAR system not found"
      );

      startButton.disabled =
        false;

      startButton.textContent =
        "UNVEIL ✦";

      return;

    }


    /*
      Show small status only while
      MindAR initializes.
    */

    arStatus.style.display =
      "flex";


    /*
      IMPORTANT FIX:

      DO NOT use:

        await arSystem.start();

      We start the engine and immediately
      remove the intro screen.

      Camera is therefore not hidden
      behind the premium intro.
    */

    try {

      arSystem.start();

    }

    catch(error) {

      console.error(
        "AR start error:",
        error
      );

      arStatus.style.display =
        "none";

      startButton.disabled =
        false;

      startButton.textContent =
        "UNVEIL ✦";

      return;

    }


    /*
      Reveal camera immediately.
    */

    introScreen.classList.add(
      "hide"
    );


    setTimeout(
      () => {

        introScreen.style.display =
          "none";

      },
      600
    );

  }
);


/* =====================================================
   LOAD AR CONTENT
   ===================================================== */

loadContent();


/* =====================================================
   DEBUG EVENTS
   ===================================================== */

scene.addEventListener(
  "loaded",
  () => {

    console.log(
      "A-Frame scene loaded"
    );

  }
);

</script>

</body>
</html>
