<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}


/* =================================
   START
================================= */

#startButton {

  position: fixed;

  z-index: 9000;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  padding: 18px 38px;

  font-size: 18px;

  font-weight: 600;

  letter-spacing: 2px;

  border: 1px solid #d4af37;

  border-radius: 50px;

  background: #111;

  color: #d4af37;

  box-shadow:
    0 0 20px
    rgba(212,175,55,0.25);

  cursor: pointer;
}


/* =================================
   LOADING
================================= */

#loadingText {

  position: fixed;

  z-index: 8999;

  top: 60%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  color: #d4af37;

  font-size: 14px;

  letter-spacing: 2px;

  text-align: center;
}


/* =================================
   STATUS
================================= */

#status {

  position: fixed;

  z-index: 8998;

  bottom: 25px;

  left: 50%;

  transform:
    translateX(-50%);

  color: #d4af37;

  font-size: 12px;

  letter-spacing: 1.5px;

  text-align: center;

  pointer-events: none;
}


/* =================================
   FULLSCREEN EXPERIENCE
================================= */

#experience {

  position: fixed;

  inset: 0;

  /*
    IMPORTANT:
    Above every video element.
  */

  z-index: 20000;

  display: none;

  overflow: hidden;

  background: transparent;

  pointer-events: none;
}


/*
  Fullscreen state.
*/

#experience.fullscreen {

  background: #000;
}


/* =================================
   CLOSE BUTTON
================================= */

#closeButton {

  position: fixed;

  z-index: 30000;

  top: 14px;

  right: 14px;

  width: 32px;

  height: 32px;

  padding: 0;

  border-radius: 50%;

  border: 1px solid
    rgba(212,175,55,0.85);

  background:
    rgba(0,0,0,0.72);

  color: #d4af37;

  font-size: 18px;

  font-weight: 300;

  line-height: 29px;

  text-align: center;

  display: none;

  pointer-events: auto;

  cursor: pointer;

  touch-action: manipulation;

  backdrop-filter: blur(8px);

  -webkit-backdrop-filter: blur(8px);
}


#experience.showClose
#closeButton {

  display: block;
}


/* =================================
   FULLSCREEN VIDEO CONTAINER
================================= */

#videoStage {

  position: fixed;

  inset: 0;

  z-index: 21000;

  display: flex;

  align-items: center;

  justify-content: center;

  pointer-events: none;

  overflow: hidden;

  background: transparent;
}


/* =================================
   VIDEO
================================= */

#experienceVideo {

  position: absolute;

  left: 50%;

  top: 50%;

  /*
    IMPORTANT:
    No black background here.
    Camera can remain visible
    around the actual video.
  */

  background: transparent;

  object-fit: contain;

  width: 100vw;

  height: 100vh;

  transform:
    translate(-50%, -50%)
    scale(0.12);

  transform-origin: center center;

  opacity: 1;

  transition:
    transform 4.5s
    cubic-bezier(
      0.22,
      1,
      0.36,
      1
    );

  pointer-events: none;
}


/*
  Final fullscreen.
*/

#experience.zoomed
#experienceVideo {

  transform:
    translate(-50%, -50%)
    scale(1);
}


/* =================================
   AR SCENE
================================= */

a-scene {

  position: fixed !important;

  inset: 0 !important;

  z-index: 1 !important;
}

</style>

</head>


<body>


<!-- =================================
     START BUTTON
================================= -->

<button
  id="startButton"
  disabled>

  LOADING...

</button>


<div id="loadingText">

  LOADING AR EXPERIENCE...

</div>


<div id="status"></div>


<!-- =================================
     EXPERIENCE
================================= -->

<div id="experience">

  <div id="videoStage"></div>

  <button
    id="closeButton"
    aria-label="Close">

    ×

  </button>

</div>


<!-- =================================
     AR
================================= -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets
    id="videoAssets">
  </a-assets>


  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    ">

  </a-camera>

</a-scene>


<script>


/* =================================
   ELEMENTS
================================= */

const startButton =
  document.querySelector(
    "#startButton"
  );


const loadingText =
  document.querySelector(
    "#loadingText"
  );


const status =
  document.querySelector(
    "#status"
  );


const scene =
  document.querySelector(
    "a-scene"
  );


const videoAssets =
  document.querySelector(
    "#videoAssets"
  );


const experience =
  document.querySelector(
    "#experience"
  );


const videoStage =
  document.querySelector(
    "#videoStage"
  );


const closeButton =
  document.querySelector(
    "#closeButton"
  );


/* =================================
   STATE
================================= */

let videos = [];

let targetsReady = false;

let experienceActive = false;

let currentVideo = null;

let currentPlane = null;


/* =================================
   LOAD CONTENT
================================= */

async function loadContent() {

  try {

    loadingText.style.display =
      "block";


    loadingText.textContent =
      "LOADING AR EXPERIENCE...";


    const response =
      await fetch(
        "./content.json"
      );


    if (!response.ok) {

      throw new Error(
        "content.json failed"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters"
      );

    }


    data.posters.forEach(
      poster => {


        /* ================================
           VIDEO
        ================================= */

        const video =
          document.createElement(
            "video"
          );


        const videoId =
          "video_" +
          poster.id;


        video.id =
          videoId;


        video.src =
          "./" +
          poster.video;


        video.loop =
          true;


        video.preload =
          "auto";


        video.crossOrigin =
          "anonymous";


        video.playsInline =
          true;


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        /*
          Keep all videos loaded/cached.
        */

        video.style.display =
          "none";


        videoAssets.appendChild(
          video
        );


        videos.push(
          video
        );


        /* ================================
           TARGET
        ================================= */

        const target =
          document.createElement(
            "a-entity"
          );


        target.setAttribute(
          "mindar-image-target",

          "targetIndex: " +
          poster.targetIndex
        );


        /* ================================
           AR VIDEO
        ================================= */

        const videoPlane =
          document.createElement(
            "a-video"
          );


        videoPlane.setAttribute(
          "src",
          "#" + videoId
        );


        videoPlane.setAttribute(
          "position",
          "0 0 0"
        );


        videoPlane.setAttribute(
          "width",
          "1"
        );


        videoPlane.setAttribute(
          "height",
          "1"
        );


        videoPlane.setAttribute(
          "material",
          "shader: flat"
        );


        target.appendChild(
          videoPlane
        );


        scene.appendChild(
          target
        );


        /* ================================
           TARGET FOUND
        ================================= */

        target.addEventListener(
          "targetFound",

          async () => {


            if (
              experienceActive
            ) {

              return;

            }


            console.log(
              "TARGET FOUND:",
              poster.id
            );


            stopOtherVideos(
              video
            );


            currentVideo =
              video;


            currentPlane =
              videoPlane;


            try {


              /*
                Start immediately.
              */

              video.currentTime =
                0;


              video.muted =
                false;


              await video.play();


              /*
                Hand off immediately.
              */

              startExperience(
                video,
                videoPlane
              );


            } catch (error) {

              console.error(
                "Play error:",
                error
              );

            }

          }
        );


        /* ================================
           TARGET LOST
        ================================= */

        target.addEventListener(
          "targetLost",

          () => {


            /*
              Once experience starts,
              targetLost does NOTHING.
            */

            if (
              experienceActive
            ) {

              return;

            }


            video.pause();

          }
        );

      }
    );


    targetsReady =
      true;


    loadingText.style.display =
      "none";


    startButton.disabled =
      false;


    startButton.textContent =
      "START AR";


  } catch (error) {


    console.error(
      error
    );


    loadingText.textContent =
      "FAILED TO LOAD AR";


    startButton.disabled =
      true;

  }

}


/* =================================
   STOP OTHER VIDEOS
================================= */

function stopOtherVideos(
  current
) {

  videos.forEach(
    video => {

      if (
        video !== current
      ) {

        video.pause();

        video.currentTime =
          0;

        video.muted =
          false;

      }

    }
  );

}


/* =================================
   START EXPERIENCE
================================= */

function startExperience(
  sourceVideo,
  sourcePlane
) {


  if (
    experienceActive
  ) {

    return;

  }


  experienceActive =
    true;


  /*
    Hide AR plane.
  */

  sourcePlane.setAttribute(
    "visible",
    "false"
  );


  /*
    Move SAME video element
    into fullscreen stage.

    NO second video.
  */

  videoStage.appendChild(
    sourceVideo
  );


  /*
    Remove asset display:none.
  */

  sourceVideo.style.display =
    "block";


  sourceVideo.style.position =
    "absolute";


  sourceVideo.style.left =
    "50%";


  sourceVideo.style.top =
    "50%";


  sourceVideo.style.width =
    "100vw";


  sourceVideo.style.height =
    "100vh";


  sourceVideo.style.objectFit =
    "contain";


  sourceVideo.style.background =
    "transparent";


  sourceVideo.style.zIndex =
    "21001";


  sourceVideo.style.pointerEvents =
    "none";


  /*
    Start at poster size.
  */

  sourceVideo.style.transform =
    "translate(-50%, -50%) scale(0.12)";


  /*
    Force initial layout.
  */

  void sourceVideo.offsetWidth;


  /*
    Show fullscreen layer.
  */

  experience.style.display =
    "block";


  experience.classList.add(
    "showClose"
  );


  /*
    Start cinematic zoom.
  */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          sourceVideo.style.transform =
            "translate(-50%, -50%) scale(1)";

        }
      );

    }
  );


  /*
    Stop MindAR tracking.

    IMPORTANT:
    Video element keeps playing.
  */

  const arSystem =
    scene.systems[
      "mindar-image-system"
    ];


  arSystem.stop()
    .then(() => {

      console.log(
        "MindAR tracking stopped."
      );

    })
    .catch(
      error => {

        console.log(
          "MindAR stop:",
          error
        );

      }
    );


  status.textContent =
    "✦ ENJOY THE EXPERIENCE ✦";

}


/* =================================
   CLOSE EXPERIENCE
================================= */

closeButton.addEventListener(
  "click",

  async event => {


    event.preventDefault();

    event.stopPropagation();


    console.log(
      "CLOSE PRESSED"
    );


    /*
      Stop current video.
    */

    if (
      currentVideo
    ) {

      currentVideo.pause();

      currentVideo.currentTime =
        0;


      /*
        Remove fullscreen styles.
      */

      currentVideo.style.position =
        "absolute";


      currentVideo.style.left =
        "";


      currentVideo.style.top =
        "";


      currentVideo.style.width =
        "";


      currentVideo.style.height =
        "";


      currentVideo.style.objectFit =
        "";


      currentVideo.style.background =
        "";


      currentVideo.style.zIndex =
        "";


      currentVideo.style.pointerEvents =
        "";


      currentVideo.style.transform =
        "";


      currentVideo.style.display =
        "none";


      /*
        Return SAME video element
        to A-Frame assets.

        No new video.
      */

      videoAssets.appendChild(
        currentVideo
      );

    }


    /*
      Restore AR plane.
    */

    if (
      currentPlane
    ) {

      currentPlane.setAttribute(
        "visible",
        "true"
      );

    }


    /*
      Hide experience.
    */

    experience.classList.remove(
      "showClose"
    );


    experience.classList.remove(
      "zoomed"
    );


    experience.style.display =
      "none";


    /*
      Reset state.
    */

    experienceActive =
      false;


    currentVideo =
      null;


    currentPlane =
      null;


    status.textContent =
      "RESTARTING CAMERA...";


    /*
      Restart MindAR.
    */

    try {

      const arSystem =
        scene.systems[
          "mindar-image-system"
        ];


      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {

      console.error(
        "AR restart failed:",
        error
      );


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";

    }

  }
);


/* =================================
   START AR
================================= */

startButton.addEventListener(
  "click",

  async () => {


    if (
      !targetsReady
    ) {

      return;

    }


    startButton.style.display =
      "none";


    loadingText.style.display =
      "none";


    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    try {

      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {


      console.error(
        "AR start error:",
        error
      );


      startButton.style.display =
        "block";


      startButton.textContent =
        "START AR";


      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* =================================
   LOAD
================================= */

loadContent();

</script>

</body>
</html>
