<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Peculiar AR - Cinematic Test</title>

  <!-- SAME PRODUCTION LIBRARIES -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #startButton {
      position: fixed;
      z-index: 9999;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 18px 35px;

      font-size: 20px;
      font-weight: 700;

      border: none;
      border-radius: 12px;

      background: #fff;
      color: #000;
    }

    #startButton:disabled {
      opacity: 0.55;
    }

    #loadingText {
      position: fixed;
      z-index: 9998;

      top: 60%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: #fff;

      font-size: 16px;

      display: none;
    }

    /*
      Small status for testing only.
    */

    #testStatus {
      position: fixed;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 7px 13px;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.65);

      color: #fff;

      font-size: 12px;

      pointer-events: none;

      opacity: 0.75;
    }

    /*
      The AR video plane itself is animated.
      NO SECOND VIDEO ELEMENT.
    */

    #cinematicTarget {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- SAME BASIC START BUTTON -->
  <button id="startButton" disabled>
    LOADING...
  </button>

  <div id="loadingText">
    Loading AR content...
  </div>

  <div id="testStatus">
    Preparing AR...
  </div>


  <!--
    =========================================================
    PRODUCTION AR CORE
    =========================================================
  -->

  <a-scene
    id="arScene"

    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"

    color-space="sRGB"

    renderer="colorManagement: true"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <a-assets id="videoAssets"></a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

  </a-scene>


  <script>

    /*
      =========================================================
      VARIABLES
      =========================================================
    */

    const startButton =
      document.querySelector("#startButton");

    const loadingText =
      document.querySelector("#loadingText");

    const scene =
      document.querySelector("#arScene");

    const videoAssets =
      document.querySelector("#videoAssets");

    const testStatus =
      document.querySelector("#testStatus");


    let videos = [];

    let targetsReady = false;

    let cinematicActive = false;

    let activeVideoPlane = null;

    let activeVideo = null;


    /*
      =========================================================
      LOAD CONTENT
      =========================================================
    */

    async function loadContent() {

      try {

        loadingText.style.display =
          "block";


        const response =
          await fetch(
            "./content.json?v=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Could not load content.json"
          );

        }


        const data =
          await response.json();


        if (
          !data.posters ||
          data.posters.length === 0
        ) {

          throw new Error(
            "No posters found"
          );

        }


        /*
          Create videos and targets.
        */

        data.posters.forEach(
          (poster) => {

            /*
              ================================================
              ORIGINAL VIDEO ELEMENT
              ================================================
            */

            const videoId =
              "video_" + poster.id;


            const video =
              document.createElement(
                "video"
              );


            video.id =
              videoId;


            video.src =
              "./" + poster.video;


            video.loop =
              true;


            video.crossOrigin =
              "anonymous";


            video.playsInline =
              true;


            video.setAttribute(
              "webkit-playsinline",
              ""
            );


            video.preload =
              "auto";


            /*
              DO NOT MUTE
            */

            video.muted =
              false;


            videoAssets.appendChild(
              video
            );


            videos.push(video);


            /*
              ================================================
              TARGET
              ================================================
            */

            const target =
              document.createElement(
                "a-entity"
              );


            target.setAttribute(
              "mindar-image-target",
              "targetIndex: " +
              poster.targetIndex
            );


            /*
              ================================================
              ORIGINAL AR VIDEO PLANE
              ================================================
            */

            const videoPlane =
              document.createElement(
                "a-video"
              );


            videoPlane.setAttribute(
              "src",
              "#" + videoId
            );


            videoPlane.setAttribute(
              "position",
              "0 0 0"
            );


            videoPlane.setAttribute(
              "width",
              "1"
            );


            videoPlane.setAttribute(
              "height",
              "1"
            );


            videoPlane.setAttribute(
              "material",
              "shader: flat"
            );


            videoPlane.setAttribute(
              "visible",
              "true"
            );


            target.appendChild(
              videoPlane
            );


            scene.appendChild(
              target
            );


            /*
              =================================================
              TARGET FOUND
              =================================================
            */

            target.addEventListener(
              "targetFound",
              async () => {

                /*
                  If a cinematic experience
                  is already active, ignore
                  additional target events.
                */

                if (
                  cinematicActive
                ) {

                  return;

                }


                activeVideo =
                  video;


                activeVideoPlane =
                  videoPlane;


                stopOtherVideos(
                  video
                );


                testStatus.textContent =
                  "Poster detected...";


                try {

                  /*
                    ORIGINAL PRODUCTION
                    PLAYBACK METHOD
                  */

                  video.currentTime =
                    0;


                  await video.play();


                  testStatus.textContent =
                    "Video playing...";


                  /*
                    Give browser a moment
                    to render the playing video.
                  */

                  await nextFrames(2);


                  /*
                    Start cinematic animation.
                  */

                  await startCinematicZoom(
                    target,
                    videoPlane,
                    video
                  );


                } catch (error) {

                  console.error(
                    "Video play error:",
                    error
                  );


                  testStatus.textContent =
                    "Video playback error";

                }

              }
            );


            /*
              =================================================
              TARGET LOST
              =================================================
            */

            target.addEventListener(
              "targetLost",
              () => {

                /*
                  IMPORTANT:
                  After cinematic mode begins,
                  DO NOT pause the video.
                */

                if (
                  cinematicActive
                ) {

                  return;

                }


                video.pause();

              }
            );

          }
        );


        targetsReady =
          true;


        loadingText.style.display =
          "none";


        startButton.disabled =
          false;


        startButton.textContent =
          "START AR";


        testStatus.textContent =
          "AR Ready";


        console.log(
          "AR content loaded:",
          data.posters.length,
          "posters"
        );


      } catch (error) {

        console.error(
          "Content database error:",
          error
        );


        loadingText.textContent =
          "Failed to load AR content.";


        startButton.disabled =
          true;

      }

    }


    /*
      =========================================================
      STOP OTHER VIDEOS
      =========================================================
    */

    function stopOtherVideos(
      currentVideo
    ) {

      videos.forEach(
        (video) => {

          if (
            video !== currentVideo
          ) {

            video.pause();

            video.currentTime =
              0;

          }

        }
      );

    }


    /*
      =========================================================
      NEXT FRAMES
      =========================================================
    */

    function nextFrames(
      count
    ) {

      return new Promise(
        (resolve) => {

          let remaining =
            count;


          function frame() {

            remaining--;

            if (
              remaining <= 0
            ) {

              resolve();

              return;

            }


            requestAnimationFrame(
              frame
            );

          }


          requestAnimationFrame(
            frame
          );

        }
      );

    }


    /*
      =========================================================
      VIDEO ASPECT RATIO
      =========================================================
    */

    function updateVideoAspect(
      videoPlane,
      video
    ) {

      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        return;

      }


      const ratio =
        video.videoWidth /
        video.videoHeight;


      /*
        Keep the actual video ratio.

        Portrait:
          width < height

        Landscape:
          width > height
      */

      if (
        ratio >= 1
      ) {

        videoPlane.setAttribute(
          "width",
          ratio
        );


        videoPlane.setAttribute(
          "height",
          1
        );

      } else {

        videoPlane.setAttribute(
          "width",
          1
        );


        videoPlane.setAttribute(
          "height",
          1 / ratio
        );

      }

    }


    /*
      =========================================================
      CINEMATIC ZOOM
      =========================================================
    */

    async function startCinematicZoom(
      target,
      videoPlane,
      video
    ) {

      if (
        cinematicActive
      ) {

        return;

      }


      cinematicActive =
        true;


      testStatus.textContent =
        "Cinematic reveal...";


      /*
        Get actual video dimensions.
      */

      updateVideoAspect(
        videoPlane,
        video
      );


      /*
        IMPORTANT:
        The video is already playing.

        We now detach the SAME
        <a-video> from the target.

        No second video is created.
      */

      target.removeChild(
        videoPlane
      );


      scene.appendChild(
        videoPlane
      );


      /*
        Put video directly in front
        of the camera.
      */

      videoPlane.setAttribute(
        "position",
        "0 0 -1.25"
      );


      videoPlane.setAttribute(
        "rotation",
        "0 0 0"
      );


      videoPlane.setAttribute(
        "visible",
        "true"
      );


      /*
        Start small.
      */

      videoPlane.setAttribute(
        "scale",
        "0.16 0.16 0.16"
      );


      /*
        Make sure the video is
        visible.
      */

      videoPlane.setAttribute(
        "material",
        "shader: flat"
      );


      /*
        Force browser render.
      */

      await nextFrames(2);


      /*
        ================================================
        CINEMATIC ZOOM
        ================================================
      */

      testStatus.textContent =
        "Slow cinematic zoom...";


      /*
        A-Frame animation.

        4.5 seconds:
        small → large

        The SAME video continues playing
        during the entire animation.
      */

      videoPlane.setAttribute(
        "animation__zoom",
        [
          "property: scale;",
          "from: 0.16 0.16 0.16;",
          "to: 3.8 3.8 3.8;",
          "dur: 4500;",
          "easing: easeOutCubic;",
          "startEvents: cinematicZoom"
        ].join(" ")
      );


      /*
        Trigger animation.
      */

      videoPlane.emit(
        "cinematicZoom"
      );


      /*
        After the cinematic animation
        finishes, keep video playing.
      */

      setTimeout(
        () => {

          testStatus.textContent =
            "Full screen — video playing";

        },
        4600
      );

    }


    /*
      =========================================================
      START AR
      =========================================================
    */

    startButton.addEventListener(
      "click",
      async () => {

        if (
          !targetsReady
        ) {

          return;

        }


        startButton.style.display =
          "none";


        const arSystem =
          scene.systems[
            "mindar-image-system"
          ];


        try {

          await arSystem.start();


          testStatus.textContent =
            "Point camera at poster";


        } catch (error) {

          console.error(
            "AR start error:",
            error
          );


          startButton.style.display =
            "block";


          startButton.textContent =
            "START AR";

        }

      }
    );


    /*
      =========================================================
      LOAD
      =========================================================
    */

    loadContent();

  </script>

</body>
</html>
