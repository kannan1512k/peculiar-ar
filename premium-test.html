<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }


    /* ================================
       START BUTTON
    ================================= */

    #startButton {

      position: fixed;

      z-index: 9999;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 18px 38px;

      font-size: 18px;
      font-weight: 600;

      letter-spacing: 2px;

      border: 1px solid #d4af37;

      border-radius: 50px;

      background: #111;

      color: #d4af37;

      box-shadow:
        0 0 20px rgba(212,175,55,0.25);

      cursor: pointer;
    }


    /* ================================
       LOADING
    ================================= */

    #loadingText {

      position: fixed;

      z-index: 9998;

      top: 60%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: #d4af37;

      font-size: 14px;

      letter-spacing: 2px;

      text-align: center;
    }


    /* ================================
       STATUS
    ================================= */

    #status {

      position: fixed;

      z-index: 9997;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      color: #d4af37;

      font-size: 12px;

      letter-spacing: 1.5px;

      text-align: center;

      pointer-events: none;
    }


    /* ================================
       FULLSCREEN EXPERIENCE
    ================================= */

    #experience {

      position: fixed;

      inset: 0;

      z-index: 10000;

      display: none;

      background: #000;

      overflow: hidden;

      align-items: center;

      justify-content: center;
    }


    #experienceVideo {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 100vw;
      height: 100vh;

      object-fit: contain;

      transform:
        translate(-50%, -50%)
        scale(0.18);

      opacity: 0;

      background: #000;

      transition:
        transform 4.5s
        cubic-bezier(0.22, 1, 0.36, 1),

        opacity 0.35s ease;
    }


    /*
      Video becomes full screen.
    */

    #experience.zoomed #experienceVideo {

      transform:
        translate(-50%, -50%)
        scale(1);

      opacity: 1;
    }


    /* ================================
       CLOSE BUTTON
    ================================= */

    #closeButton {

      position: fixed;

      z-index: 10002;

      top: 18px;
      right: 18px;

      width: 46px;
      height: 46px;

      border-radius: 50%;

      border: 1px solid
        rgba(212,175,55,0.8);

      background:
        rgba(0,0,0,0.65);

      color: #d4af37;

      font-size: 25px;

      line-height: 42px;

      text-align: center;

      cursor: pointer;

      display: none;

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);
    }


    #experience.showClose #closeButton {

      display: block;
    }

  </style>

</head>


<body>


<!-- ================================
     START
================================= -->

<button
  id="startButton"
  disabled>

  LOADING...

</button>


<div id="loadingText">

  LOADING AR EXPERIENCE...

</div>


<div id="status"></div>


<!-- ================================
     INDEPENDENT VIDEO EXPERIENCE
================================= -->

<div id="experience">

  <video
    id="experienceVideo"
    playsinline
    webkit-playsinline
    loop>
  </video>


  <button
    id="closeButton"
    aria-label="Close">

    ×

  </button>

</div>


<!-- ================================
     AR SCENE
================================= -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets id="videoAssets"></a-assets>


  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    ">

  </a-camera>


</a-scene>


<script>


/* =================================
   ELEMENTS
================================= */

const startButton =
  document.querySelector(
    "#startButton"
  );


const loadingText =
  document.querySelector(
    "#loadingText"
  );


const status =
  document.querySelector(
    "#status"
  );


const scene =
  document.querySelector(
    "a-scene"
  );


const videoAssets =
  document.querySelector(
    "#videoAssets"
  );


const experience =
  document.querySelector(
    "#experience"
  );


const experienceVideo =
  document.querySelector(
    "#experienceVideo"
  );


const closeButton =
  document.querySelector(
    "#closeButton"
  );


/* =================================
   STATE
================================= */

let videos = [];

let targetsReady = false;

let experienceActive = false;

let currentSourceVideo = null;


/* =================================
   LOAD CONTENT
================================= */

async function loadContent() {

  try {

    loadingText.style.display =
      "block";

    loadingText.textContent =
      "LOADING AR EXPERIENCE...";


    const response =
      await fetch(
        "./content.json"
      );


    if (!response.ok) {

      throw new Error(
        "Could not load content.json"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters found"
      );

    }


    /* =================================
       CREATE EVERY POSTER
    ================================= */

    data.posters.forEach(
      poster => {


        const videoId =
          "video_" + poster.id;


        /* ================================
           SOURCE VIDEO
        ================================= */

        const video =
          document.createElement(
            "video"
          );


        video.id =
          videoId;


        video.src =
          "./" + poster.video;


        video.loop =
          true;


        video.crossOrigin =
          "anonymous";


        video.playsInline =
          true;


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        videoAssets.appendChild(
          video
        );


        videos.push(
          video
        );


        /* ================================
           TARGET
        ================================= */

        const target =
          document.createElement(
            "a-entity"
          );


        target.setAttribute(
          "mindar-image-target",

          "targetIndex: " +
          poster.targetIndex
        );


        /* ================================
           AR VIDEO PLANE
        ================================= */

        const videoPlane =
          document.createElement(
            "a-video"
          );


        videoPlane.setAttribute(
          "src",
          "#" + videoId
        );


        videoPlane.setAttribute(
          "position",
          "0 0 0"
        );


        videoPlane.setAttribute(
          "width",
          "1"
        );


        videoPlane.setAttribute(
          "height",
          "1"
        );


        videoPlane.setAttribute(
          "material",
          "shader: flat"
        );


        target.appendChild(
          videoPlane
        );


        scene.appendChild(
          target
        );


        /* =================================
           TARGET FOUND
        ================================= */

        target.addEventListener(
          "targetFound",

          async () => {


            /*
              If another experience is
              already running, ignore
              tracking completely.
            */

            if (
              experienceActive
            ) {

              return;

            }


            console.log(
              "TARGET FOUND:",
              poster.id
            );


            stopOtherVideos(
              video
            );


            try {


              /*
                Start source video.

                This is what gives us
                immediate playback.
              */

              video.currentTime =
                0;


              await video.play();


              /*
                Immediately hand over
                to independent video.

                NO 4.5 second wait.
                NO waiting for poster.
              */

              await launchExperience(
                video
              );


            } catch (error) {

              console.error(
                "Video start error:",
                error
              );

            }

          }
        );


        /* =================================
           TARGET LOST
        ================================= */

        target.addEventListener(
          "targetLost",

          () => {


            /*
              Once fullscreen experience
              starts, poster tracking has
              ZERO control over the video.
            */

            if (
              experienceActive
            ) {

              return;

            }


            video.pause();

          }
        );

      }
    );


    targetsReady =
      true;


    loadingText.style.display =
      "none";


    startButton.disabled =
      false;


    startButton.textContent =
      "START AR";


    console.log(
      "AR content loaded:",
      data.posters.length,
      "posters"
    );


  } catch (error) {


    console.error(
      "Content loading error:",
      error
    );


    loadingText.textContent =
      "FAILED TO LOAD AR";


    startButton.disabled =
      true;

  }

}


/* =================================
   STOP OTHER VIDEOS
================================= */

function stopOtherVideos(
  currentVideo
) {

  videos.forEach(
    video => {

      if (
        video !== currentVideo
      ) {

        video.pause();

        video.currentTime =
          0;

      }

    }
  );

}


/* =================================
   LAUNCH INDEPENDENT VIDEO
================================= */

async function launchExperience(
  sourceVideo
) {


  if (
    experienceActive
  ) {

    return;

  }


  /*
    LOCK EXPERIENCE.

    From this point:
    poster movement,
    poster loss,
    camera movement

    CANNOT stop the video.
  */

  experienceActive =
    true;


  currentSourceVideo =
    sourceVideo;


  status.textContent =
    "✦ EXPERIENCE ACTIVATED ✦";


  /*
    Copy same video source.
  */

  experienceVideo.src =
    sourceVideo.currentSrc ||
    sourceVideo.src;


  experienceVideo.loop =
    true;


  experienceVideo.playsInline =
    true;


  experienceVideo.setAttribute(
    "webkit-playsinline",
    ""
  );


  /*
    Sync exact playback position.

    So fullscreen does NOT restart
    from the beginning.
  */

  try {

    experienceVideo.currentTime =
      sourceVideo.currentTime;

  } catch (error) {}


  /*
    Prepare fullscreen layer.
  */

  experience.style.display =
    "flex";


  /*
    IMPORTANT:

    Mute source BEFORE fullscreen
    starts to prevent double sound.
  */

  sourceVideo.muted =
    true;


  /*
    Start independent video
    immediately.
  */

  try {

    await experienceVideo.play();

  } catch (error) {

    console.error(
      "Fullscreen video failed:",
      error
    );


    /*
      Fallback.
    */

    sourceVideo.muted =
      false;

    experienceActive =
      false;

    experience.style.display =
      "none";

    return;

  }


  /*
    Show the video immediately.
  */

  experience.classList.add(
    "zoomed"
  );


  experience.classList.add(
    "showClose"
  );


  /*
    NOW stop the camera/AR system.

    This is the key change.

    Poster tracking is completely
    disconnected after scan.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    await arSystem.stop();


  } catch (error) {

    console.log(
      "AR stop:",
      error
    );

  }


  /*
    Stop the old AR video.

    Fullscreen video is now the
    ONLY video playing.
  */

  sourceVideo.pause();


  status.textContent =
    "✦ ENJOY THE EXPERIENCE ✦";


  console.log(
    "AR tracking stopped."
  );


  console.log(
    "Independent fullscreen video running."
  );

}


/* =================================
   CLOSE EXPERIENCE
================================= */

closeButton.addEventListener(
  "click",

  async () => {


    /*
      Stop fullscreen video.
    */

    experienceVideo.pause();


    /*
      Remove source.
    */

    experienceVideo.removeAttribute(
      "src"
    );


    experienceVideo.load();


    /*
      Hide fullscreen.
    */

    experience.classList.remove(
      "zoomed"
    );


    experience.classList.remove(
      "showClose"
    );


    experience.style.display =
      "none";


    /*
      Reset state.
    */

    experienceActive =
      false;


    currentSourceVideo =
      null;


    status.textContent =
      "";


    /*
      Reset source videos.
    */

    videos.forEach(
      video => {

        video.pause();

        video.currentTime =
          0;

        video.muted =
          false;

      }
    );


    /*
      Restart AR camera.

      User can scan another poster.
    */

    try {

      const arSystem =
        scene.systems[
          "mindar-image-system"
        ];


      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {

      console.error(
        "AR restart error:",
        error
      );

    }

  }
);


/* =================================
   START AR
================================= */

startButton.addEventListener(
  "click",

  async () => {


    if (
      !targetsReady
    ) {

      return;

    }


    startButton.style.display =
      "none";


    loadingText.style.display =
      "none";


    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    try {

      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {


      console.error(
        "AR start error:",
        error
      );


      startButton.style.display =
        "block";


      startButton.textContent =
        "START AR";


      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* =================================
   INITIAL LOAD
================================= */

loadContent();


</script>

</body>
</html>
