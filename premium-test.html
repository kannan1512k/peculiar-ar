<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 18px 38px;

      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;

      border: 1px solid #d4af37;
      border-radius: 50px;

      background: #111;
      color: #d4af37;

      box-shadow: 0 0 20px rgba(212,175,55,0.25);

      cursor: pointer;
    }

    #loadingText {
      position: fixed;
      z-index: 9998;

      top: 60%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: #d4af37;

      font-size: 14px;
      letter-spacing: 2px;

      display: block;
      text-align: center;
    }

    #status {
      position: fixed;
      z-index: 9997;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      color: #d4af37;

      font-size: 12px;
      letter-spacing: 1.5px;

      text-align: center;

      pointer-events: none;
    }


    /* =================================
       INDEPENDENT FULL SCREEN VIDEO
    ================================= */

    #fullScreenLayer {
      position: fixed;

      inset: 0;

      z-index: 5000;

      display: none;

      background: #000;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      pointer-events: none;
    }


    #fullScreenVideo {
      width: 100vw;
      height: 100vh;

      object-fit: contain;

      display: block;

      background: #000;

      opacity: 0;

      transition:
        opacity 0.35s ease;
    }


    #fullScreenLayer.active {
      display: flex;
    }


    #fullScreenLayer.visible
    #fullScreenVideo {
      opacity: 1;
    }

  </style>
</head>


<body>


<button id="startButton" disabled>
  LOADING...
</button>


<div id="loadingText">
  LOADING AR EXPERIENCE...
</div>


<div id="status"></div>


<!--
  Independent video layer.
  This remains completely separate from MindAR
  after the hand-off.
-->

<div id="fullScreenLayer">

  <video
    id="fullScreenVideo"
    playsinline
    webkit-playsinline
    loop>
  </video>

</div>


<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets id="videoAssets"></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>


<script>


const startButton =
  document.querySelector("#startButton");

const loadingText =
  document.querySelector("#loadingText");

const status =
  document.querySelector("#status");

const scene =
  document.querySelector("a-scene");

const videoAssets =
  document.querySelector("#videoAssets");


/* FULL SCREEN VIDEO */

const fullScreenLayer =
  document.querySelector("#fullScreenLayer");

const fullScreenVideo =
  document.querySelector("#fullScreenVideo");


let videos = [];

let targetsReady = false;


/*
  Once hand-off happens,
  this becomes TRUE.

  From this point the video is
  independent from poster tracking.
*/

let experienceActive = false;


/* =================================
   LOAD CONTENT DATABASE
================================= */

async function loadContent() {

  try {

    loadingText.style.display = "block";

    loadingText.textContent =
      "LOADING AR EXPERIENCE...";


    const response =
      await fetch("./content.json");


    if (!response.ok) {

      throw new Error(
        "Could not load content.json"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters found in content.json"
      );

    }


    /* =================================
       CREATE VIDEOS + TARGETS
    ================================= */

    data.posters.forEach(poster => {


      const videoId =
        "video_" + poster.id;


      /* CREATE SOURCE VIDEO */

      const video =
        document.createElement("video");


      video.id =
        videoId;

      video.src =
        "./" + poster.video;

      video.loop =
        true;

      video.crossOrigin =
        "anonymous";

      video.playsInline =
        true;

      video.setAttribute(
        "webkit-playsinline",
        ""
      );


      videoAssets.appendChild(video);

      videos.push(video);


      /* CREATE TARGET */

      const target =
        document.createElement("a-entity");


      target.setAttribute(
        "mindar-image-target",
        "targetIndex: " +
        poster.targetIndex
      );


      /* CREATE AR VIDEO PLANE */

      const videoPlane =
        document.createElement("a-video");


      videoPlane.setAttribute(
        "src",
        "#" + videoId
      );


      videoPlane.setAttribute(
        "position",
        "0 0 0"
      );


      videoPlane.setAttribute(
        "width",
        "1"
      );


      videoPlane.setAttribute(
        "height",
        "1"
      );


      videoPlane.setAttribute(
        "material",
        "shader: flat"
      );


      videoPlane.setAttribute(
        "scale",
        "1 1 1"
      );


      target.appendChild(
        videoPlane
      );


      scene.appendChild(
        target
      );


      /* =================================
         TARGET FOUND
      ================================= */

      target.addEventListener(
        "targetFound",
        async () => {


          /*
            If the experience has already
            been handed off to fullscreen,
            DO NOTHING.

            This is important:
            poster movement/loss must not
            control the fullscreen video.
          */

          if (experienceActive) {
            return;
          }


          console.log(
            "TARGET FOUND:",
            poster.id
          );


          status.textContent =
            "✦ EXPERIENCE ACTIVATED ✦";


          stopOtherVideos(video);


          try {


            /*
              Start original AR video.
            */

            video.currentTime = 0;

            await video.play();


            /*
              Reset scale.
            */

            videoPlane.object3D.scale.set(
              1,
              1,
              1
            );


            /*
              Smooth cinematic zoom.
            */

            videoPlane.setAttribute(
              "animation__zoom",
              {
                property: "scale",

                from: "1 1 1",

                to: "2.5 2.5 2.5",

                dur: 4500,

                easing: "easeInOutCubic"
              }
            );


            /*
              After zoom finishes,
              hand over to independent
              fullscreen video.
            */

            setTimeout(() => {

              if (!experienceActive) {

                handOffToFullScreen(
                  video
                );

              }

            }, 4500);


          } catch (error) {

            console.log(
              "Video play blocked:",
              poster.id,
              error
            );

          }

        }
      );


      /* =================================
         TARGET LOST
      ================================= */

      target.addEventListener(
        "targetLost",
        () => {


          /*
            IMPORTANT:

            Before fullscreen hand-off,
            normal AR behaviour remains.

            AFTER hand-off,
            poster loss does absolutely
            nothing to the video.
          */

          if (experienceActive) {

            console.log(
              "Target lost - fullscreen continues"
            );

            return;

          }


          console.log(
            "TARGET LOST:",
            poster.id
          );


          video.pause();


          videoPlane.removeAttribute(
            "animation__zoom"
          );


          videoPlane.object3D.scale.set(
            1,
            1,
            1
          );


          status.textContent = "";

        }
      );

    });


    /* READY */

    targetsReady = true;

    loadingText.style.display =
      "none";

    startButton.disabled =
      false;

    startButton.textContent =
      "START AR";


    console.log(
      "AR content loaded:",
      data.posters.length,
      "posters"
    );


  } catch (error) {


    console.error(
      "Content database error:",
      error
    );


    loadingText.textContent =
      "FAILED TO LOAD AR";


    startButton.disabled =
      true;

  }

}


/* =================================
   STOP OTHER VIDEOS
================================= */

function stopOtherVideos(
  currentVideo
) {

  videos.forEach(video => {

    if (video !== currentVideo) {

      video.pause();

      video.currentTime = 0;

    }

  });

}


/* =================================
   FULL SCREEN HAND-OFF
================================= */

async function handOffToFullScreen(
  sourceVideo
) {


  if (experienceActive) {
    return;
  }


  console.log(
    "Starting fullscreen hand-off"
  );


  /*
    Lock experience immediately.

    From this point poster tracking
    cannot stop the experience.
  */

  experienceActive = true;


  /*
    Save exact playback position.

    This prevents the fullscreen video
    from restarting from zero.
  */

  const currentTime =
    sourceVideo.currentTime;


  /*
    Use exactly the same video file.
  */

  fullScreenVideo.src =
    sourceVideo.currentSrc ||
    sourceVideo.src;


  fullScreenVideo.loop =
    true;

  fullScreenVideo.playsInline =
    true;

  fullScreenVideo.setAttribute(
    "webkit-playsinline",
    ""
  );


  /*
    Sync playback position.
  */

  try {

    fullScreenVideo.currentTime =
      currentTime;

  } catch (error) {

    console.log(
      "Time sync waiting..."
    );

  }


  /*
    Make fullscreen layer ready.
  */

  fullScreenLayer.classList.add(
    "active"
  );


  /*
    Wait until video can play.
  */

  try {

    await new Promise(resolve => {

      if (
        fullScreenVideo.readyState >= 2
      ) {

        resolve();

        return;

      }


      fullScreenVideo.addEventListener(
        "loadeddata",
        resolve,
        {
          once: true
        }
      );

    });


    /*
      Sync again after loading.
    */

    try {

      fullScreenVideo.currentTime =
        currentTime;

    } catch (error) {}



    /*
      VERY IMPORTANT:

      Mute the AR source first.

      This prevents double audio.
    */

    sourceVideo.muted = true;


    /*
      Start fullscreen video.
    */

    await fullScreenVideo.play();


    /*
      Show fullscreen video.
    */

    fullScreenLayer.classList.add(
      "visible"
    );


    /*
      Now the original AR video
      is no longer needed.
    */

    sourceVideo.pause();


    /*
      Remove AR zoom animation.
    */

    const planes =
      scene.querySelectorAll(
        "a-video"
      );


    planes.forEach(plane => {

      plane.removeAttribute(
        "animation__zoom"
      );

    });


    status.textContent =
      "✦ ENJOY THE EXPERIENCE ✦";


    console.log(
      "Fullscreen hand-off complete"
    );


  } catch (error) {


    console.error(
      "Fullscreen hand-off failed:",
      error
    );


    /*
      Emergency fallback:

      If fullscreen video cannot start,
      keep original AR video working.
    */

    sourceVideo.muted = false;

    experienceActive = false;

    fullScreenLayer.classList.remove(
      "active"
    );

    fullScreenLayer.classList.remove(
      "visible"
    );

  }

}


/* =================================
   START AR
================================= */

startButton.addEventListener(
  "click",
  async () => {


    if (!targetsReady) {
      return;
    }


    startButton.style.display =
      "none";


    loadingText.style.display =
      "none";


    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    try {


      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {


      console.error(
        "AR start error:",
        error
      );


      startButton.style.display =
        "block";


      startButton.textContent =
        "START AR";


      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* =================================
   LOAD CONTENT
================================= */

loadContent();


</script>

</body>
</html>
