<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}


/* =================================
   START BUTTON
================================= */

#startButton {

  position: fixed;

  z-index: 9000;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  padding: 18px 38px;

  font-size: 18px;

  font-weight: 600;

  letter-spacing: 2px;

  border: 1px solid #d4af37;

  border-radius: 50px;

  background: #111;

  color: #d4af37;

  cursor: pointer;
}


/* =================================
   LOADING
================================= */

#loadingText {

  position: fixed;

  z-index: 8999;

  top: 60%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  color: #d4af37;

  font-size: 14px;

  letter-spacing: 2px;

  text-align: center;
}


/* =================================
   STATUS
================================= */

#status {

  position: fixed;

  z-index: 8998;

  bottom: 25px;
  left: 50%;

  transform:
    translateX(-50%);

  color: #d4af37;

  font-size: 12px;

  letter-spacing: 1.5px;

  text-align: center;

  pointer-events: none;
}


/* =================================
   EXPERIENCE OVERLAY

   IMPORTANT:
   Transparent during zoom.
================================= */

#experience {

  position: fixed;

  inset: 0;

  z-index: 20000;

  display: none;

  background: transparent;

  overflow: hidden;

  pointer-events: none;
}


/* =================================
   VIDEO

   IMPORTANT:
   The video element itself is
   NOT viewport-sized initially.
================================= */

#experienceVideo {

  position: fixed;

  left: 50%;
  top: 50%;

  /*
    JS sets the actual width/height
    according to video aspect ratio.
  */

  width: 100px;
  height: 100px;

  object-fit: fill;

  transform:
    translate(-50%, -50%)
    scale(0.18);

  transform-origin: center center;

  background: transparent;

  opacity: 1;

  z-index: 20001;

  pointer-events: none;

  transition:
    transform 4.5s
    cubic-bezier(
      0.22,
      1,
      0.36,
      1
    );
}


/* =================================
   ZOOM
================================= */

#experience.zoomed
#experienceVideo {

  transform:
    translate(-50%, -50%)
    scale(1);
}


/* =================================
   CLOSE BUTTON

   Highest layer.
================================= */

#closeButton {

  position: fixed;

  z-index: 99999;

  top: 14px;
  right: 14px;

  width: 32px;
  height: 32px;

  min-width: 32px;
  min-height: 32px;

  padding: 0;

  border-radius: 50%;

  border: 1px solid
    rgba(212,175,55,0.9);

  background:
    rgba(0,0,0,0.75);

  color: #d4af37;

  font-size: 18px;

  font-weight: 300;

  line-height: 29px;

  text-align: center;

  display: none;

  pointer-events: auto;

  touch-action: manipulation;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  -webkit-tap-highlight-color:
    transparent;
}


#experience.showClose
#closeButton {

  display: block;
}


/* =================================
   AR SCENE

   Keep camera visible.
================================= */

a-scene {

  position: fixed !important;

  inset: 0 !important;

  z-index: 1 !important;
}

</style>

</head>


<body>


<button
  id="startButton"
  disabled>

  LOADING...

</button>


<div id="loadingText">

  LOADING AR EXPERIENCE...

</div>


<div id="status"></div>


<!-- =================================
     EXPERIENCE
================================= -->

<div id="experience">

  <button
    id="closeButton"
    aria-label="Close">

    ×

  </button>

</div>


<!-- =================================
     AR SCENE
================================= -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets
    id="videoAssets">
  </a-assets>


  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    ">

  </a-camera>

</a-scene>


<script>


/* =================================
   ELEMENTS
================================= */

const startButton =
  document.querySelector(
    "#startButton"
  );


const loadingText =
  document.querySelector(
    "#loadingText"
  );


const status =
  document.querySelector(
    "#status"
  );


const scene =
  document.querySelector(
    "a-scene"
  );


const videoAssets =
  document.querySelector(
    "#videoAssets"
  );


const experience =
  document.querySelector(
    "#experience"
  );


const closeButton =
  document.querySelector(
    "#closeButton"
  );


/* =================================
   STATE
================================= */

let videos = [];

let targetsReady = false;

let experienceActive = false;

let currentVideo = null;

let currentPlane = null;


/* =================================
   CALCULATE VIDEO SIZE
================================= */

function setVideoSize(video) {

  const vw =
    window.innerWidth;

  const vh =
    window.innerHeight;


  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  /*
    If metadata is not ready,
    use a safe 16:9 fallback.
  */

  if (
    !videoWidth ||
    !videoHeight
  ) {

    const ratio =
      16 / 9;

    if (
      vw / vh > ratio
    ) {

      video.style.width =
        (vh * ratio) + "px";

      video.style.height =
        vh + "px";

    } else {

      video.style.width =
        vw + "px";

      video.style.height =
        (vw / ratio) + "px";

    }

    return;
  }


  const ratio =
    videoWidth /
    videoHeight;


  /*
    CONTAIN calculation.

    The actual element itself gets
    the correct aspect ratio.

    Therefore no black viewport-sized
    video box covers the camera.
  */

  if (
    vw / vh > ratio
  ) {

    /*
      Viewport is wider.
      Fit by height.
    */

    video.style.height =
      vh + "px";

    video.style.width =
      (vh * ratio) + "px";

  } else {

    /*
      Viewport is taller.
      Fit by width.
    */

    video.style.width =
      vw + "px";

    video.style.height =
      (vw / ratio) + "px";

  }

}


/* =================================
   LOAD CONTENT
================================= */

async function loadContent() {

  try {

    loadingText.style.display =
      "block";


    const response =
      await fetch(
        "./content.json"
      );


    if (!response.ok) {

      throw new Error(
        "content.json failed"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      !data.posters.length
    ) {

      throw new Error(
        "No posters found"
      );

    }


    data.posters.forEach(
      poster => {


        /* ================================
           VIDEO
        ================================= */

        const video =
          document.createElement(
            "video"
          );


        const videoId =
          "video_" +
          poster.id;


        video.id =
          videoId;


        video.src =
          "./" +
          poster.video;


        video.loop =
          true;


        video.preload =
          "auto";


        video.crossOrigin =
          "anonymous";


        video.playsInline =
          true;


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        videoAssets.appendChild(
          video
        );


        videos.push(
          video
        );


        /* ================================
           TARGET
        ================================= */

        const target =
          document.createElement(
            "a-entity"
          );


        target.setAttribute(
          "mindar-image-target",

          "targetIndex: " +
          poster.targetIndex
        );


        /* ================================
           AR VIDEO
        ================================= */

        const videoPlane =
          document.createElement(
            "a-video"
          );


        videoPlane.setAttribute(
          "src",
          "#" + videoId
        );


        videoPlane.setAttribute(
          "position",
          "0 0 0"
        );


        videoPlane.setAttribute(
          "width",
          "1"
        );


        videoPlane.setAttribute(
          "height",
          "1"
        );


        videoPlane.setAttribute(
          "material",
          "shader: flat"
        );


        target.appendChild(
          videoPlane
        );


        scene.appendChild(
          target
        );


        /* ================================
           TARGET FOUND
        ================================= */

        target.addEventListener(
          "targetFound",

          async () => {


            if (
              experienceActive
            ) {

              return;

            }


            stopOtherVideos(
              video
            );


            currentVideo =
              video;


            currentPlane =
              videoPlane;


            try {


              video.currentTime =
                0;


              video.muted =
                false;


              await video.play();


              /*
                Wait for actual video
                dimensions before
                showing fullscreen element.
              */

              if (
                video.readyState < 1
              ) {

                await new Promise(
                  resolve => {

                    video.addEventListener(
                      "loadedmetadata",
                      resolve,
                      {
                        once: true
                      }
                    );

                  }
                );

              }


              startExperience(
                video,
                videoPlane
              );


            } catch (error) {

              console.error(
                "Video error:",
                error
              );

            }

          }
        );


        /* ================================
           TARGET LOST
        ================================= */

        target.addEventListener(
          "targetLost",

          () => {


            /*
              Once experience starts,
              tracking cannot stop it.
            */

            if (
              experienceActive
            ) {

              return;

            }


            video.pause();

          }
        );

      }
    );


    targetsReady =
      true;


    loadingText.style.display =
      "none";


    startButton.disabled =
      false;


    startButton.textContent =
      "START AR";


  } catch (error) {

    console.error(
      error
    );


    loadingText.textContent =
      "FAILED TO LOAD AR";


    startButton.disabled =
      true;

  }

}


/* =================================
   STOP OTHER VIDEOS
================================= */

function stopOtherVideos(
  current
) {

  videos.forEach(
    video => {

      if (
        video !== current
      ) {

        video.pause();

        video.currentTime =
          0;

        video.muted =
          false;

      }

    }
  );

}


/* =================================
   START EXPERIENCE
================================= */

function startExperience(
  video,
  plane
) {


  if (
    experienceActive
  ) {

    return;

  }


  experienceActive =
    true;


  /*
    Hide AR plane.
  */

  plane.setAttribute(
    "visible",
    "false"
  );


  /*
    Put the SAME video directly
    on top of the camera.

    No second video.
  */

  document.body.appendChild(
    video
  );


  /*
    Set actual aspect-ratio size.
  */

  setVideoSize(
    video
  );


  /*
    Style video.
  */

  video.style.position =
    "fixed";


  video.style.left =
    "50%";


  video.style.top =
    "50%";


  video.style.transform =
    "translate(-50%, -50%) scale(0.18)";


  video.style.objectFit =
    "fill";


  video.style.background =
    "transparent";


  video.style.zIndex =
    "20001";


  video.style.pointerEvents =
    "none";


  video.style.display =
    "block";


  /*
    Show transparent experience.
  */

  experience.style.display =
    "block";


  experience.classList.add(
    "showClose"
  );


  /*
    Force initial render.
  */

  void video.offsetWidth;


  /*
    Start smooth zoom.
  */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          video.style.transform =
            "translate(-50%, -50%) scale(1)";

        }
      );

    }
  );


  /*
    STOP MINDAR.

    From this point the poster
    is irrelevant.
  */

  const arSystem =
    scene.systems[
      "mindar-image-system"
    ];


  arSystem.stop()
    .then(() => {

      console.log(
        "MindAR stopped."
      );

    })
    .catch(
      error => {

        console.log(
          "MindAR stop:",
          error
        );

      }
    );


  status.textContent =
    "✦ ENJOY THE EXPERIENCE ✦";

}


/* =================================
   CLOSE
================================= */

function closeExperience(
  event
) {


  if (event) {

    event.preventDefault();

    event.stopPropagation();

  }


  console.log(
    "CLOSE EXPERIENCE"
  );


  /*
    Stop video.
  */

  if (
    currentVideo
  ) {

    currentVideo.pause();

    currentVideo.currentTime =
      0;


    /*
      Restore video to assets.
    */

    videoAssets.appendChild(
      currentVideo
    );


    currentVideo.style.position =
      "";


    currentVideo.style.left =
      "";


    currentVideo.style.top =
      "";


    currentVideo.style.width =
      "";


    currentVideo.style.height =
      "";


    currentVideo.style.objectFit =
      "";


    currentVideo.style.background =
      "";


    currentVideo.style.zIndex =
      "";


    currentVideo.style.pointerEvents =
      "";


    currentVideo.style.transform =
      "";


    currentVideo.style.display =
      "";

  }


  /*
    Restore AR plane.
  */

  if (
    currentPlane
  ) {

    currentPlane.setAttribute(
      "visible",
      "true"
    );

  }


  /*
    Hide experience.
  */

  experience.classList.remove(
    "showClose"
  );


  experience.classList.remove(
    "zoomed"
  );


  experience.style.display =
    "none";


  /*
    Reset state.
  */

  experienceActive =
    false;


  currentVideo =
    null;


  currentPlane =
    null;


  status.textContent =
    "RESTARTING CAMERA...";


  /*
    Restart MindAR.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    arSystem.start()
      .then(() => {

        status.textContent =
          "POINT CAMERA AT YOUR POSTER";

      })
      .catch(
        error => {

          console.error(
            "AR restart:",
            error
          );

        }
      );

  } catch (error) {

    console.error(
      error
    );

  }

}


/* =================================
   CLOSE BUTTON
================================= */

closeButton.addEventListener(
  "click",
  closeExperience
);


/*
  Extra touch protection for
  Android browsers.
*/

closeButton.addEventListener(
  "touchend",

  event => {

    event.preventDefault();

    event.stopPropagation();

    closeExperience(event);

  },

  {
    passive: false
  }
);


/* =================================
   RESIZE
================================= */

window.addEventListener(
  "resize",

  () => {

    if (
      experienceActive &&
      currentVideo
    ) {

      setVideoSize(
        currentVideo
      );

    }

  }
);


/* =================================
   START AR
================================= */

startButton.addEventListener(
  "click",

  async () => {


    if (
      !targetsReady
    ) {

      return;

    }


    startButton.style.display =
      "none";


    loadingText.style.display =
      "none";


    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    try {

      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {

      console.error(
        "AR start error:",
        error
      );


      startButton.style.display =
        "block";


      startButton.textContent =
        "START AR";


      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* =================================
   LOAD
================================= */

loadContent();

</script>

</body>
</html>
