<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 18px 38px;

      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;

      border: 1px solid #d4af37;
      border-radius: 50px;

      background: #111;
      color: #d4af37;

      box-shadow:
        0 0 20px rgba(212,175,55,0.25);

      cursor: pointer;
    }

    #loadingText {
      position: fixed;
      z-index: 9998;

      top: 60%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: #d4af37;

      font-size: 14px;
      letter-spacing: 2px;

      display: block;
      text-align: center;
    }

    #status {
      position: fixed;
      z-index: 9997;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      color: #d4af37;

      font-size: 12px;
      letter-spacing: 1.5px;

      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

<button id="startButton" disabled>
  LOADING...
</button>

<div id="loadingText">
  LOADING AR EXPERIENCE...
</div>

<div id="status"></div>


<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets id="videoAssets"></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>


<script>

const startButton = document.querySelector("#startButton");
const loadingText = document.querySelector("#loadingText");
const status = document.querySelector("#status");

const scene = document.querySelector("a-scene");
const videoAssets = document.querySelector("#videoAssets");

let videos = [];
let targetsReady = false;


/* ================================
   LOAD CONTENT DATABASE
================================ */

async function loadContent() {

  try {

    loadingText.style.display = "block";
    loadingText.textContent = "LOADING AR EXPERIENCE...";

    const response = await fetch("./content.json");

    if (!response.ok) {
      throw new Error("Could not load content.json");
    }

    const data = await response.json();

    if (!data.posters || data.posters.length === 0) {
      throw new Error("No posters found in content.json");
    }


    /* ================================
       CREATE VIDEOS + TARGETS
    ================================= */

    data.posters.forEach(poster => {

      const videoId = "video_" + poster.id;


      /* CREATE VIDEO */

      const video = document.createElement("video");

      video.id = videoId;

      video.src = "./" + poster.video;

      video.loop = true;

      video.crossOrigin = "anonymous";

      video.playsInline = true;

      video.setAttribute(
        "webkit-playsinline",
        ""
      );

      videoAssets.appendChild(video);

      videos.push(video);


      /* CREATE TARGET */

      const target = document.createElement("a-entity");

      target.setAttribute(
        "mindar-image-target",
        "targetIndex: " + poster.targetIndex
      );


      /* CREATE VIDEO PLANE */

      const videoPlane = document.createElement("a-video");

      videoPlane.setAttribute(
        "src",
        "#" + videoId
      );

      videoPlane.setAttribute(
        "position",
        "0 0 0"
      );

      videoPlane.setAttribute(
        "width",
        "1"
      );

      videoPlane.setAttribute(
        "height",
        "1"
      );

      videoPlane.setAttribute(
        "material",
        "shader: flat"
      );

      /*
        Start at normal poster size.
        We only animate this existing AR video.
      */

      videoPlane.setAttribute(
        "scale",
        "1 1 1"
      );


      target.appendChild(videoPlane);

      scene.appendChild(target);


      /* ================================
         TARGET FOUND
      ================================= */

      target.addEventListener(
        "targetFound",
        async () => {

          console.log(
            "TARGET FOUND:",
            poster.id
          );

          status.textContent =
            "✦ EXPERIENCE ACTIVATED ✦";


          stopOtherVideos(video);


          try {

            /*
              Start the original AR video.
              No second video is created.
            */

            video.currentTime = 0;

            await video.play();


            /*
              Reset scale
            */

            videoPlane.object3D.scale.set(
              1,
              1,
              1
            );


            /*
              Smooth cinematic zoom
            */

            videoPlane.setAttribute(
              "animation__zoom",
              {
                property: "scale",
                from: "1 1 1",
                to: "2.5 2.5 2.5",
                dur: 4500,
                easing: "easeInOutCubic"
              }
            );


          } catch (error) {

            console.log(
              "Video play blocked:",
              poster.id,
              error
            );

          }

        }
      );


      /* ================================
         TARGET LOST
      ================================= */

      target.addEventListener(
        "targetLost",
        () => {

          console.log(
            "TARGET LOST:",
            poster.id
          );

          /*
            Stop the existing AR video.
          */

          video.pause();

          /*
            Reset zoom.
          */

          videoPlane.removeAttribute(
            "animation__zoom"
          );

          videoPlane.object3D.scale.set(
            1,
            1,
            1
          );

          status.textContent = "";

        }
      );

    });


    /* ================================
       READY
    ================================= */

    targetsReady = true;

    loadingText.style.display = "none";

    startButton.disabled = false;

    startButton.textContent =
      "START AR";


    console.log(
      "AR content loaded:",
      data.posters.length,
      "posters"
    );


  } catch (error) {

    console.error(
      "Content database error:",
      error
    );

    loadingText.textContent =
      "FAILED TO LOAD AR";

    startButton.disabled = true;

  }

}


/* ================================
   STOP OTHER VIDEOS
================================ */

function stopOtherVideos(currentVideo) {

  videos.forEach(video => {

    if (video !== currentVideo) {

      video.pause();

      video.currentTime = 0;

    }

  });

}


/* ================================
   START AR
================================ */

startButton.addEventListener(
  "click",
  async () => {

    if (!targetsReady) {
      return;
    }

    startButton.style.display = "none";

    loadingText.style.display = "none";

    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems["mindar-image-system"];


    try {

      await arSystem.start();

      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {

      console.error(
        "AR start error:",
        error
      );

      startButton.style.display =
        "block";

      startButton.textContent =
        "START AR";

      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* ================================
   LOAD CONTENT
================================ */

loadContent();

</script>

</body>
</html>
