<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Peculiar AR - Cinematic Test</title>

  <!-- SAME PRODUCTION LIBRARIES -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* SAME BASIC START BUTTON */
    #startButton {
      position: fixed;
      z-index: 9999;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 18px 35px;

      font-size: 20px;
      font-weight: 700;

      border: none;
      border-radius: 12px;

      background: #fff;
      color: #000;
    }

    #startButton:disabled {
      opacity: 0.55;
    }

    #loadingText {
      position: fixed;
      z-index: 9998;

      top: 60%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: #fff;

      font-size: 16px;

      display: none;

      text-align: center;
      white-space: nowrap;
    }


    /*
      =========================================================
      CINEMATIC REVEAL
      =========================================================

      IMPORTANT:
      This is completely hidden initially.

      Therefore it cannot block the camera preview.
    */

    #cinematicLayer {
      position: fixed;

      inset: 0;

      z-index: 8000;

      display: none;

      align-items: center;
      justify-content: center;

      background: #000;

      overflow: hidden;

      pointer-events: none;
    }


    #cinematicVideo {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 100vw;
      height: 100vh;

      object-fit: contain;

      transform:
        translate(-50%, -50%)
        scale(0.12);

      transform-origin: center center;

      opacity: 0;

      background: #000;

      border-radius: 18px;

      will-change:
        transform,
        opacity;

      backface-visibility: hidden;

      -webkit-backface-visibility: hidden;

      /*
        Slow cinematic movement.
      */
      transition:
        transform 4.2s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.25s ease-out,
        border-radius 3.8s ease;
    }


    /*
      Animation begins ONLY after
      video has successfully started.
    */

    #cinematicLayer.playing #cinematicVideo {
      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(0.12);
    }


    #cinematicLayer.zooming #cinematicVideo {
      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);

      border-radius: 0;
    }


    #testStatus {
      position: fixed;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 7px 13px;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.65);

      color: #fff;

      font-size: 12px;

      pointer-events: none;

      opacity: 0.75;
    }
  </style>
</head>


<body>


  <!-- SAME START BUTTON -->
  <button id="startButton" disabled>
    LOADING...
  </button>


  <div id="loadingText">
    Loading AR content...
  </div>


  <!--
    =========================================================
    CINEMATIC VIDEO LAYER
    =========================================================

    Hidden until targetFound.
  -->

  <div id="cinematicLayer">

    <video
      id="cinematicVideo"

      playsinline
      webkit-playsinline

      preload="auto"

      loop

      controls="false"

      crossorigin="anonymous"
    ></video>

  </div>


  <div id="testStatus">
    Preparing AR...
  </div>


  <!--
    =========================================================
    PRODUCTION AR CORE
    =========================================================
  -->

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"

    color-space="sRGB"

    renderer="colorManagement: true"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <a-assets id="videoAssets"></a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

  </a-scene>


  <script>

    /*
      =========================================================
      VARIABLES
      =========================================================
    */

    const startButton =
      document.querySelector("#startButton");

    const loadingText =
      document.querySelector("#loadingText");

    const scene =
      document.querySelector("a-scene");

    const videoAssets =
      document.querySelector("#videoAssets");

    const cinematicLayer =
      document.querySelector("#cinematicLayer");

    const cinematicVideo =
      document.querySelector("#cinematicVideo");

    const testStatus =
      document.querySelector("#testStatus");


    let videos = [];

    let targetsReady = false;

    let cinematicActive = false;


    /*
      =========================================================
      LOAD CONTENT
      =========================================================
    */

    async function loadContent() {

      try {

        loadingText.style.display =
          "block";


        /*
          Cache bust only for content.json.
          Production file itself is untouched.
        */

        const response =
          await fetch(
            "./content.json?v=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Could not load content.json"
          );

        }


        const data =
          await response.json();


        if (
          !data.posters ||
          data.posters.length === 0
        ) {

          throw new Error(
            "No posters found"
          );

        }


        /*
          Create all videos + targets
          exactly like production.
        */

        data.posters.forEach(
          (poster) => {

            const videoId =
              "video_" + poster.id;


            /*
              ORIGINAL VIDEO
            */

            const video =
              document.createElement(
                "video"
              );


            video.id =
              videoId;


            video.src =
              "./" + poster.video;


            video.loop =
              true;


            video.crossOrigin =
              "anonymous";


            video.playsInline =
              true;


            video.setAttribute(
              "webkit-playsinline",
              ""
            );


            video.preload =
              "auto";


            videoAssets.appendChild(
              video
            );


            videos.push(video);


            /*
              ORIGINAL TARGET
            */

            const target =
              document.createElement(
                "a-entity"
              );


            target.setAttribute(
              "mindar-image-target",
              "targetIndex: " +
              poster.targetIndex
            );


            /*
              ORIGINAL AR VIDEO PLANE
            */

            const videoPlane =
              document.createElement(
                "a-video"
              );


            videoPlane.setAttribute(
              "src",
              "#" + videoId
            );


            videoPlane.setAttribute(
              "position",
              "0 0 0"
            );


            videoPlane.setAttribute(
              "width",
              "1"
            );


            videoPlane.setAttribute(
              "height",
              "1"
            );


            videoPlane.setAttribute(
              "material",
              "shader: flat"
            );


            target.appendChild(
              videoPlane
            );


            scene.appendChild(
              target
            );


            /*
              =================================================
              TARGET FOUND
              =================================================
            */

            target.addEventListener(
              "targetFound",
              async () => {

                /*
                  Don't trigger another
                  cinematic reveal while
                  one is already active.
                */

                if (
                  cinematicActive
                ) {

                  return;

                }


                stopOtherVideos(
                  video
                );


                try {

                  video.currentTime =
                    0;


                  /*
                    IMPORTANT:
                    FIRST PLAY THE ORIGINAL
                    PRODUCTION VIDEO.
                  */

                  await video.play();


                  testStatus.textContent =
                    "Video playing...";


                  /*
                    THEN start the cinematic
                    test using the same source.
                  */

                  await startCinematicReveal(
                    video
                  );


                } catch (error) {

                  console.log(
                    "Video play blocked:",
                    poster.id,
                    error
                  );


                  testStatus.textContent =
                    "Video playback error";

                }

              }
            );


            /*
              =================================================
              TARGET LOST
              =================================================
            */

            target.addEventListener(
              "targetLost",
              () => {

                /*
                  IMPORTANT:
                  Once cinematic mode starts,
                  do NOT pause the original
                  video because the poster
                  disappeared.
                */

                if (
                  cinematicActive
                ) {

                  return;

                }


                video.pause();

              }
            );

          }
        );


        targetsReady =
          true;


        loadingText.style.display =
          "none";


        startButton.disabled =
          false;


        startButton.textContent =
          "START AR";


        testStatus.textContent =
          "AR Ready";


        console.log(
          "AR content loaded:",
          data.posters.length,
          "posters"
        );


      } catch (error) {

        console.error(
          "Content database error:",
          error
        );


        loadingText.textContent =
          "Failed to load AR content.";


        startButton.disabled =
          true;

      }

    }


    /*
      =========================================================
      STOP OTHER VIDEOS
      =========================================================
    */

    function stopOtherVideos(
      currentVideo
    ) {

      videos.forEach(
        (video) => {

          if (
            video !== currentVideo
          ) {

            video.pause();

            video.currentTime =
              0;

          }

        }
      );

    }


    /*
      =========================================================
      WAIT UNTIL VIDEO HAS DATA
      =========================================================
    */

    function waitForVideoData(
      video
    ) {

      return new Promise(
        (resolve) => {

          if (
            video.readyState >= 2
          ) {

            resolve();

            return;

          }


          let finished =
            false;


          function finish() {

            if (
              finished
            ) {

              return;

            }


            finished =
              true;


            video.removeEventListener(
              "loadeddata",
              finish
            );


            video.removeEventListener(
              "canplay",
              finish
            );


            resolve();

          }


          video.addEventListener(
            "loadeddata",
            finish
          );


          video.addEventListener(
            "canplay",
            finish
          );


          setTimeout(
            finish,
            3000
          );

        }
      );

    }


    /*
      =========================================================
      WAIT FOR REAL VIDEO FRAME
      =========================================================
    */

    function waitForVideoFrame(
      video
    ) {

      return new Promise(
        (resolve) => {

          let finished =
            false;


          function finish() {

            if (
              finished
            ) {

              return;

            }


            finished =
              true;


            resolve();

          }


          if (
            "requestVideoFrameCallback"
            in video
          ) {

            video.requestVideoFrameCallback(
              () => finish()
            );

          } else {

            requestAnimationFrame(
              () => {

                requestAnimationFrame(
                  () => finish()
                );

              }
            );

          }


          setTimeout(
            finish,
            1500
          );

        }
      );

    }


    /*
      =========================================================
      CINEMATIC REVEAL
      =========================================================
    */

    async function startCinematicReveal(
      sourceVideo
    ) {

      if (
        cinematicActive
      ) {

        return;

      }


      cinematicActive =
        true;


      testStatus.textContent =
        "Preparing cinematic reveal...";


      /*
        Use the EXACT same video source.
      */

      const source =
        sourceVideo.currentSrc ||
        sourceVideo.src;


      /*
        Reset cinematic video.
      */

      cinematicVideo.pause();


      cinematicVideo.removeAttribute(
        "src"
      );


      cinematicVideo.load();


      cinematicVideo.src =
        source;


      cinematicVideo.loop =
        true;


      cinematicVideo.playsInline =
        true;


      cinematicVideo.setAttribute(
        "playsinline",
        ""
      );


      cinematicVideo.setAttribute(
        "webkit-playsinline",
        ""
      );


      /*
        Start from the same beginning.
      */

      cinematicVideo.currentTime =
        0;


      /*
        Make layer visible,
        but video itself remains
        transparent/small.
      */

      cinematicLayer.style.display =
        "flex";


      cinematicLayer.classList.remove(
        "playing"
      );


      cinematicLayer.classList.remove(
        "zooming"
      );


      cinematicVideo.style.opacity =
        "0";


      /*
        Force layout.
      */

      void cinematicVideo.offsetWidth;


      /*
        Wait for video data.
      */

      await waitForVideoData(
        cinematicVideo
      );


      /*
        Start the cinematic video.
      */

      try {

        await cinematicVideo.play();

      } catch (error) {

        console.warn(
          "Cinematic video play failed:",
          error
        );

        /*
          If the second video cannot
          start, keep the original
          AR video playing instead.
        */

        cinematicActive =
          false;

        cinematicLayer.style.display =
          "none";

        testStatus.textContent =
          "Original video playing";

        return;

      }


      /*
        Wait for actual decoded frame.
      */

      await waitForVideoFrame(
        cinematicVideo
      );


      /*
        Show first frame.
      */

      cinematicLayer.classList.add(
        "playing"
      );


      /*
        Give browser time to render
        that playing frame.
      */

      await new Promise(
        resolve =>
          requestAnimationFrame(
            () =>
              requestAnimationFrame(
                resolve
              )
          )
      );


      testStatus.textContent =
        "Cinematic zoom...";


      /*
        START SLOW ZOOM
      */

      cinematicLayer.classList.add(
        "zooming"
      );


      /*
        After 4.2 seconds the video
        should have reached full screen.
      */

      setTimeout(
        () => {

          testStatus.textContent =
            "Full screen — video playing";

        },
        4300
      );

    }


    /*
      =========================================================
      START AR
      =========================================================
    */

    startButton.addEventListener(
      "click",
      async () => {

        if (
          !targetsReady
        ) {

          return;

        }


        startButton.style.display =
          "none";


        const arSystem =
          scene.systems[
            "mindar-image-system"
          ];


        try {

          await arSystem.start();


          testStatus.textContent =
            "Point camera at poster";


        } catch (error) {

          console.error(
            "AR start error:",
            error
          );


          startButton.style.display =
            "block";


          startButton.textContent =
            "START AR";

        }

      }
    );


    /*
      =========================================================
      LOAD
      =========================================================
    */

    loadContent();

  </script>

</body>
</html>
