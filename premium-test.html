<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }


    /* ================================
       START BUTTON
    ================================= */

    #startButton {

      position: fixed;

      z-index: 9999;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      padding: 18px 38px;

      font-size: 18px;
      font-weight: 600;

      letter-spacing: 2px;

      border: 1px solid #d4af37;

      border-radius: 50px;

      background: #111;

      color: #d4af37;

      cursor: pointer;
    }


    /* ================================
       LOADING
    ================================= */

    #loadingText {

      position: fixed;

      z-index: 9998;

      top: 60%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      color: #d4af37;

      font-size: 14px;

      letter-spacing: 2px;

      text-align: center;
    }


    /* ================================
       STATUS
    ================================= */

    #status {

      position: fixed;

      z-index: 9997;

      bottom: 25px;
      left: 50%;

      transform:
        translateX(-50%);

      color: #d4af37;

      font-size: 12px;

      letter-spacing: 1.5px;

      text-align: center;

      pointer-events: none;
    }


    /* ================================
       VIDEO EXPERIENCE
    ================================= */

    #experience {

      position: fixed;

      inset: 0;

      z-index: 10000;

      display: none;

      background: transparent;

      pointer-events: none;

      overflow: hidden;
    }


    /*
      Only the video itself is visible.
      Camera remains visible around it
      during the cinematic phase.
    */

    #experienceVideo {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 1px;

      object-fit: contain;

      transform:
        translate(-50%, -50%)
        scale(1);

      background: transparent;

      z-index: 10001;

      pointer-events: none;

      transition:
        width 4.5s
        cubic-bezier(0.22, 1, 0.36, 1),

        height 4.5s
        cubic-bezier(0.22, 1, 0.36, 1);
    }


    /* ================================
       CLOSE BUTTON
    ================================= */

    #closeButton {

      position: fixed;

      z-index: 10010;

      top: 14px;
      right: 14px;

      width: 32px;
      height: 32px;

      padding: 0;

      border-radius: 50%;

      border: 1px solid
        rgba(212,175,55,0.9);

      background:
        rgba(0,0,0,0.75);

      color: #d4af37;

      font-size: 18px;

      font-weight: 300;

      line-height: 29px;

      text-align: center;

      display: none;

      pointer-events: auto;

      touch-action: manipulation;

      -webkit-tap-highlight-color:
        transparent;

      cursor: pointer;
    }


    #experience.showClose #closeButton {

      display: block;
    }

  </style>

</head>


<body>


<button
  id="startButton"
  disabled>

  LOADING...

</button>


<div id="loadingText">

  LOADING AR EXPERIENCE...

</div>


<div id="status"></div>


<!-- =================================
     VIDEO EXPERIENCE
================================= -->

<div id="experience">

  <button
    id="closeButton"
    type="button">

    ×

  </button>

</div>


<!-- =================================
     PRODUCTION AR CORE
================================= -->

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets id="videoAssets"></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>


<script>


/* =================================
   ELEMENTS
================================= */

const startButton =
  document.querySelector(
    "#startButton"
  );

const loadingText =
  document.querySelector(
    "#loadingText"
  );

const status =
  document.querySelector(
    "#status"
  );

const scene =
  document.querySelector(
    "a-scene"
  );

const videoAssets =
  document.querySelector(
    "#videoAssets"
  );

const experience =
  document.querySelector(
    "#experience"
  );

const closeButton =
  document.querySelector(
    "#closeButton"
  );


/* =================================
   STATE
================================= */

let videos = [];

let targetsReady = false;

let experienceActive = false;

let currentVideo = null;

let currentPlane = null;


/* =================================
   VIDEO SIZE
================================= */

function fitVideoToScreen(video) {

  const vw =
    window.innerWidth;

  const vh =
    window.innerHeight;


  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  if (
    !videoWidth ||
    !videoHeight
  ) {

    video.style.width =
      vw + "px";

    video.style.height =
      vh + "px";

    return;

  }


  const ratio =
    videoWidth /
    videoHeight;


  if (
    vw / vh > ratio
  ) {

    video.style.height =
      vh + "px";

    video.style.width =
      (vh * ratio) + "px";

  } else {

    video.style.width =
      vw + "px";

    video.style.height =
      (vw / ratio) + "px";

  }

}


/* =================================
   LOAD CONTENT
================================= */

async function loadContent() {

  try {

    loadingText.style.display =
      "block";


    loadingText.textContent =
      "LOADING AR EXPERIENCE...";


    const response =
      await fetch(
        "./content.json"
      );


    if (!response.ok) {

      throw new Error(
        "Could not load content.json"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters found"
      );

    }


    /* ================================
       CREATE CONTENT
    ================================= */

    data.posters.forEach(
      poster => {


        const videoId =
          "video_" + poster.id;


        /* ================================
           VIDEO
        ================================= */

        const video =
          document.createElement(
            "video"
          );


        video.id =
          videoId;


        video.src =
          "./" + poster.video;


        video.loop =
          true;


        video.crossOrigin =
          "anonymous";


        video.playsInline =
          true;


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        /*
          Keep browser ready for playback.
        */

        video.preload =
          "auto";


        videoAssets.appendChild(
          video
        );


        videos.push(
          video
        );


        /* ================================
           TARGET
        ================================= */

        const target =
          document.createElement(
            "a-entity"
          );


        target.setAttribute(
          "mindar-image-target",

          "targetIndex: " +
          poster.targetIndex
        );


        /* ================================
           AR VIDEO PLANE
        ================================= */

        const videoPlane =
          document.createElement(
            "a-video"
          );


        videoPlane.setAttribute(
          "src",
          "#" + videoId
        );


        videoPlane.setAttribute(
          "position",
          "0 0 0"
        );


        videoPlane.setAttribute(
          "width",
          "1"
        );


        videoPlane.setAttribute(
          "height",
          "1"
        );


        videoPlane.setAttribute(
          "material",
          "shader: flat"
        );


        target.appendChild(
          videoPlane
        );


        scene.appendChild(
          target
        );


        /* ================================
           TARGET FOUND
        ================================= */

        target.addEventListener(
          "targetFound",

          async () => {


            /*
              Ignore new targets while
              fullscreen experience runs.
            */

            if (
              experienceActive
            ) {

              return;

            }


            console.log(
              "TARGET FOUND:",
              poster.id
            );


            stopOtherVideos(
              video
            );


            currentVideo =
              video;

            currentPlane =
              videoPlane;


            try {


              /*
                Start the SAME video
                immediately.
              */

              video.currentTime =
                0;

              video.muted =
                false;


              await video.play();


              /*
                Start cinematic experience.
              */

              startExperience(
                video,
                videoPlane
              );


            } catch (error) {

              console.error(
                "Video play error:",
                error
              );

            }

          }
        );


        /* ================================
           TARGET LOST
        ================================= */

        target.addEventListener(
          "targetLost",

          () => {


            /*
              Once experience starts,
              poster tracking has no
              control over the video.
            */

            if (
              experienceActive
            ) {

              return;

            }


            video.pause();

          }
        );

      }
    );


    targetsReady =
      true;


    loadingText.style.display =
      "none";


    startButton.disabled =
      false;


    startButton.textContent =
      "START AR";


  } catch (error) {

    console.error(
      "Content error:",
      error
    );


    loadingText.textContent =
      "FAILED TO LOAD AR";


    startButton.disabled =
      true;

  }

}


/* =================================
   STOP OTHER VIDEOS
================================= */

function stopOtherVideos(
  currentVideo
) {

  videos.forEach(
    video => {

      if (
        video !== currentVideo
      ) {

        video.pause();

        video.currentTime =
          0;

      }

    }
  );

}


/* =================================
   START EXPERIENCE
================================= */

async function startExperience(
  video,
  videoPlane
) {


  if (
    experienceActive
  ) {

    return;

  }


  /*
    LOCK IMMEDIATELY.

    Poster movement/loss cannot
    cancel this experience.
  */

  experienceActive =
    true;


  /*
    Hide the AR plane.
  */

  videoPlane.setAttribute(
    "visible",
    "false"
  );


  /*
    Wait for actual dimensions.
  */

  if (
    video.readyState < 1
  ) {

    await new Promise(
      resolve => {

        video.addEventListener(
          "loadedmetadata",
          resolve,
          {
            once: true
          }
        );

      }
    );

  }


  /*
    Move SAME video element
    out of A-Frame assets.

    No second video.
  */

  experience.appendChild(
    video
  );


  /*
    Make it visible.
  */

  video.style.display =
    "block";


  video.style.position =
    "fixed";


  video.style.left =
    "50%";


  video.style.top =
    "50%";


  video.style.zIndex =
    "10001";


  video.style.pointerEvents =
    "none";


  video.style.objectFit =
    "contain";


  video.style.background =
    "transparent";


  /*
    Calculate actual video dimensions.
  */

  fitVideoToScreen(
    video
  );


  /*
    Start from small.
  */

  const finalWidth =
    video.style.width;

  const finalHeight =
    video.style.height;


  video.style.width =
    "20px";

  video.style.height =
    "20px";


  video.style.transform =
    "translate(-50%, -50%)";


  /*
    Force browser layout.
  */

  void video.offsetWidth;


  /*
    Show experience layer.
  */

  experience.style.display =
    "block";


  experience.classList.add(
    "showClose"
  );


  /*
    Cinematic zoom.
  */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          video.style.width =
            finalWidth;

          video.style.height =
            finalHeight;

        }
      );

    }
  );


  /*
    IMPORTANT:

    Stop MindAR AFTER the video
    has already started.

    The video itself continues.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    await arSystem.stop();


    console.log(
      "MindAR stopped after hand-off."
    );


  } catch (error) {

    console.log(
      "MindAR stop:",
      error
    );

  }


  status.textContent =
    "✦ ENJOY THE EXPERIENCE ✦";

}


/* =================================
   CLOSE EXPERIENCE
================================= */

async function closeExperience(
  event
) {


  if (event) {

    event.preventDefault();

    event.stopPropagation();

  }


  /*
    Stop current video.
  */

  if (
    currentVideo
  ) {

    currentVideo.pause();

    currentVideo.currentTime =
      0;


    /*
      Return SAME video element
      to A-Frame assets.
    */

    videoAssets.appendChild(
      currentVideo
    );


    /*
      Clear fullscreen styles.
    */

    currentVideo.style.display =
      "";

    currentVideo.style.position =
      "";

    currentVideo.style.left =
      "";

    currentVideo.style.top =
      "";

    currentVideo.style.width =
      "";

    currentVideo.style.height =
      "";

    currentVideo.style.zIndex =
      "";

    currentVideo.style.pointerEvents =
      "";

    currentVideo.style.objectFit =
      "";

    currentVideo.style.background =
      "";

  }


  /*
    Restore AR plane.
  */

  if (
    currentPlane
  ) {

    currentPlane.setAttribute(
      "visible",
      "true"
    );

  }


  /*
    Hide experience.
  */

  experience.classList.remove(
    "showClose"
  );


  experience.style.display =
    "none";


  /*
    Reset state.
  */

  experienceActive =
    false;

  currentVideo =
    null;

  currentPlane =
    null;


  status.textContent =
    "RESTARTING CAMERA...";


  /*
    Restart MindAR.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    await arSystem.start();


    status.textContent =
      "POINT CAMERA AT YOUR POSTER";


  } catch (error) {

    console.error(
      "AR restart error:",
      error
    );


    status.textContent =
      "POINT CAMERA AT YOUR POSTER";

  }

}


/* =================================
   CLOSE BUTTON
================================= */

closeButton.addEventListener(
  "click",
  closeExperience
);


closeButton.addEventListener(
  "touchend",

  event => {

    event.preventDefault();

    event.stopPropagation();

    closeExperience(event);

  },

  {
    passive: false
  }
);


/* =================================
   RESIZE
================================= */

window.addEventListener(
  "resize",

  () => {

    if (
      experienceActive &&
      currentVideo
    ) {

      fitVideoToScreen(
        currentVideo
      );

    }

  }
);


/* =================================
   START AR
================================= */

startButton.addEventListener(
  "click",

  async () => {


    if (
      !targetsReady
    ) {

      return;

    }


    startButton.style.display =
      "none";


    loadingText.style.display =
      "none";


    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    try {

      await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


    } catch (error) {

      console.error(
        "AR start error:",
        error
      );


      startButton.style.display =
        "block";


      startButton.textContent =
        "START AR";


      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* =================================
   LOAD
================================= */

loadContent();

</script>

</body>
</html>
