<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Peculiar AR - Simple Animation Test</title>

  <!-- SAME PRODUCTION LIBRARIES -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #startButton {
      position: fixed;
      z-index: 9999;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 18px 35px;

      font-size: 20px;

      border: none;
      border-radius: 12px;

      background: #fff;
      color: #000;
    }

    #loadingText {
      position: fixed;

      z-index: 9998;

      top: 60%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: white;

      font-size: 16px;

      display: none;
    }

    #status {
      position: fixed;

      z-index: 9999;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      color: white;

      background: rgba(0,0,0,0.65);

      padding: 8px 14px;

      border-radius: 20px;

      font-family: Arial, sans-serif;

      font-size: 12px;

      pointer-events: none;
    }
  </style>
</head>


<body>

  <!-- SAME START BUTTON -->
  <button id="startButton" disabled>
    LOADING...
  </button>

  <div id="loadingText">
    Loading AR content...
  </div>

  <div id="status">
    Preparing AR...
  </div>


  <!--
    =====================================================
    SAME PRODUCTION AR STRUCTURE
    =====================================================
  -->

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"

    color-space="sRGB"

    renderer="colorManagement: true"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <a-assets id="videoAssets"></a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

  </a-scene>


  <script>

    const startButton =
      document.querySelector("#startButton");

    const loadingText =
      document.querySelector("#loadingText");

    const scene =
      document.querySelector("a-scene");

    const videoAssets =
      document.querySelector("#videoAssets");

    const status =
      document.querySelector("#status");


    let videos = [];

    let targetsReady = false;


    /*
      =====================================================
      LOAD CONTENT
      =====================================================
    */

    async function loadContent() {

      try {

        loadingText.style.display =
          "block";


        const response =
          await fetch(
            "./content.json?v=" + Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Could not load content.json"
          );

        }


        const data =
          await response.json();


        if (
          !data.posters ||
          data.posters.length === 0
        ) {

          throw new Error(
            "No posters found"
          );

        }


        /*
          =================================================
          CREATE VIDEOS + TARGETS
          =================================================
        */

        data.posters.forEach(
          (poster) => {

            const videoId =
              "video_" + poster.id;


            /*
              SAME VIDEO CREATION
            */

            const video =
              document.createElement(
                "video"
              );


            video.id =
              videoId;


            video.src =
              "./" + poster.video;


            video.loop =
              true;


            video.crossOrigin =
              "anonymous";


            video.playsInline =
              true;


            video.setAttribute(
              "webkit-playsinline",
              ""
            );


            videoAssets.appendChild(
              video
            );


            videos.push(video);


            /*
              SAME TARGET CREATION
            */

            const target =
              document.createElement(
                "a-entity"
              );


            target.setAttribute(
              "mindar-image-target",
              "targetIndex: " +
              poster.targetIndex
            );


            /*
              SAME A-VIDEO
              KEEP IT INSIDE TARGET
            */

            const videoPlane =
              document.createElement(
                "a-video"
              );


            videoPlane.setAttribute(
              "src",
              "#" + videoId
            );


            videoPlane.setAttribute(
              "position",
              "0 0 0"
            );


            videoPlane.setAttribute(
              "width",
              "1"
            );


            videoPlane.setAttribute(
              "height",
              "1"
            );


            videoPlane.setAttribute(
              "material",
              "shader: flat"
            );


            /*
              IMPORTANT:
              NO OTHER VIDEO.
              NO OVERLAY.
              NO DETACH.
            */


            target.appendChild(
              videoPlane
            );


            scene.appendChild(
              target
            );


            /*
              =================================================
              TARGET FOUND
              =================================================
            */

            target.addEventListener(
              "targetFound",
              async () => {

                stopOtherVideos(
                  video
                );


                try {

                  video.currentTime =
                    0;


                  /*
                    SAME PRODUCTION PLAY
                  */

                  await video.play();


                  status.textContent =
                    "Video playing";


                  /*
                    Wait two browser frames.
                  */

                  requestAnimationFrame(
                    () => {

                      requestAnimationFrame(
                        () => {

                          /*
                            ==================================
                            SIMPLE TEST ANIMATION
                            ==================================

                            Only the existing
                            a-video is scaled.

                            1.0 → 1.5
                            over 3 seconds.
                          */

                          videoPlane.setAttribute(
                            "animation__testzoom",
                            [
                              "property: scale;",
                              "from: 1 1 1;",
                              "to: 1.5 1.5 1.5;",
                              "dur: 3000;",
                              "easing: easeOutCubic;",
                              "startEvents: testZoom"
                            ].join(" ")
                          );


                          videoPlane.emit(
                            "testZoom"
                          );


                          status.textContent =
                            "Simple cinematic zoom test";

                        }
                      );

                    }
                  );


                } catch (error) {

                  console.error(
                    "Video play blocked:",
                    error
                  );


                  status.textContent =
                    "Video playback error";

                }

              }
            );


            /*
              =================================================
              TARGET LOST
              =================================================
            */

            target.addEventListener(
              "targetLost",
              () => {

                /*
                  Keep original production
                  behaviour for this test.
                */

                video.pause();

              }
            );

          }
        );


        /*
          READY
        */

        targetsReady =
          true;


        loadingText.style.display =
          "none";


        startButton.disabled =
          false;


        startButton.textContent =
          "START AR";


        status.textContent =
          "AR Ready";


      } catch (error) {

        console.error(
          error
        );


        loadingText.textContent =
          "Failed to load AR content";


        startButton.disabled =
          true;

      }

    }


    /*
      =====================================================
      STOP OTHER VIDEOS
      =====================================================
    */

    function stopOtherVideos(
      currentVideo
    ) {

      videos.forEach(
        (video) => {

          if (
            video !== currentVideo
          ) {

            video.pause();

            video.currentTime =
              0;

          }

        }
      );

    }


    /*
      =====================================================
      START AR
      =====================================================
    */

    startButton.addEventListener(
      "click",
      async () => {

        if (
          !targetsReady
        ) {

          return;

        }


        startButton.style.display =
          "none";


        const arSystem =
          scene.systems[
            "mindar-image-system"
          ];


        try {

          await arSystem.start();


          status.textContent =
            "Point camera at poster";


        } catch (error) {

          console.error(
            "AR start error:",
            error
          );


          startButton.style.display =
            "block";


          startButton.textContent =
            "START AR";

        }

      }
    );


    /*
      =====================================================
      LOAD
      =====================================================
    */

    loadContent();

  </script>

</body>
</html>
