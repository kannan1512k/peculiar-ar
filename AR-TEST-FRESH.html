<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Peculiar AR – Fresh Test</title>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://assets.mediadelivery.net/playerjs/player-0.1.0.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
a-scene{position:fixed!important;inset:0!important;z-index:1!important}
#startScreen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000}
#startButton{border:1px solid #d7b65a;background:#111;color:#f4d98a;border-radius:999px;padding:16px 30px;font-size:15px;letter-spacing:2px;font-weight:700}
#gold{position:fixed;inset:0;z-index:100;display:none;opacity:0;background:#000;transition:opacity .45s ease;pointer-events:none}
#goldCanvas{position:absolute;inset:0;width:100%;height:100%}
#videoLayer{position:fixed;inset:0;z-index:90;display:none;background:#000}
#bunny{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
#closeButton{position:fixed;right:22px;top:22px;z-index:120;display:none;border:1px solid rgba(255,255,255,.8);background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:46px;height:46px;font-size:24px;line-height:42px;text-align:center}
#status{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;color:#fff;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:20px;font-size:12px;letter-spacing:1px;display:none}
</style>
</head>
<body>
<div id="startScreen"><button id="startButton">START AR TEST</button></div>
<div id="status">SCAN THE POSTER</div>
<div id="gold"><canvas id="goldCanvas"></canvas></div>
<div id="videoLayer">
  <iframe id="bunny" title="Peculiar AR Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen playsinline></iframe>
</div>
<button id="closeButton" aria-label="Close">×</button>

<a-scene color-space="sRGB" device-orientation-permission-ui="enabled:false" mindar-image="imageTargetSrc:./targets.mind;autoStart:false;filterMinCF:0.0001;filterBeta:0.001" renderer="colorManagement:true" vr-mode-ui="enabled:false">
  <a-camera look-controls="enabled:false" position="0 0 0"></a-camera>
  <a-entity mindar-image-target="targetIndex:0"></a-entity>
</a-scene>

<script>
const BUNNY_URL='https://player.mediadelivery.net/embed/768132/f0663203-7b0f-4d0d-871b-8e2b61a16dca';
const startScreen=document.getElementById('startScreen');
const startButton=document.getElementById('startButton');
const status=document.getElementById('status');
const gold=document.getElementById('gold');
const canvas=document.getElementById('goldCanvas');
const ctx=canvas.getContext('2d');
const videoLayer=document.getElementById('videoLayer');
const bunny=document.getElementById('bunny');
const closeButton=document.getElementById('closeButton');
const scene=document.querySelector('a-scene');
const target=document.querySelector('[mindar-image-target]');

let arSystem=null;
let player=null;
let playerReady=false;
let experienceRunning=false;
let particles=[];
let raf=0;
let goldStart=0;
let closeShown=false;

function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();

function makeParticles(){particles=[];const count=Math.min(170,Math.max(80,Math.floor(innerWidth*innerHeight/12000)));for(let i=0;i<count;i++){particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:1+Math.random()*2.6,v:0.25+Math.random()*1.2,d:(Math.random()-.5)*.45,p:Math.random()*Math.PI*2,a:.18+Math.random()*.7})}}
function drawGold(t){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const elapsed=(t-goldStart)/1000;
  const g=ctx.createRadialGradient(innerWidth*.5,innerHeight*.5,0,innerWidth*.5,innerHeight*.5,Math.max(innerWidth,innerHeight)*.75);
  g.addColorStop(0,'rgba(255,221,125,.34)');g.addColorStop(.42,'rgba(122,91,25,.15)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);
  for(const p of particles){p.y+=p.v*2.2;p.x+=p.d+Math.sin(p.p+elapsed*1.5)*.22;if(p.y>innerHeight+20){p.y=-20;p.x=Math.random()*innerWidth}const pulse=.72+.28*Math.sin(p.p+elapsed*4);ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.85+pulse*.3),0,Math.PI*2);ctx.fillStyle=Math.random()>.75?'rgba(255,235,165,'+(p.a*pulse)+')':'rgba(218,180,72,'+(p.a*.82*pulse)+')';ctx.fill()}
  raf=requestAnimationFrame(drawGold);
}
function startGold(){makeParticles();goldStart=performance.now();gold.style.display='block';requestAnimationFrame(()=>gold.style.opacity='1');cancelAnimationFrame(raf);raf=requestAnimationFrame(drawGold)}
function stopGold(){gold.style.opacity='0';cancelAnimationFrame(raf);setTimeout(()=>{gold.style.display='none';ctx.clearRect(0,0,innerWidth,innerHeight)},450)}

function initBunny(){
  if(playerReady)return;
  try{
    player=new playerjs.Player(bunny);
    player.on('ready',()=>{
      playerReady=true;
      try{player.setLoop(false)}catch(e){}
      try{player.setVolume(1)}catch(e){}
      try{player.mute(false)}catch(e){}
      player.on('ended',()=>{
        closeShown=true;
        closeButton.style.display='block';
      });
    });
  }catch(e){console.warn('Bunny init',e)}
}

function preloadBunny(){
  bunny.src=BUNNY_URL+'?autoplay=false&preload=true&muted=false&playsinline=true&rememberPosition=false&rememberSettings=false&showSpeed=false&compactControls=true';
  bunny.addEventListener('load',initBunny,{once:true});
  setTimeout(initBunny,500);
}

async function playVideo(){
  if(!playerReady){initBunny();await new Promise(r=>setTimeout(r,300))}
  videoLayer.style.display='block';
  closeButton.style.display='none';
  closeShown=false;
  try{player.setLoop(false)}catch(e){}
  try{player.setVolume(1)}catch(e){}
  try{player.mute(false)}catch(e){}
  try{await player.play()}catch(e){console.warn('Bunny play',e)}
}

async function startExperience(){
  if(experienceRunning)return;
  experienceRunning=true;
  status.style.display='none';
  startGold();
  // Gold runs first. Video is already loaded in the hidden Bunny iframe.
  setTimeout(async()=>{
    stopGold();
    await playVideo();
  },3000);
}

target.addEventListener('targetFound',startExperience);

target.addEventListener('targetLost',()=>{if(!experienceRunning)status.style.display='block'});

closeButton.addEventListener('click',async()=>{
  if(!closeShown)return;
  try{player.pause()}catch(e){}
  videoLayer.style.display='none';
  closeButton.style.display='none';
  closeShown=false;
  experienceRunning=false;
  status.style.display='block';
  try{await arSystem.stop()}catch(e){}
  setTimeout(async()=>{try{await arSystem.start()}catch(e){}},150);
});

startButton.addEventListener('click',async()=>{
  startScreen.style.display='none';
  status.style.display='block';
  preloadBunny();
  await scene.systems['mindar-image-system'].start();
  arSystem=scene.systems['mindar-image-system'];
});
</script>
</body>
</html>
