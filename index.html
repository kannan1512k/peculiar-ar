<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #000000;
    }

    #loadingText {
      position: fixed;
      z-index: 9998;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 16px;
      display: none;
    }
  </style>
</head>

<body>

<button id="startButton" disabled>LOADING...</button>

<div id="loadingText">
  Loading AR content...
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets id="videoAssets"></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>


<script>

const startButton = document.querySelector("#startButton");
const loadingText = document.querySelector("#loadingText");
const scene = document.querySelector("a-scene");
const videoAssets = document.querySelector("#videoAssets");

let videos = [];
let targetsReady = false;


/* LOAD CONTENT DATABASE */

async function loadContent() {

  try {

    loadingText.style.display = "block";

    const response = await fetch("./content.json");

    if (!response.ok) {
      throw new Error("Could not load content.json");
    }

    const data = await response.json();

    if (!data.posters || data.posters.length === 0) {
      throw new Error("No posters found in content.json");
    }


    /* CREATE ALL VIDEOS + TARGETS */

    data.posters.forEach(poster => {

      const videoId = "video_" + poster.id;

      /* CREATE VIDEO */

      const video = document.createElement("video");

      video.id = videoId;
      video.src = "./" + poster.video;
      video.loop = true;
      video.crossOrigin = "anonymous";
      video.playsInline = true;
      video.setAttribute("webkit-playsinline", "");

      videoAssets.appendChild(video);

      videos.push(video);


      /* CREATE TARGET */

      const target = document.createElement("a-entity");

      target.setAttribute(
        "mindar-image-target",
        "targetIndex: " + poster.targetIndex
      );


      /* CREATE VIDEO PLANE */

      const videoPlane = document.createElement("a-video");

      videoPlane.setAttribute("src", "#" + videoId);
      videoPlane.setAttribute("position", "0 0 0");
      videoPlane.setAttribute("width", "1");
      videoPlane.setAttribute("height", "1");
      videoPlane.setAttribute(
        "material",
        "shader: flat"
      );


      target.appendChild(videoPlane);

      scene.appendChild(target);


      /* TARGET FOUND */

      target.addEventListener("targetFound", async () => {

        stopOtherVideos(video);

        try {

          video.currentTime = 0;

          await video.play();

        } catch (error) {

          console.log(
            "Video play blocked:",
            poster.id,
            error
          );

        }

      });


      /* TARGET LOST */

      target.addEventListener("targetLost", () => {

        video.pause();

      });

    });


    targetsReady = true;

    loadingText.style.display = "none";

    startButton.disabled = false;
    startButton.textContent = "START AR";


    console.log(
      "AR content loaded:",
      data.posters.length,
      "posters"
    );

  } catch (error) {

    console.error(
      "Content database error:",
      error
    );

    loadingText.textContent =
      "Failed to load AR content.";

    startButton.disabled = true;

  }

}


/* STOP ALL OTHER VIDEOS */

function stopOtherVideos(currentVideo) {

  videos.forEach(video => {

    if (video !== currentVideo) {

      video.pause();
      video.currentTime = 0;

    }

  });

}


/* START AR */

startButton.addEventListener("click", async () => {

  if (!targetsReady) {
    return;
  }

  startButton.style.display = "none";

  const arSystem =
    scene.systems["mindar-image-system"];

  try {

    await arSystem.start();

  } catch (error) {

    console.error(
      "AR start error:",
      error
    );

    startButton.style.display = "block";
    startButton.textContent = "START AR";

  }

});


/* LOAD CONTENT */

loadContent();

</script>

</body>
</html>
