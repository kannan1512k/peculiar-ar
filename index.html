<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Peculiar AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* START BUTTON */

    #startButton {
      position: fixed;
      z-index: 9999;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 18px 36px;

      border: none;
      border-radius: 14px;

      background: white;
      color: black;

      font-size: 20px;
      font-weight: bold;
    }


    /* FULL SCREEN VIDEO */

    #fullscreenVideo {

      display: none;

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      background: black;

      z-index: 10000;

    }


    /* Hide A-Frame VR button */

    .a-enter-vr {
      display: none !important;
    }

  </style>

</head>


<body>


  <!-- FULL SCREEN VIDEO -->

  <video
    id="fullscreenVideo"
    src="./Vijay1.mp4"
    playsinline
    webkit-playsinline
    preload="auto"
  ></video>


  <!-- START BUTTON -->

  <button id="startButton">
    START AR
  </button>


  <!-- AR SCENE -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "

    color-space="sRGB"

    renderer="colorManagement: true"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- CAMERA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- TARGET -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    ></a-entity>


  </a-scene>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const startButton =
      document.getElementById("startButton");

    const fullscreenVideo =
      document.getElementById("fullscreenVideo");

    const scene =
      document.querySelector("a-scene");

    const target =
      document.getElementById("target");


    /* =========================
       START AR
    ========================= */

    startButton.addEventListener("click", async function () {

      try {

        const arSystem =
          scene.systems["mindar-image-system"];

        /*
          Start camera
        */

        await arSystem.start();


        /*
          Hide START button
        */

        startButton.style.display = "none";


        console.log("AR CAMERA STARTED");

      }

      catch (error) {

        console.error(
          "AR START ERROR:",
          error
        );

        alert(
          "Camera start failed. Please allow camera permission."
        );

      }

    });


    /* =========================
       TARGET FOUND
    ========================= */

    target.addEventListener(
      "targetFound",
      async function () {

        console.log("TARGET FOUND");


        /*
          Show video
        */

        fullscreenVideo.style.display =
          "block";


        /*
          Start from beginning
        */

        fullscreenVideo.currentTime = 0;


        /*
          Sound ON
        */

        fullscreenVideo.muted = false;


        try {

          await fullscreenVideo.play();

          console.log(
            "FULL SCREEN VIDEO PLAYING"
          );

        }

        catch (error) {

          console.error(
            "VIDEO PLAY ERROR:",
            error
          );

        }

      }
    );


    /* =========================
       TARGET LOST
    ========================= */

    target.addEventListener(
      "targetLost",
      function () {

        console.log("TARGET LOST");


        /*
          Pause video
        */

        fullscreenVideo.pause();


        /*
          Hide video
        */

        fullscreenVideo.style.display =
          "none";

      }
    );


    /* =========================
       VIDEO ENDED
    ========================= */

    fullscreenVideo.addEventListener(
      "ended",
      function () {

        console.log("VIDEO ENDED");


        /*
          Hide video
        */

        fullscreenVideo.style.display =
          "none";

      }
    );

  </script>


</body>

</html>
