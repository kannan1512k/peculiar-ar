<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 35px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #000000;
    }
  </style>
</head>

<body>

<button id="startButton">START AR</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <video
      id="video1"
      loop="true"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline>
    </video>

    <video
      id="video2"
      loop="true"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline>
    </video>

    <video
      id="video3"
      loop="true"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline>
    </video>

  </a-assets>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <!-- POSTER 1 -->

  <a-entity
    id="target1"
    mindar-image-target="targetIndex: 0">

    <a-video
      src="#video1"
      position="0 0 0"
      width="1"
      height="1"
      material="shader: flat">
    </a-video>

  </a-entity>


  <!-- POSTER 2 -->

  <a-entity
    id="target2"
    mindar-image-target="targetIndex: 1">

    <a-video
      src="#video2"
      position="0 0 0"
      width="1"
      height="1"
      material="shader: flat">
    </a-video>

  </a-entity>


  <!-- POSTER 3 -->

  <a-entity
    id="target3"
    mindar-image-target="targetIndex: 2">

    <a-video
      src="#video3"
      position="0 0 0"
      width="1"
      height="1"
      material="shader: flat">
    </a-video>

  </a-entity>

</a-scene>


<script>

const startButton = document.querySelector("#startButton");
const scene = document.querySelector("a-scene");

const video1 = document.querySelector("#video1");
const video2 = document.querySelector("#video2");
const video3 = document.querySelector("#video3");

const target1 = document.querySelector("#target1");
const target2 = document.querySelector("#target2");
const target3 = document.querySelector("#target3");


/* LOAD CONTENT DATABASE */

fetch("./content.json")
  .then(response => response.json())
  .then(data => {

    data.posters.forEach(poster => {

      if (poster.targetIndex === 0) {
        video1.src = "./" + poster.video;
      }

      if (poster.targetIndex === 1) {
        video2.src = "./" + poster.video;
      }

      if (poster.targetIndex === 2) {
        video3.src = "./" + poster.video;
      }

    });

    video1.load();
    video2.load();
    video3.load();

  })
  .catch(error => {

    console.log("Content database error:", error);

  });


/* START AR */

startButton.addEventListener("click", async () => {

  startButton.style.display = "none";

  const arSystem = scene.systems["mindar-image-system"];

  await arSystem.start();

});


/* STOP OTHER VIDEOS */

function stopOtherVideos(currentVideo) {

  const videos = [video1, video2, video3];

  videos.forEach(video => {

    if (video !== currentVideo) {

      video.pause();
      video.currentTime = 0;

    }

  });

}


/* POSTER 1 */

target1.addEventListener("targetFound", async () => {

  stopOtherVideos(video1);

  try {

    video1.currentTime = 0;

    await video1.play();

  } catch (error) {

    console.log("Video 1 play blocked:", error);

  }

});


target1.addEventListener("targetLost", () => {

  video1.pause();

});


/* POSTER 2 */

target2.addEventListener("targetFound", async () => {

  stopOtherVideos(video2);

  try {

    video2.currentTime = 0;

    await video2.play();

  } catch (error) {

    console.log("Video 2 play blocked:", error);

  }

});


target2.addEventListener("targetLost", () => {

  video2.pause();

});


/* POSTER 3 */

target3.addEventListener("targetFound", async () => {

  stopOtherVideos(video3);

  try {

    video3.currentTime = 0;

    await video3.play();

  } catch (error) {

    console.log("Video 3 play blocked:", error);

  }

});


target3.addEventListener("targetLost", () => {

  video3.pause();

});

</script>

</body>
</html>
