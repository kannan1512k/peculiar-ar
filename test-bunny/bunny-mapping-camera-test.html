<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Peculiar AR - Bunny Camera Test</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
  a-scene{position:fixed;inset:0}
  #ui{position:fixed;inset:0;z-index:20;pointer-events:none}
  #title{position:absolute;top:22px;left:0;right:0;text-align:center;color:#fff;font-size:14px;letter-spacing:3px;text-shadow:0 2px 8px #000}
  #hint{position:absolute;bottom:38px;left:0;right:0;text-align:center;color:#fff;font-size:14px;letter-spacing:1px;text-shadow:0 2px 8px #000}
  #scanner{position:absolute;left:50%;top:50%;width:68vw;height:48vw;max-width:360px;max-height:260px;transform:translate(-50%,-50%);border:1px solid rgba(255,215,90,.8);box-shadow:0 0 28px rgba(255,200,40,.28),inset 0 0 25px rgba(255,200,40,.08)}
  #scanner:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,215,90,.8);box-shadow:0 0 12px rgba(255,215,90,1);animation:scan 2s linear infinite}
  @keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(120px)}}
  .corner{position:absolute;width:28px;height:28px;border-color:#ffd95a;border-style:solid}
  .tl{left:-1px;top:-1px;border-width:2px 0 0 2px}.tr{right:-1px;top:-1px;border-width:2px 2px 0 0}
  .bl{left:-1px;bottom:-1px;border-width:0 0 2px 2px}.br{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
  #experience{display:none;position:fixed;inset:0;background:#000;z-index:30;align-items:center;justify-content:center}
  #experience video{width:100%;height:100%;object-fit:contain}
  #close{display:none;position:absolute;right:18px;top:18px;z-index:40;width:44px;height:44px;border:1px solid rgba(255,215,90,.8);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:25px}
  #status{position:absolute;top:55px;left:0;right:0;text-align:center;color:#ffd95a;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<div id="ui">
  <div id="title">PECULIAR AR • CAMERA TEST</div>
  <div id="scanner">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  </div>
  <div id="hint">PUT YOUR POSTER IN FRONT OF THE CAMERA</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets-test.mind; autoStart: true; uiScanning: no; uiLoading: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets id="assets"></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="targets"></a-entity>
</a-scene>

<div id="experience">
  <button id="close">×</button>
  <div id="status">LOADING</div>
</div>

<script>
const mappingUrl = './mapping-test.json';
let mapping = [];
let videos = {};
let activeVideo = null;
let activeTarget = null;
let started = false;

async function loadMapping(){
  const r = await fetch(mappingUrl + '?v=' + Date.now());
  const data = await r.json();
  mapping = data.posters || [];

  const assets = document.getElementById('assets');
  const targets = document.getElementById('targets');

  mapping.forEach(p => {
    const v = document.createElement('video');
    v.id = 'video_' + p.id;
    v.crossOrigin = 'anonymous';
    v.setAttribute('playsinline','');
    v.setAttribute('webkit-playsinline','');
    v.preload = 'metadata';
    v.muted = true;
    v.src = `https://vz-c32bf749-1b8.b-cdn.net/${p.videoId}/playlist.m3u8`;
    assets.appendChild(v);
    videos[p.id] = v;

    const entity = document.createElement('a-entity');
    entity.setAttribute('mindar-image-target', `targetIndex: ${p.targetIndex}`);
    const plane = document.createElement('a-plane');
    plane.setAttribute('position','0 0 0');
    plane.setAttribute('width','1');
    plane.setAttribute('height','0.5625');
    plane.setAttribute('material',`shader: flat; src: #${v.id};`);
    entity.appendChild(plane);
    targets.appendChild(entity);

    entity.addEventListener('targetFound', () => activate(p, v));
    entity.addEventListener('targetLost', () => {
      if (!started && activeVideo === v) {
        try { v.pause(); } catch(e){}
      }
    });
  });
}

async function activate(p, video){
  if(started) return;
  if(activeVideo && activeVideo !== video) {
    try{activeVideo.pause();}catch(e){}
  }
  activeVideo = video;
  activeTarget = p;
  document.getElementById('hint').textContent = 'TARGET FOUND • STARTING EXPERIENCE';
  document.getElementById('status').textContent = 'BUNNY STREAM';
  try {
    video.muted = true;
    await video.play();
  } catch(e) {
    console.log('Bunny playback waiting:', e);
  }
  await new Promise(r=>setTimeout(r,500));
  startExperience(video);
}

function startExperience(video){
  if(started) return;
  started = true;
  const exp = document.getElementById('experience');
  exp.style.display='flex';
  document.getElementById('close').style.display='block';
  document.getElementById('hint').style.display='none';
  document.getElementById('scanner').style.display='none';
  document.getElementById('title').style.display='none';

  // Move the same video element into the fullscreen experience.
  exp.appendChild(video);
  video.muted = false;
  video.controls = false;
  video.style.display='block';
  video.style.width='100%';
  video.style.height='100%';
  video.style.objectFit='contain';
  video.currentTime = 0;
  video.play().catch(e=>console.log('Playback:',e));

  // Stop AR after target is found so the camera is no longer needed.
  const scene = document.querySelector('a-scene');
  if(scene.systems['mindar-image-system']){
    try{scene.systems['mindar-image-system'].stop();}catch(e){}
  }
}

document.getElementById('close').addEventListener('click', ()=>{
  const exp=document.getElementById('experience');
  if(activeVideo){
    try{activeVideo.pause(); activeVideo.currentTime=0;}catch(e){}
    activeVideo.style.cssText='';
    document.getElementById('assets').appendChild(activeVideo);
  }
  exp.style.display='none';
  document.getElementById('close').style.display='none';
  document.getElementById('hint').style.display='block';
  document.getElementById('scanner').style.display='block';
  document.getElementById('title').style.display='block';
  document.getElementById('hint').textContent='PUT YOUR POSTER IN FRONT OF THE CAMERA';
  document.getElementById('status').textContent='READY';
  started=false;
  activeVideo=null;
  activeTarget=null;

  const scene=document.querySelector('a-scene');
  if(scene.systems['mindar-image-system']){
    try{scene.systems['mindar-image-system'].start();}catch(e){}
  }
});

loadMapping().catch(e=>{
  document.getElementById('hint').textContent='MAPPING LOAD ERROR';
  console.error(e);
});
</script>
</body>
</html>
