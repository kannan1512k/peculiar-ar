<!DOCTYPE html>
<html>
<head>
  <!-- Living Print v13 — still poster → full-screen golden dust/rain → cinematic video test -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }


    /* ================================
       START BUTTON
    ================================= */

    #startButton {

      position: fixed;

      z-index: 9999;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      padding: 18px 38px;

      font-size: 18px;
      font-weight: 600;

      letter-spacing: 2px;

      border: 1px solid #d4af37;

      border-radius: 50px;

      background: #111;

      color: #d4af37;

      cursor: pointer;
    }


    /* ================================
       LOADING
    ================================= */

    #loadingText {

      position: fixed;

      z-index: 9998;

      top: 60%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      color: #d4af37;

      font-size: 14px;

      letter-spacing: 2px;

      text-align: center;
    }


    /* ================================
       STATUS
    ================================= */

    #status {

      position: fixed;

      z-index: 9997;

      bottom: 25px;
      left: 50%;

      transform:
        translateX(-50%);

      color: #d4af37;

      font-size: 12px;

      letter-spacing: 1.5px;

      text-align: center;

      pointer-events: none;
    }


    /* ================================
       NATIVE AR UI — HIDDEN
       Custom gold scanner replaces it
    ================================= */

    .a-enter-vr,
    .a-enter-ar,
    .mindar-ui-loading,
    .mindar-ui-scanning,
    .mindar-ui-scanning > div {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* ================================
       MAGICAL SCANNER — TEST ONLY
       PREMIUM GOLD HUD
    ================================= */

    #magicScanner {
      position: fixed;
      inset: 0;
      z-index: 9996;
      display: none;
      pointer-events: none;
      overflow: hidden;
      background: transparent;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    #magicScanner.active {
      display: block;
      opacity: 1;
    }

    #magicVignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center,
          transparent 0%,
          transparent 42%,
          rgba(0,0,0,0.12) 66%,
          rgba(0,0,0,0.68) 100%);
    }

    #magicVignette::before,
    #magicVignette::after {
      content: "";
      position: absolute;
      left: -20%;
      width: 140%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(212,175,55,0.05),
        rgba(255,214,85,0.32),
        rgba(212,175,55,0.05),
        transparent);
      box-shadow: 0 0 18px rgba(212,175,55,0.18);
      opacity: 0.65;
    }

    #magicVignette::before { top: 26%; }
    #magicVignette::after { bottom: 26%; }

    #magicCorners {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78vw, 350px);
      height: min(78vw, 350px);
      transform: translate(-50%, -50%);
      opacity: 1;
    }

    .magicCorner {
      position: absolute;
      width: 58px;
      height: 58px;
      box-sizing: border-box;
      border-color: rgba(255,198,55,0.98) !important;
      filter:
        drop-shadow(0 0 4px rgba(255,198,55,0.95))
        drop-shadow(0 0 13px rgba(255,184,35,0.55));
      animation: cornerGlow 2.4s ease-in-out infinite;
    }

    .magicCorner.tl {
      left: 0; top: 0;
      border-left: 5px solid rgba(255,198,55,0.98) !important;
      border-top: 5px solid rgba(255,198,55,0.98) !important;
      border-radius: 18px 0 0 0;
    }
    .magicCorner.tr {
      right: 0; top: 0;
      border-right: 5px solid rgba(255,198,55,0.98) !important;
      border-top: 5px solid rgba(255,198,55,0.98) !important;
      border-radius: 0 18px 0 0;
    }
    .magicCorner.bl {
      left: 0; bottom: 0;
      border-left: 5px solid rgba(255,198,55,0.98) !important;
      border-bottom: 5px solid rgba(255,198,55,0.98) !important;
      border-radius: 0 0 0 18px;
    }
    .magicCorner.br {
      right: 0; bottom: 0;
      border-right: 5px solid rgba(255,198,55,0.98) !important;
      border-bottom: 5px solid rgba(255,198,55,0.98) !important;
      border-radius: 0 0 18px 0;
    }

    #magicReticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 142px;
      height: 142px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 50%;
      box-shadow:
        0 0 18px rgba(212,175,55,0.18),
        inset 0 0 22px rgba(212,175,55,0.05);
      animation: magicPulse 2.4s ease-in-out infinite;
    }

    #magicReticle::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px dashed rgba(212,175,55,0.45);
      border-radius: 50%;
      animation: reticleSpin 12s linear infinite;
    }

    #magicReticle::after {
      content: "";
      position: absolute;
      inset: 49px;
      border: 1px solid rgba(255,224,130,0.9);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(212,175,55,0.42);
    }

    #magicBeam {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(88vw, 430px);
      height: 2px;
      transform: translate(-50%, -50%);
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(212,175,55,0.12) 12%,
        rgba(255,232,150,0.95) 43%,
        rgba(255,255,220,1) 50%,
        rgba(255,232,150,0.95) 57%,
        rgba(212,175,55,0.12) 88%,
        transparent 100%);
      box-shadow:
        0 0 7px rgba(255,225,110,0.95),
        0 0 22px rgba(212,175,55,0.52);
      animation: magicScan 2.2s ease-in-out infinite;
    }

    #magicBeam::before,
    #magicBeam::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 54px;
      height: 1px;
      background: rgba(255,184,35,0.55);
      transform: translateY(-50%);
      box-shadow: 0 0 8px rgba(212,175,55,0.4);
    }

    #magicBeam::before { left: 20px; }
    #magicBeam::after { right: 20px; }

    #magicLabel {
      position: absolute;
      left: 50%;
      bottom: 11.5%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 88vw;
      color: rgba(242,211,128,0.98);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 3.6px;
      text-align: center;
      text-shadow:
        0 0 7px rgba(212,175,55,0.65),
        0 0 18px rgba(212,175,55,0.28);
      animation: magicLabelPulse 2.2s ease-in-out infinite;
    }

    #magicLabel::before {
      content: "✦";
      margin-right: 10px;
      font-size: 10px;
    }

    #magicLabel::after {
      content: "✦";
      margin-left: 10px;
      font-size: 10px;
    }

    #magicParticles {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .magicParticle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,221,115,0.92);
      box-shadow: 0 0 8px rgba(255,190,35,0.95);
      animation: magicFloat linear infinite;
    }

    @keyframes magicPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(0.94);
        opacity: 0.62;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.04);
        opacity: 1;
      }
    }

    @keyframes reticleSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes magicScan {
      0%, 100% {
        transform: translate(-50%, -50%) scaleX(0.62);
        opacity: 0.42;
      }
      50% {
        transform: translate(-50%, -50%) scaleX(1);
        opacity: 1;
      }
    }

    @keyframes cornerGlow {
      0%, 100% { opacity: 0.68; }
      50% { opacity: 1; }
    }

    @keyframes magicLabelPulse {
      0%, 100% { opacity: 0.62; letter-spacing: 3px; }
      50% { opacity: 1; letter-spacing: 3.8px; }
    }

    @keyframes magicFloat {
      0% { transform: translate3d(0, 20px, 0) scale(0.6); opacity: 0; }
      12% { opacity: 0.8; }
      88% { opacity: 0.35; }
      100% { transform: translate3d(var(--drift), -110vh, 0) scale(1.2); opacity: 0; }
    }


    /* ================================
       VIDEO EXPERIENCE
    ================================= */

    #experience {

      position: fixed;

      inset: 0;

      z-index: 10000;

      display: none;

      background: transparent;

      pointer-events: none;

      overflow: hidden;
    }


    /*
      Only the video itself is visible.
      Camera remains visible around it
      during the cinematic phase.
    */

    #experienceVideo {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 1px;

      object-fit: contain;

      transform:
        translate(-50%, -50%)
        scale(1);

      background: transparent;

      z-index: 10001;

      pointer-events: none;

      transition:
        width 3s
        cubic-bezier(0.22, 1, 0.36, 1),

        height 3s
        cubic-bezier(0.22, 1, 0.36, 1);
    }


    /* ================================
       CLOSE BUTTON
    ================================= */

    #closeButton {

      position: fixed;

      z-index: 10010;

      top: 14px;
      right: 14px;

      width: 32px;
      height: 32px;

      padding: 0;

      border-radius: 50%;

      border: 1px solid
        rgba(212,175,55,0.9);

      background:
        rgba(0,0,0,0.75);

      color: #d4af37;

      font-size: 18px;

      font-weight: 300;

      line-height: 29px;

      text-align: center;

      display: none;

      pointer-events: auto;

      touch-action: manipulation;

      -webkit-tap-highlight-color:
        transparent;

      cursor: pointer;
    }


    #experience.showClose #closeButton {

      display: block;
    }


  


/* LIVING PRINT v13 — STILL POSTER → FULL-SCREEN GOLDEN DUST/RAIN → CINEMATIC VIDEO */
#livingMorph{
  position:fixed;
  inset:0;
  z-index:10002;
  display:none;
  pointer-events:none;
  overflow:hidden;
  background:transparent;
}
#livingMorph.active{display:block}

/* The poster is deliberately static: no blink, no zoom, no shutter. */
#livingPoster{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--morph-w,76vw);
  height:var(--morph-h,42.75vw);
  max-width:92vw;
  max-height:82vh;
  object-fit:cover;
  transform:translate(-50%,-50%);
  opacity:0;
  filter:none;
  border-radius:4px;
  box-shadow:0 0 0 1px rgba(212,175,55,.18),0 10px 45px rgba(0,0,0,.34);
  will-change:opacity;
  z-index:5;
}
#livingMorph.active #livingPoster{opacity:0 !important;animation:none !important;}

/* Full-screen particle field — the main golden transition. */
#goldenDustCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  opacity:0;
  z-index:4;
  pointer-events:none;
  will-change:opacity;
}
#livingMorph.active #goldenDustCanvas{
  animation:goldenDustFade 3.25s ease-out 1.45s forwards;
}

/* Soft light underneath the particles; never a solid yellow flash. */
#livingMorph .livingLight{
  position:absolute;
  inset:0;
  opacity:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 52%,
      rgba(255,231,139,.22) 0%,
      rgba(255,205,71,.10) 18%,
      rgba(212,175,55,.055) 36%,
      transparent 67%);
  filter:blur(10px);
}
#livingMorph .livingLight:before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle at 50% 52%,rgba(255,236,170,.22) 0%,rgba(255,211,91,.13) 22%,rgba(212,175,55,.08) 42%,transparent 70%);filter:blur(16px);opacity:0;}
#livingMorph.active .livingLight:before{animation:goldenPremiumBloom 2.45s ease-out forwards;}
@keyframes goldenPremiumBloom{
  0%{opacity:0;transform:scale(.72);}
  18%{opacity:.88;transform:scale(.92);}
  48%{opacity:.62;transform:scale(1.04);}
  78%{opacity:.30;transform:scale(1.16);}
  100%{opacity:0;transform:scale(1.30);}
}
#livingMorph .livingLight:after{
  content:"";
  position:absolute;
  inset:-12%;
  background:
    radial-gradient(circle at 18% 72%, rgba(255,224,126,.10), transparent 30%),
    radial-gradient(circle at 82% 28%, rgba(255,245,190,.10), transparent 28%),
    radial-gradient(circle at 52% 58%, rgba(255,194,55,.07), transparent 42%);
  filter:blur(26px);
  opacity:0;
}
#livingMorph.active .livingLight:after{
  animation:goldenColorWash 3s ease-out forwards;
}
@keyframes goldenColorWash{
  0%{opacity:0;transform:scale(.82);}
  20%{opacity:.85;transform:scale(.94);}
  52%{opacity:.62;transform:scale(1.04);}
  82%{opacity:.28;transform:scale(1.14);}
  100%{opacity:0;transform:scale(1.24);}
}
#livingMorph.active .livingLight{
  animation:goldenAtmosphere 3.0s ease-out 0s forwards;
}


/* Tiny central glow gives the video a believable emergence point. */
#livingMorph:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:min(72vw,420px);
  height:min(72vw,420px);
  transform:translate(-50%,-50%) scale(.42);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,239,175,.26) 0%,
    rgba(255,210,83,.12) 26%,
    transparent 70%);
  filter:blur(12px);
  opacity:0;
  z-index:3;
}
#livingMorph.active:after{
  animation:goldenCore 2.35s ease-out 1.42s forwards;
}

@keyframes posterStillThenDisappear{0%,100%{opacity:0;}}

@keyframes goldenDustFade{
  0%{opacity:0;}
  10%{opacity:.96;}
  34%{opacity:1;}
  58%{opacity:.92;}
  78%{opacity:.62;}
  100%{opacity:0;}
}

@keyframes goldenAtmosphere{
  0%{opacity:0;transform:scale(.92);}
  22%{opacity:.72;transform:scale(1);}
  55%{opacity:.52;transform:scale(1.08);}
  82%{opacity:.22;transform:scale(1.16);}
  100%{opacity:0;transform:scale(1.24);}
}


@keyframes goldenCore{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.42);}
  28%{opacity:.72;transform:translate(-50%,-50%) scale(.72);}
  60%{opacity:.34;transform:translate(-50%,-50%) scale(1.04);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.35);}
}

</style>

<style>
#goldenReferenceTransition{
  position:fixed;inset:0;z-index:9998;display:none;
  pointer-events:none;overflow:hidden;background:#030201;
  opacity:0;transition:opacity .35s ease;

<script>

/* =================================
   V17 GOLDEN REFERENCE TRANSITION
   Approved visual + MP3 reference
================================= */
const goldenReferenceTransition =
  document.getElementById("goldenReferenceTransition");
const goldenReferenceCanvas =
  document.getElementById("goldenReferenceCanvas");
const goldenReferenceCtx =
  goldenReferenceCanvas.getContext("2d");
const goldenReferenceAudio =
  document.getElementById("goldenReferenceAudio");

goldenReferenceAudio.src = "./transition-reference.mp3";
goldenReferenceAudio.volume = 0.95;

let goldenReferenceRAF = null;
let goldenReferenceParticles = [];
let goldenReferenceStarted = 0;

function resizeGoldenReference() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  goldenReferenceCanvas.width = innerWidth * dpr;
  goldenReferenceCanvas.height = innerHeight * dpr;
  goldenReferenceCanvas.style.width = innerWidth + "px";
  goldenReferenceCanvas.style.height = innerHeight + "px";
  goldenReferenceCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createGoldenReferenceParticles() {
  goldenReferenceParticles = [];
  const count = Math.min(
    700,
    Math.max(420, Math.round(innerWidth * innerHeight / 4000))
  );

  for (let i = 0; i < count; i++) {
    goldenReferenceParticles.push({
      x: Math.random() * innerWidth,
      y: -Math.random() * innerHeight,
      size: 0.45 + Math.random() * 3.4,
      speed: 0.35 + Math.random() * 1.35,
      drift: (Math.random() - 0.5) * 0.8,
      phase: Math.random() * Math.PI * 2,
      alpha: 0.28 + Math.random() * 0.72
    });
  }
}

function animateGoldenReference(now) {
  const elapsed = (now - goldenReferenceStarted) / 1000;
  const ctx = goldenReferenceCtx;

  ctx.clearRect(0, 0, innerWidth, innerHeight);

  const glow = ctx.createRadialGradient(
    innerWidth * 0.5, innerHeight * 0.48, 0,
    innerWidth * 0.5, innerHeight * 0.48,
    Math.max(innerWidth, innerHeight) * 0.86
  );
  glow.addColorStop(0, "rgba(255,225,135,.22)");
  glow.addColorStop(.28, "rgba(235,195,82,.12)");
  glow.addColorStop(.68, "rgba(105,76,18,.07)");
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  ctx.globalCompositeOperation = "lighter";

  for (const p of goldenReferenceParticles) {
    p.y += p.speed * 2.25;
    p.x += p.drift + Math.sin(p.phase + elapsed * 1.7) * 0.28;

    if (p.y > innerHeight + 24) {
      p.y = -24;
      p.x = Math.random() * innerWidth;
    }

    const pulse = 0.72 + 0.28 * Math.sin(p.phase + elapsed * 4.2);
    const r = p.size * (0.82 + pulse * 0.35);

    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle =
      Math.random() > 0.76
        ? `rgba(255,235,165,${p.alpha * pulse})`
        : `rgba(218,180,72,${p.alpha * .82 * pulse})`;
    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";
  goldenReferenceRAF = requestAnimationFrame(animateGoldenReference);
}

function startGoldenReferenceTransition() {
  goldenReferenceTransition.style.display = "block";
  requestAnimationFrame(() => {
    goldenReferenceTransition.classList.add("active");
  });

  createGoldenReferenceParticles();
  resizeGoldenReference();
  goldenReferenceStarted = performance.now();
  cancelAnimationFrame(goldenReferenceRAF);
  goldenReferenceRAF = requestAnimationFrame(animateGoldenReference);

  goldenReferenceAudio.currentTime = 0;
  goldenReferenceAudio.play().catch(err => {
    console.warn("Golden reference audio:", err);
  });

  /* Gold atmosphere first. Video starts from 0:00 at the reveal point. */
  setTimeout(() => {
    goldenReferenceTransition.style.opacity = "0";
    cancelAnimationFrame(goldenReferenceRAF);
    setTimeout(() => {
      goldenReferenceTransition.classList.remove("active");
      goldenReferenceTransition.style.display = "none";
      goldenReferenceTransition.style.opacity = "";
    }, 950);
  }, 5600);
}

window.addEventListener("resize", resizeGoldenReference);

</script>

  document.querySelector(
    "#livingMorph"
  );

const livingPoster =
  document.querySelector(
    "#livingPoster"
  );

const goldenDustCanvas =
  document.querySelector(
    "#goldenDustCanvas"
  );

const goldenDustCtx =
  goldenDustCanvas.getContext("2d");

let goldenDustAnimation = null;
let goldenDustParticles = [];
let goldenDustStartedAt = 0;


/* =================================
   STATE
================================= */

let videos = [];

let targetsReady = false;

let experienceActive = false;

let currentVideo = null;

let currentPlane = null;

/* Prevent targetFound + targetUpdate from
   starting the same experience twice. */
let activationInProgress = false;


/* =================================
   VIDEO SIZE
================================= */

function fitVideoToScreen(video) {

  const vw =
    window.innerWidth;

  const vh =
    window.innerHeight;


  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  if (
    !videoWidth ||
    !videoHeight
  ) {

    video.style.width =
      vw + "px";

    video.style.height =
      vh + "px";

    return;

  }


  const ratio =
    videoWidth /
    videoHeight;


  if (
    vw / vh > ratio
  ) {

    video.style.height =
      vh + "px";

    video.style.width =
      (vh * ratio) + "px";

  } else {

    video.style.width =
      vw + "px";

    video.style.height =
      (vw / ratio) + "px";

  }

}


/* =================================
   MAGICAL SCANNER — TEST CONTROL
================================= */

function showMagicScanner() {
  magicScanner.classList.add("active");
}

function hideMagicScanner() {
  magicScanner.classList.remove("active");
}


/* =================================
   LOAD CONTENT
================================= */

async function loadContent() {

  try {

    loadingText.style.display =
      "block";


    loadingText.textContent =
      "LOADING AR EXPERIENCE...";


    const response =
      await fetch(
        "./content.json"
      );


    if (!response.ok) {

      throw new Error(
        "Could not load content.json"
      );

    }


    const data =
      await response.json();


    if (
      !data.posters ||
      data.posters.length === 0
    ) {

      throw new Error(
        "No posters found"
      );

    }


    /* ================================
       CREATE CONTENT
    ================================= */

    data.posters.forEach(
      poster => {


        const videoId =
          "video_" + poster.id;


        /* ================================
           VIDEO
        ================================= */

        const video =
          document.createElement(
            "video"
          );


        video.id =
          videoId;


        video.src =
          "./" + poster.video;


        video.loop =
          true;


        video.crossOrigin =
          "anonymous";


        video.playsInline =
          true;


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        /*
          Keep browser ready for playback.
        */

        video.preload =
          "auto";


        videoAssets.appendChild(
          video
        );


        videos.push(
          video
        );


        /* ================================
           TARGET
        ================================= */

        const target =
          document.createElement(
            "a-entity"
          );


        target.setAttribute(
          "mindar-image-target",

          "targetIndex: " +
          poster.targetIndex
        );


        /* ================================
           AR VIDEO PLANE
        ================================= */

        const videoPlane =
          document.createElement(
            "a-video"
          );


        videoPlane.setAttribute(
          "src",
          "#" + videoId
        );


        videoPlane.setAttribute(
          "position",
          "0 0 0"
        );


        videoPlane.setAttribute(
          "width",
          "1"
        );


        videoPlane.setAttribute(
          "height",
          "1"
        );


        videoPlane.setAttribute(
          "material",
          "shader: flat"
        );


        target.appendChild(
          videoPlane
        );


        scene.appendChild(
          target
        );


        /* ================================
           TARGET ACTIVATION
           TARGET FOUND + TARGET UPDATE

           Some devices can resume MindAR
           after closing without emitting a
           fresh targetFound event immediately.
           targetUpdate lets us re-arm the same
           poster without asking the user to
           point at a blank area first.
        ================================= */

        async function activateTarget() {

          if (
            experienceActive ||
            activationInProgress
          ) {

            return;

          }

          activationInProgress = true;

          console.log(
            "TARGET ACTIVATED:",
            poster.id
          );

          hideMagicScanner();

          

          showLivingMorph(poster.id, video);

          stopOtherVideos(video);

          currentVideo = video;
          currentPlane = videoPlane;

          videoPlane.setAttribute(
            "visible",
            "false"
          );

          try {

            video.currentTime = 0;
            video.muted = true;

            /* Start the SAME video silently now. This keeps mobile autoplay
               permission valid; the original video audio is restored when
               the cinematic reveal begins. */
            try {
              await video.play();
            } catch (playError) {
              console.warn("Muted video preload warning:", playError);
            }

            setTimeout(() => {

              startExperience(
                video,
                videoPlane
              );

            }, 450);

          } catch (error) {

            console.error(
              "Video play error:",
              error
            );

            activationInProgress = false;

          }

        }

        target.addEventListener(
          "targetFound",
          activateTarget
        );

        target.addEventListener(
          "targetUpdate",
          activateTarget
        );


        /* ================================
           TARGET LOST
        ================================= */

        target.addEventListener(
          "targetLost",

          () => {


            /*
              Once experience starts,
              poster tracking has no
              control over the video.
            */

            if (
              experienceActive
            ) {

              return;

            }


            video.pause();

          }
        );

      }
    );


    targetsReady =
      true;


    loadingText.style.display =
      "none";


    startButton.disabled =
      false;


    startButton.textContent =
      "START AR";


  } catch (error) {

    console.error(
      "Content error:",
      error
    );


    loadingText.textContent =
      "FAILED TO LOAD AR";


    startButton.disabled =
      true;

  }

}


/* =================================
   STOP OTHER VIDEOS
================================= */

function stopOtherVideos(
  currentVideo
) {

  videos.forEach(
    video => {

      if (
        video !== currentVideo
      ) {

        video.pause();

        video.currentTime =
          0;

      }

    }
  );

}



/* =================================
   GOLDEN DUST TRANSITION
   Full-screen canvas particles are used
   instead of hundreds of DOM elements so
   the effect stays smooth on phones.
================================= */

function resizeGoldenDustCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = window.innerWidth;
  const h = window.innerHeight;

  goldenDustCanvas.width = Math.round(w * dpr);
  goldenDustCanvas.height = Math.round(h * dpr);
  goldenDustCanvas.style.width = w + "px";
  goldenDustCanvas.style.height = h + "px";
  goldenDustCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createGoldenDustParticles() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const base = Math.round((w * h) / 7200);
  const count = Math.min(420, Math.max(280, base));
  const cx = w * 0.5;
  const cy = h * 0.50;

  goldenDustParticles = [];

  /* Main golden cloud: starts around the poster and expands across
     the entire screen, like dust being released into the air. */
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const startRadius = 6 + Math.random() * Math.min(w, h) * 0.13;
    const reach = Math.max(w, h) * (0.52 + Math.random() * 0.72);
    const size = Math.random() < 0.84
      ? 0.55 + Math.random() * 2.25
      : 2.1 + Math.random() * 4.6;

    goldenDustParticles.push({
      x: cx + Math.cos(angle) * startRadius * (0.25 + Math.random() * 0.75),
      y: cy + Math.sin(angle) * startRadius * (0.25 + Math.random() * 0.75),
      angle,
      startRadius,
      endRadius: reach,
      size,
      speed: 0.66 + Math.random() * 0.70,
      drift: (Math.random() - 0.5) * 1.15,
      phase: Math.random() * Math.PI * 2,
      twinkle: 0.52 + Math.random() * 0.48,
      delay: Math.random() * 0.28,
      warm: Math.random(),
      fall: Math.random() < 0.58,
      rain: false,
    });
  }

  /* Full-screen golden rain / floating dust layer. */
  const rainCount = Math.min(150, Math.max(100, Math.round(count * 0.34)));

  for (let i = 0; i < rainCount; i++) {
    goldenDustParticles.push({
      x: Math.random() * w,
      y: -30 - Math.random() * h * 0.55,
      angle: Math.PI / 2 + (Math.random() - 0.5) * 0.42,
      startRadius: 0,
      endRadius: 0,
      size: 0.55 + Math.random() * 2.7,
      speed: 0.54 + Math.random() * 0.80,
      drift: (Math.random() - 0.5) * 0.9,
      phase: Math.random() * Math.PI * 2,
      twinkle: 0.48 + Math.random() * 0.52,
      delay: Math.random() * 0.52,
      warm: Math.random(),
      fall: true,
      rain: true,
    });
  }
}

function drawGoldenDust(now) {
  if (!goldenDustStartedAt) return;

  const w = window.innerWidth;
  const h = window.innerHeight;
  const elapsed = (now - goldenDustStartedAt) / 1000;
  const duration = 3.25;
  const t = Math.min(1, elapsed / duration);

  goldenDustCtx.clearRect(0, 0, w, h);

  /* Deep black/gold atmosphere behind the particles. */
  const glow = goldenDustCtx.createRadialGradient(
    w * 0.5, h * 0.52, 0,
    w * 0.5, h * 0.52, Math.max(w, h) * 0.72
  );
  glow.addColorStop(0, "rgba(255,222,116,0.13)");
  glow.addColorStop(0.24, "rgba(212,175,55,0.055)");
  glow.addColorStop(0.62, "rgba(60,42,12,0.018)");
  glow.addColorStop(1, "rgba(0,0,0,0)");
  goldenDustCtx.fillStyle = glow;
  goldenDustCtx.fillRect(0, 0, w, h);

  goldenDustCtx.globalCompositeOperation = "lighter";

  for (const p of goldenDustParticles) {
    const local = Math.max(0, (elapsed - p.delay) * p.speed);

    if (p.rain) {
      const y = p.y + local * h * 0.62;
      const x = p.x + Math.sin(p.phase + local * 2.2) * 24 + p.drift * local * 28;
      if (y > h + 30) continue;

      const alphaIn = Math.min(1, local / 0.28);
      const alphaOut = Math.max(0, 1 - Math.max(0, local - 1.8) / 1.2);
      const alpha = alphaIn * alphaOut * p.twinkle * 0.70;
      const radius = p.size * (0.75 + Math.sin(p.phase + now * 0.004) * 0.16);

      goldenDustCtx.beginPath();
      goldenDustCtx.arc(x, y, Math.max(0.45, radius), 0, Math.PI * 2);
      goldenDustCtx.fillStyle = p.warm > 0.72
        ? `rgba(255,232,151,${alpha})`
        : `rgba(212,175,55,${alpha})`;
      goldenDustCtx.fill();
      continue;
    }

    const progress = Math.min(1, local / 2.55);
    if (progress <= 0) continue;

    const eased = 1 - Math.pow(1 - progress, 2.25);
    const radius = p.startRadius + (p.endRadius - p.startRadius) * eased;
    const wobble = Math.sin(p.phase + progress * 7.5) * (10 + progress * 24);
    const gravity = progress * progress * h * 0.18;
    const x = w * 0.5
      + Math.cos(p.angle) * radius
      + Math.cos(p.angle + Math.PI / 2) * wobble
      + p.drift * progress * 30;
    const y = h * 0.52
      + Math.sin(p.angle) * radius
      + gravity;

    if (x < -30 || x > w + 30 || y < -30 || y > h + 30) continue;

    const fadeIn = Math.min(1, progress / 0.14);
    const fadeOut = Math.max(0, 1 - Math.max(0, progress - 0.72) / 0.28);
    const alpha = fadeIn * fadeOut * p.twinkle * (0.72 + p.warm * 0.28);
    /* Pure particles only: no streaks or directional lines. */
    const radiusPx = p.size * (0.78 + progress * 0.72);
    const glowRadius = radiusPx * (2.9 + p.warm * 2.7);

    goldenDustCtx.beginPath();
    goldenDustCtx.arc(x, y, Math.max(0.5, glowRadius), 0, Math.PI * 2);
    goldenDustCtx.fillStyle = p.warm > 0.72
      ? `rgba(255,221,115,${alpha * 0.055})`
      : `rgba(212,175,55,${alpha * 0.045})`;
    goldenDustCtx.fill();

    goldenDustCtx.beginPath();
    goldenDustCtx.arc(x, y, Math.max(0.5, radiusPx), 0, Math.PI * 2);
    goldenDustCtx.fillStyle = p.warm > 0.72
      ? `rgba(255,236,168,${alpha})`
      : `rgba(222,181,63,${alpha})`;
    goldenDustCtx.fill();
  }

  goldenDustCtx.globalCompositeOperation = "source-over";

  if (t < 1.08 && livingMorph.classList.contains("active")) {
    goldenDustAnimation = requestAnimationFrame(drawGoldenDust);
  } else {
    goldenDustAnimation = null;
  }
}

function startGoldenDust() {
  if (goldenDustAnimation) {
    cancelAnimationFrame(goldenDustAnimation);
  }
  resizeGoldenDustCanvas();
  createGoldenDustParticles();
  goldenDustStartedAt = performance.now();
  goldenDustAnimation = requestAnimationFrame(drawGoldenDust);
}

function stopGoldenDust() {
  if (goldenDustAnimation) {
    cancelAnimationFrame(goldenDustAnimation);
    goldenDustAnimation = null;
  }
  goldenDustCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  goldenDustStartedAt = 0;
}

window.addEventListener("resize", () => {
  if (livingMorph.classList.contains("active")) {
    resizeGoldenDustCanvas();
  }
});


function showLivingMorph(posterId, video) {

  livingMorph.classList.remove("active");

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const videoW = video && video.videoWidth
    ? video.videoWidth
    : 16;

  const videoH = video && video.videoHeight
    ? video.videoHeight
    : 9;

  const ratio = videoW / videoH;

  /* Match the transition frame to the actual video ratio. */
  let frameW = Math.min(vw * 0.82, 430);
  let frameH = frameW / ratio;

  if (frameH > vh * 0.72) {
    frameH = vh * 0.72;
    frameW = frameH * ratio;
  }

  livingMorph.style.setProperty(
    "--morph-w",
    frameW + "px"
  );

  livingMorph.style.setProperty(
    "--morph-h",
    frameH + "px"
  );

  livingPoster.src =
    "./targets/" + posterId + ".jpg";

  livingPoster.style.display = "block";

  void livingMorph.offsetWidth;

  livingMorph.classList.add("active");

  /* Start the full-screen golden dust exactly when the poster
     begins its clean disappearance. */
  setTimeout(() => {
    if (livingMorph.classList.contains("active")) {
      startGoldenDust();
    }
  }, 1550);
}

function hideLivingMorph() {
  stopGoldenDust();
  livingMorph.classList.remove("active");
  livingPoster.removeAttribute("src");
}


/* =================================
   START EXPERIENCE
================================= */

async function startExperience(
  video,
  videoPlane
) {


  if (
    experienceActive
  ) {

    return;

  }


  /*
    LOCK IMMEDIATELY.

    Poster movement/loss cannot
    cancel this experience.
  */

  experienceActive =
    true;


  /*
    Hide the AR plane.
  */

  videoPlane.setAttribute(
    "visible",
    "false"
  );


  /*
    Wait for actual dimensions.
  */

  if (
    video.readyState < 1
  ) {

    await new Promise(
      resolve => {

        video.addEventListener(
          "loadedmetadata",
          resolve,
          {
            once: true
          }
        );

      }
    );

  }


  /*
    Move SAME video element
    out of A-Frame assets.

    No second video.
  */

  experience.appendChild(
    video
  );


  /*
    Make it visible.
  */

  video.style.display =
    "block";


  video.style.position =
    "fixed";


  video.style.left =
    "50%";


  video.style.top =
    "50%";


  video.style.zIndex =
    "10001";


  video.style.pointerEvents =
    "none";


  video.style.objectFit =
    "contain";


  video.style.background =
    "transparent";


  /* CINEMATIC SAME-FRAME MORPH */
  fitVideoToScreen(video);

  const finalWidth = video.style.width;
  const finalHeight = video.style.height;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const videoRatio =
    video.videoWidth && video.videoHeight
      ? video.videoWidth / video.videoHeight
      : 16 / 9;

  let posterFrameW = Math.min(vw * 0.82, 430);
  let posterFrameH = posterFrameW / videoRatio;

  if (posterFrameH > vh * 0.72) {
    posterFrameH = vh * 0.72;
    posterFrameW = posterFrameH * videoRatio;
  }

  video.style.width = posterFrameW + "px";
  video.style.height = posterFrameH + "px";
  video.style.objectFit = "cover";
  video.style.opacity = "0";
  video.style.borderRadius = "3px";
  video.style.transform = "translate(-50%, -50%) scale(.985)";
  video.style.clipPath = "inset(0 0 0 0 round 3px)";

  video.style.transition =
    "width 2.55s cubic-bezier(0.16, 1, 0.3, 1), " +
    "height 2.55s cubic-bezier(0.16, 1, 0.3, 1), " +
    "opacity 1.0s ease, " +
    "transform 2.55s cubic-bezier(0.16, 1, 0.3, 1), " +
    "clip-path 2.55s cubic-bezier(0.16, 1, 0.3, 1)";

  void video.offsetWidth;

  experience.style.display = "block";
  experience.classList.add("showClose");

  /*
    The poster is held first. The golden dust then expands to full screen.
    At the dust peak, the SAME video element emerges from the centre frame
    and grows smoothly while the particle field fades away.
  */
  startGoldenReferenceTransition();

      setTimeout(async () => {
        video.currentTime = 0;
        video.muted = false;
        try {
          await video.play();
        } catch (e) {
          console.warn("Video playback:", e);
        }
        video.style.opacity = "1";
      video.style.width = finalWidth + "px";
      video.style.height = finalHeight + "px";
      video.style.transform = "translate(-50%, -50%)";
    }, 5600);


  /*
    IMPORTANT:

    Stop MindAR AFTER the video
    has already started.

    The video itself continues.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    await arSystem.stop();


    console.log(
      "MindAR stopped after hand-off."
    );


  } catch (error) {

    console.log(
      "MindAR stop:",
      error
    );

  }


  status.textContent =
    "✦ ENJOY THE EXPERIENCE ✦";

}


/* =================================
   CLOSE EXPERIENCE
================================= */

async function closeExperience(
  event
) {


  if (event) {

    event.preventDefault();

    event.stopPropagation();

  }


  /*
    Stop current video.
  */

  if (
    currentVideo
  ) {

    currentVideo.pause();


    currentVideo.currentTime =
      0;


    /*
      Return SAME video element
      to A-Frame assets.
    */

    videoAssets.appendChild(
      currentVideo
    );


    /*
      Clear fullscreen styles.
    */

    currentVideo.style.display =
      "";


    currentVideo.style.position =
      "";


    currentVideo.style.left =
      "";


    currentVideo.style.top =
      "";


    currentVideo.style.width =
      "";


    currentVideo.style.height =
      "";


    currentVideo.style.zIndex =
      "";


    currentVideo.style.pointerEvents =
      "";


    currentVideo.style.objectFit =
      "";


    currentVideo.style.background =
      "";


    currentVideo.style.opacity =
      "";


    currentVideo.style.borderRadius =
      "";


    currentVideo.style.transform =
      "";


    currentVideo.style.clipPath =
      "";


    currentVideo.style.transition =
      "";

    currentVideo.style.opacity =
      "";

    currentVideo.style.borderRadius =
      "";

    currentVideo.style.transform =
      "";

    currentVideo.style.clipPath =
      "";

  }


  /*
    IMPORTANT:

    Keep the AR video plane hidden
    after closing.

    Otherwise A-Frame can keep the
    last rendered video frame visible
    inside the scanner.
  */

  if (
    currentPlane
  ) {

    currentPlane.setAttribute(
      "visible",
      "false"
    );

  }


  /*
    Hide experience.
  */

  hideLivingMorph();

  experience.classList.remove(
    "showClose"
  );


  experience.style.display =
    "none";


  /*
    Reset every AR video plane so
    no previous video's rendered frame
    remains in the scanner.
  */

  scene.querySelectorAll(
    "[mindar-image-target] a-video"
  ).forEach(
    plane => {

      plane.setAttribute(
        "visible",
        "false"
      );

    }
  );


  /*
    Reset state.
  */

  experienceActive =
    false;

  /* Re-arm detection so the next target
     can trigger immediately after close. */
  activationInProgress = false;


  currentVideo =
    null;


  currentPlane =
    null;


  status.textContent =
    "RESTARTING CAMERA...";


  hideMagicScanner();


  /*
    Restart MindAR.
  */

  try {

    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    await arSystem.start();


    status.textContent =
      "POINT CAMERA AT YOUR POSTER";


    showMagicScanner();


  } catch (error) {

    console.error(
      "AR restart error:",
      error
    );


    status.textContent =
      "POINT CAMERA AT YOUR POSTER";

  }

}


/* =================================
   CLOSE BUTTON
================================= */

closeButton.addEventListener(
  "click",
  closeExperience
);


closeButton.addEventListener(
  "touchend",

  event => {

    event.preventDefault();

    event.stopPropagation();

    closeExperience(event);

  },

  {
    passive: false
  }
);


/* =================================
   RESIZE
================================= */

window.addEventListener(
  "resize",

  () => {

    if (
      experienceActive &&
      currentVideo
    ) {

      fitVideoToScreen(
        currentVideo
      );

    }

  }
);


/* =================================
   START AR
================================= */

startButton.addEventListener(
  "click",

  async () => {


    if (
      !targetsReady
    ) {

      return;

    }


    startButton.style.display =
      "none";


    loadingText.style.display =
      "none";


    status.textContent =
      "STARTING CAMERA...";


    const arSystem =
      scene.systems[
        "mindar-image-system"
      ];


    try {
await arSystem.start();


      status.textContent =
        "POINT CAMERA AT YOUR POSTER";


      showMagicScanner();


    } catch (error) {

      console.error(
        "AR start error:",
        error
      );


      startButton.style.display =
        "block";


      startButton.textContent =
        "START AR";


      status.textContent =
        "CAMERA START FAILED";

    }

  }
);


/* =================================
   LOAD
================================= */

loadContent();

</script>

</body>
